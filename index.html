<script>
/* ================= AI upload ================= */
async function extractContent(file){
  const ext=extOf(file.name),kind=kindOf(file.name,file.type);let text='',image=null;
  try{
    if(kind==='pdf'){const pdf=await openPdfDoc(await file.arrayBuffer());for(let i=1;i<=Math.min(3,pdf.numPages);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(t=>t.str).join(' ')+'\n'}
      if(text.replace(/\s/g,'').length<60){const pg=await pdf.getPage(1);const vp=pg.getViewport({scale:1.4});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;image=await new Promise(r=>c.toBlob(r,'image/jpeg',.82))}}
    else if(ext==='docx'){await loadScript(LIB.mammoth);text=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}
    else if(['xlsx','xls','ods','csv'].includes(ext)){await loadScript(LIB.xlsx);const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});text=wb.SheetNames.slice(0,3).map(n=>'# '+n+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n')}
    else if(kind==='img')image=file;
    else if(['txt','md','rtf','json'].includes(ext))text=await file.text();
  }catch(e){console.warn('extract',e)}
  return {text:text.replace(/[ \t]+/g,' ').slice(0,9000),image};
}
function findDate(s){
  let m=s.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](20\d{2})\b/);if(m){let a=+m[1],b=+m[2];if(a>12){[a,b]=[b,a]}return `${m[3]}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}`}
  m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2}),?\s+(20\d{2})/i);if(m)return `${m[3]}-${String(MONTHS.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase())+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  m=s.match(/\b(\d{1,2})\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?,?\s+(20\d{2})/i);if(m)return `${m[3]}-${String(MONTHS.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase())+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/\b(20\d{2})(\d{2})(\d{2})\b/);if(m&&+m[2]<=12&&+m[3]<=31)return `${m[1]}-${m[2]}-${m[3]}`;
  return null}
function heuristic(text,filename){
  const s=(filename+'\n'+text);const low=s.toLowerCase();const c=S.config;
  const isPms=/preventive\s+maintenance|\bpms\b|maintenance\s+checklist|pm\s+schedule/.test(low);
  const isTr=/technical\s+report|damage|incident|crack|leak|broken|corros|defect|failure|fault|\btr\b/.test(low);
  const category=isPms?'PMS':isTr?'TR':'OTHER';
  const pick=list=>(list||[]).find(x=>x&&low.includes(x.toLowerCase()));
  let gate=pick(c.gates);if(!gate){const m=s.match(/\bgate\s*(no\.?\s*)?([A-Z0-9]{1,4})\b/i);if(m)gate='Gate '+m[2]}
  let site=(c.sites||[]).find(x=>normSite(s).includes(normSite(x)));if(!site){const m=s.match(/\bsite(?:\s*name)?\s*[:\-]\s*([^\n,;]{3,40})/i);if(m)site=m[1].trim()}
  let damage=pick(c.damageTypes);if(!damage){const m=s.match(/\b(crack(?:ed)?|leak(?:age)?|corrosion|broken|fault|dent|deformation|rust|spall(?:ing)?|short circuit)\b/i);if(m)damage=m[1]}
  let place=null;{const m=s.match(/\b(?:location|place|area|equipment)\s*[:\-]\s*([^\n,;]{3,40})/i);if(m)place=m[1].trim()}
  return {category,date:findDate(s),gate,site:site?canonSite(site):'',damage,place:place||site,title:filename.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),summary:'',confidence:category==='OTHER'?0.35:0.55,source:'rules'};
}
async function aiAnalyze(file,extracted){
  const base=heuristic(extracted.text,file.name);const sample=S.cap.sample;
  if(!sample)return base;
  let images;
  if(extracted.image){try{const lim=await sample.limits();if(lim.images&&extracted.image.size<=lim.images.maxInputBytes&&lim.images.mediaTypes.includes(extracted.image.type))images=[extracted.image]}catch(e){}}
  if(!extracted.text.trim()&&!images)return base;
  const c=S.config;
  const prompt=`You classify company documents for a facility-documentation system and extract fields for its file-naming convention.

Categories:
- "TR": a Technical Report about damage, an incident, defect or failure at a gate/place and site.
- "PMS": a Preventive Maintenance Services record (scheduled maintenance, checklists, inspections done routinely).
- "OTHER": anything else.

Known gates/places: ${c.gates.join(', ')||'none listed'}
Known site names: ${(c.sites||[]).join(', ')||'none listed'}
Known damage types: ${c.damageTypes.join(', ')||'none listed'}
Today is ${isoToday()}.

Return ONLY a JSON object with these keys:
{"category":"TR"|"PMS"|"OTHER","date":"YYYY-MM-DD or null (the report/inspection date written in the document, not today unless nothing else is present)","gate_or_place":"gate or place for TR, e.g. 'Gate 3', or null","site_name":"the site this document belongs to (for ANY category). Must be exactly one of the known site names when the document mentions it, even with different spacing or case; otherwise the site written in the document; or null","damage":"2-4 word damage description for TR, e.g. 'Cracked bollard', or null","pms_place":"place/equipment area for PMS, or null","title":"short 2-5 word title for OTHER, or null","summary":"one plain sentence describing the document","confidence":number between 0 and 1}
Prefer values from the known lists when they match. Do not invent values that are not supported by the document.

Original file name: ${file.name}
Document text${images?' (also see the attached page image)':''}:
"""
${(extracted.text||'(no extractable text)').slice(0,S.localInfo?.aiTextLimit||9000)}
"""`;
  try{
    const r=await sample.json(prompt,{modelTier:'quick',images});
    if(!r||typeof r!=='object')return base;
    const cat=['TR','PMS','OTHER'].includes(r.category)?r.category:base.category;
    return {category:cat,date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:base.date,gate:r.gate_or_place||base.gate,site:canonSite(r.site_name||base.site),damage:r.damage||base.damage,place:r.pms_place||r.gate_or_place||base.place,title:r.title||base.title,summary:r.summary||'',confidence:Math.max(0,Math.min(1,+r.confidence||0.7)),source:'ai'};
  }catch(e){if(e&&e.code==='not_granted')S.aiDenied=true;else if(e&&e.code==='rate_limited')toast('The AI is busy. Using rule-based naming for now.',true);return base}
}
function queueFiles(list){
  for(const file of list){
    const lim=S.mode==='local'?(S.localInfo?.maxUploadMB||500):20;if(file.size>lim*1024*1024){toast(`${file.name} is over ${lim} MB and was skipped.`,true);continue}
    const it={id:uid(),file,status:'analyzing',f:null};S.uploads.push(it);
    (async()=>{const ex=await extractContent(file);it.f=await aiAnalyze(file,ex);if(!it.f.date)it.f.date=isoToday();if(S.uploadSite&&!it.f.site)it.f.site=S.uploadSite;if(S.batchFolder&&!it.folder)it.folder=S.batchFolder;it.status='review';renderUploadList()})();
  }
  renderUploadList();
}
VIEWS.upload={html(){const c=S.config;return `<div class="page-head"><div><div class="eyebrow">Smart intake</div><h1>AI Upload</h1><p class="sub">Drop reports in any format. File Org reads each one, decides whether it is a Technical Report or a PMS record, detects the site, and proposes a name in the company convention. Each file is saved into its site's folder. Check the fields, then save.</p></div>${S.uploads.some(u=>u.status==='review')?`<button class="btn primary" id="saveAll">${I('check')}Save all reviewed</button>`:''}</div>
  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose files to upload">${I('upload')}<h3>Drop files here or click to browse</h3><p class="muted" style="margin:6px 0 0">PDF, Word, Excel, images and text · up to ${S.mode==='local'?(S.localInfo?.maxUploadMB||500):20} MB each</p>
  ${S.mode==='local'&&S.localInfo?.aiEnabled?`<div class="muted" style="font-size:12px;margin-top:10px">Read by ${S.localInfo.aiProvider==='gemini'?'Google Gemini (free)':S.localInfo.aiProvider==='local'?'free local AI':'Claude'} · <span class="mono">${esc(S.localInfo.aiModel)}</span>${S.localInfo.aiProvider==='local'?' · stays on this network':''}${S.localInfo.aiProvider==='gemini'?' <button class="btn sm ghost" id="gdAiSet" type="button" style="height:24px;margin-left:6px">Change</button>':''}</div>`:''}<div class="rule-line"><code><span class="seg-tr">TR</span>_DATE_GATE-OR-PLACE_SITENAME_DAMAGE</code><code><span class="seg-pms">TR</span>_DATE_PLACE_<span class="seg-pms">PMS</span></code></div></div>
  ${S.uploadSite?`<div class="banner" style="margin-top:14px">${I('pin')}<span>Files without a detected site will be filed under <b>${esc(S.uploadSite)}</b>.</span><button class="btn sm ghost" id="clrSite" style="margin-left:auto">Clear</button></div>`:''}${!S.cap.sample?`<div class="banner" style="margin-top:14px">${I('info')}<span>${S.localInfo?.storage==='gdrive'?`<b>AI reading is off.</b> Names come from built-in rules that read Date of Service, Branch, Subject and Location. <button class="btn sm" id="gdAiSet" type="button" style="margin-left:6px">${I('sparkle')}Turn on free AI</button>`:S.mode==='local'?`<b>AI reading is off on the office PC.</b> Names come from built-in rules until it is on.${S.localInfo?.aiNote?` <span class="muted">Reason: ${esc(S.localInfo.aiNote)}</span>`:''} <button class="btn sm" id="aiRecheck" type="button" style="margin-left:6px">${I('refresh')}Check again</button>`:'AI reading is not available in this view, so names come from rule-based detection of dates, gates and keywords. Review each one before saving.'}</span></div>`:''}
  <div class="card" id="uList" style="margin-top:16px"></div>`},
  soft(){updateNavMeta()},
  bind(v){const d=$('#drop',v),inp=$('#hiddenFile');inp.accept='.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.md,.png,.jpg,.jpeg,.webp,.gif,.pptx,.odt,.ods';
    d.onclick=()=>{inp.value='';inp.onchange=()=>queueFiles([...inp.files]);inp.click()};d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();d.click()}};
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();d.classList.remove('over');queueFiles([...e.dataTransfer.files])};
    $('#aiRecheck',v)&&($('#aiRecheck',v).onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.innerHTML='<span class="spinner"></span>Checking…';try{const info=await LocalAPI.recheckAI();toast(info.aiEnabled?'AI reading is on: '+info.aiModel:'Still off: '+(info.aiNote||'local AI not found'),!info.aiEnabled)}catch(err){toast('Could not reach the File Org server.',true)}renderView()});
    $('#clrSite',v)&&($('#clrSite',v).onclick=()=>{S.uploadSite=null;renderView()});
    $('#saveAll',v)&&($('#saveAll',v).onclick=async()=>{for(const it of S.uploads.filter(u=>u.status==='review'))await saveUpload(it)});
    renderUploadList()}};
function destOf(it){return it.folder||folderFor(it.f.category,it.f.date,it.f.site)}
function folderOptions(selected,autoLabel){const fs=allFolders();if(selected&&!fs.includes(selected))fs.push(selected);fs.sort();return `<option value="">${esc(autoLabel)}</option><optgroup label="Choose a folder">${fs.map(p=>`<option value="${esc(p)}" ${p===selected?'selected':''}>${esc(p)}</option>`).join('')}</optgroup><option value="__new">+ New folder…</option>`}
function destPicker(it){const auto=folderFor(it.f.category,it.f.date,it.f.site);const many=S.uploads.filter(u=>u.status==='review').length>1;return `<div class="dest"><span class="dest-l">${I('folder')}Save to</span><select class="select input" id="u-dest-${it.id}" data-dest="${it.id}" aria-label="Destination folder">${folderOptions(it.folder,'Automatic · '+auto)}</select>${many?`<button class="btn sm ghost" data-destall="${it.id}" type="button">Use for all</button>`:''}</div>${it.folder?`<div class="dest-path mono">${esc(it.folder)} / <b>${esc(buildName(it.f,extOf(it.file.name)))}</b></div>`:''}`}
function uploadFields(it){const f=it.f;return `<div class="ufields">
  <div class="field"><label for="u-cat-${it.id}">Type</label><select class="select input" id="u-cat-${it.id}" data-k="category">${Object.entries(CATS).map(([k,c])=>`<option value="${k}" ${k===f.category?'selected':''}>${k==='OTHER'?'General':k} · ${c.label}</option>`).join('')}</select></div>
  <div class="field"><label for="u-date-${it.id}">Report date</label><input class="input" type="date" id="u-date-${it.id}" data-k="date" value="${esc(f.date||'')}"></div>
  <div class="field"><label for="u-site-${it.id}">Site <span data-newsite style="color:var(--brass)">${f.site&&!isKnownSite(f.site)?'· new site':''}${!f.site?'· not detected':''}</span></label><input class="input" id="u-site-${it.id}" data-k="site" list="gSites" value="${esc(f.site||'')}" placeholder="Choose a site"></div>
  ${f.category==='TR'?`<div class="field"><label for="u-gate-${it.id}">Gate or place</label><input class="input" id="u-gate-${it.id}" data-k="gate" list="dl-gates" value="${esc(f.gate||'')}"></div><div class="field"><label for="u-dmg-${it.id}">Damage</label><input class="input" id="u-dmg-${it.id}" data-k="damage" list="dl-dmg" value="${esc(f.damage||'')}"></div>`:
   f.category==='PMS'?`<div class="field"><label for="u-place-${it.id}">Place</label><input class="input" id="u-place-${it.id}" data-k="place" list="dl-sites" value="${esc(f.place||'')}"></div>`:
   `<div class="field"><label for="u-title-${it.id}">Title</label><input class="input" id="u-title-${it.id}" data-k="title" value="${esc(f.title||'')}"></div>`}
</div>`}

      <div style="margin-top:10px" class="proposed" data-name>${catChip(it.f.category)}<span>${nameHtml(name)}</span></div>
      ${it.f.summary?`<p style="margin:8px 0 0;font-size:13px;color:var(--ink-2)">${esc(it.f.summary)}</p>`:''}
      ${dupNote(it)}${uploadFields(it)}
      ${destPicker(it)}
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center"><button class="btn primary" data-save="${it.id}" ${it.status==='saving'?'disabled':''}>${it.status==='saving'?'<span class="spinner"></span>Saving…':I('check')+'Save to '+esc(destOf(it))}</button>${S.cap.sample?`<button class="btn ghost" data-rerun="${it.id}">${I('refresh')}Re-read</button>`:''}<button class="btn ghost danger" data-rm="${it.id}">Remove</button></div>
    </div></div>`}).join('');
  $('#clearDone',box).onclick=()=>{S.uploads=S.uploads.filter(u=>u.status!=='saved');renderUploadList()};
  $$('[data-u]',box).forEach(row=>{const it=S.uploads.find(u=>u.id===row.dataset.u);
    row.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;it.f[k]=e.target.value;if(k==='category'){renderUploadList();return}const ext=extOf(it.file.name);$('[data-name]',row).innerHTML=catChip(it.f.category)+`<span>${nameHtml(buildName(it.f,ext))}</span>`;const sb=$('[data-save]',row);if(sb)sb.innerHTML=I('check')+'Save to '+esc(destOf(it));const ao=$('[data-dest] option[value=""]',row);if(ao)ao.textContent='Automatic · '+folderFor(it.f.category,it.f.date,it.f.site);const ns=$('[data-newsite]',row);if(ns)ns.textContent=it.f.site&&!isKnownSite(it.f.site)?'· new site':!it.f.site?'· not detected':''});
    row.addEventListener('change',e=>{if(e.target.dataset.k==='category')renderUploadList()})});
  $$('[data-save]',box).forEach(b=>b.onclick=()=>saveUpload(S.uploads.find(u=>u.id===b.dataset.save)));
  $$('[data-dest]',box).forEach(sel=>sel.onchange=async()=>{const it=S.uploads.find(u=>u.id===sel.dataset.dest);if(sel.value==='__new'){const auto=folderFor(it.f.category,it.f.date,it.f.site);const p=await promptBox('New folder','Folder path. Use / for subfolders, for example Parkmall/Contracts/2026',it.folder||auto.split('/')[0]+'/');const clean=p&&p.split('/').map(s=>s.trim().replace(/[<>:"\\|?*]/g,'-')).filter(Boolean).join('/');if(clean){it.folder=canonPath(clean);if(!allFolders().includes(clean))DB.add('folders',{path:clean,created:Date.now(),by:S.me.id}).catch(()=>{})}}else it.folder=sel.value||null;renderUploadList()});
  $$('[data-destall]',box).forEach(b=>b.onclick=()=>{const src=S.uploads.find(u=>u.id===b.dataset.destall);S.uploads.filter(u=>u.status==='review'||u.status==='analyzing').forEach(u=>u.folder=src.folder);toast(src.folder?'All files in the queue will be saved to '+src.folder:'All files will be filed automatically');renderUploadList()});
  $$('[data-rm]',box).forEach(b=>b.onclick=()=>{S.uploads=S.uploads.filter(u=>u.id!==b.dataset.rm);renderUploadList()});
  $$('[data-rerun]',box).forEach(b=>b.onclick=async()=>{const it=S.uploads.find(u=>u.id===b.dataset.rerun);it.status='analyzing';renderUploadList();const ex=await extractContent(it.file);it.f=await aiAnalyze(it.file,ex);if(!it.f.date)it.f.date=isoToday();it.status='review';renderUploadList()});
}
async function saveUpload(it){
  if(!it||it.status!=='review')return;it.status='saving';renderUploadList();
  const file=it.file,ext=extOf(file.name),kind=kindOf(file.name,file.type);const f=it.f;
  f.site=canonSite(f.site);if(f.category==='PMS'&&!f.place)f.place=f.site;const name=buildName(f,ext);const {category,date,summary,confidence,source,...rest}=f;
  const meta={name,originalName:file.name,ext,kind,mime:file.type,size:file.size,category,date,fields:{gate:rest.gate||'',site:rest.site||'',damage:rest.damage||'',place:rest.place||'',title:rest.title||''},folder:it.folder||folderFor(category,date,rest.site),ai:{confidence,summary,source}};
  try{
    const rawOk=S.mode==='local'||kind==='pdf'||kind==='img'||['txt','md','csv','json'].includes(ext);
    let id;
    if(rawOk)id=await saveFileToLibrary(meta,file,false);
    else{const b64=ab2b64(await file.arrayBuffer());id=await saveFileToLibrary(meta,{fo:1,kind:'bin',mime:file.type,name:file.name,b64},true)}
    it.status='saved';it.fileId=id;it.savedName=name;it.savedFolder=meta.folder;logAct('uploaded',name,id);
    if(rest.site&&!isKnownSite(rest.site)){try{await saveConfig({sites:[...(S.config.sites||[]),rest.site]});toast('Added new site '+rest.site)}catch(e){}}
  }catch(e){it.status='review';toast((e&&e.message)||'Upload failed. Try again.',true)}
  renderUploadList();
}

function unreadCount(){const me=S.me.id||'me';return S.messages.filter(m=>m.created>S.lastSeen&&m.uid!==me).length}
function markSeen(){const last=S.messages[S.messages.length-1];if(last&&last.created>S.lastSeen){S.lastSeen=last.created;store.set('lastSeen',S.lastSeen);updateNavMeta()}}
function onMessages(){if(currentRoute()==='chat'){renderChatInto($('#chatPane'),false);markSeen();updateNavMeta();return}if(S.dockOpen){renderDock();markSeen()}updateNavMeta();if(currentRoute()==='dashboard')softRender()}
async function sendMessage(text,channel,fileId){text=(text||'').trim();if(!text&&!fileId)return;try{await DB.add('messages',{uid:S.me.id||'me',channel,text,fileId:fileId||null,created:Date.now()});if(S.mode==='demo')onMessages()}catch(e){toast(dbErr(e),true)}}
function chatHtml(compact){
  const ch=S.chatChannel;const me=S.me.id||'me';const msgs=S.messages.filter(m=>(m.channel||'general')===ch);
  let out='',prev=null,prevDay='';
  msgs.forEach(m=>{const day=new Date(m.created).toDateString();if(day!==prevDay){out+=`<div class="day-sep">${day===new Date().toDateString()?'Today':new Date(m.created).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})}</div>`;prevDay=day;prev=null}
    const cont=prev&&prev.uid===m.uid&&m.created-prev.created<300000;const f=m.fileId&&fileById(m.fileId);
    out+=`<div class="msg ${cont?'cont':''}">${avatar(m.uid)}<div class="body">${cont?'':`<div class="meta"><b>${esc(nameOf(m.uid))}</b><span>${new Date(m.created).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</span></div>`}${m.text?`<div class="text">${esc(m.text)}</div>`:''}${f?`<button class="att" data-open="${f.id}">${ficon(f.kind,f.ext)}<span class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</span></button>`:''}${m.uid===me?`<button class="btn sm ghost" data-delmsg="${m.id}" style="height:22px;font-size:11px;padding:0 6px;opacity:.6">Delete</button>`:''}</div></div>`;prev=m});
  return out||`<div class="empty">${I('chat')}<b>No messages in #${esc(ch)}</b><span>Start the conversation. Everyone at the company can read this channel.</span></div>`;
}
function renderChatInto(root,compact){
  if(!root)return;const list=$('.chat-list',root);if(!list)return;const atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<80;
  list.innerHTML=chatHtml(compact);if(atBottom||!list.dataset.init){list.scrollTop=list.scrollHeight;list.dataset.init=1}
  $$('[data-delmsg]',list).forEach(b=>b.onclick=async()=>{try{await DB.del('messages',b.dataset.delmsg);if(S.mode==='demo')onMessages()}catch(e){toast(dbErr(e),true)}});
  renderTyping();
}
function renderTyping(){const now=Date.now();const ids=Object.entries(S.typing).filter(([id,t])=>now-t.at<3000&&t.ch===S.chatChannel).map(([id])=>nameOf(id));$$('.typing').forEach(el=>el.textContent=ids.length?ids.join(', ')+(ids.length>1?' are':' is')+' typing…':'')}
let typingSent=0;
function chatComposer(root){
  const ta=$('textarea',root),btn=$('[data-send]',root);
  const send=()=>{sendMessage(ta.value,S.chatChannel);ta.value='';ta.style.height=''};
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';if(S.cap.room&&Date.now()-typingSent>2000){typingSent=Date.now();S.cap.room.emit('typing',{uid:S.me.id,channel:S.chatChannel}).catch(()=>{})}});
  btn.onclick=send;
  $('[data-attach]',root).onclick=async()=>{const files=live().sort((a,b)=>b.updated-a.updated).slice(0,40);const v=await modal({title:'Attach a library file',body:`<div class="field"><label for="att-sel">File</label><select class="select input" id="att-sel">${files.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>`,actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:'Attach',cls:'primary',value:sc=>$('#att-sel',sc).value}]});if(v)sendMessage(ta.value,S.chatChannel,v),ta.value=''};
}
const composerHtml=(where='page')=>`<div class="typing"></div><div class="chat-input"><button class="btn icon ghost" data-attach aria-label="Attach a file">${I('clip')}</button><textarea class="input" id="chatTa-${where}" rows="1" placeholder="Message #${esc(S.chatChannel)}"></textarea><button class="btn primary icon" data-send aria-label="Send">${I('send')}</button></div>`;
VIEWS.chat={html(){return `<div class="page-head"><div><div class="eyebrow">Everyone at the company</div><h1>Team Chat</h1></div><div class="presence-inline muted" style="font-size:13px">${S.peers.length?S.peers.length+' teammate'+(S.peers.length>1?'s':'')+' online now':''}</div></div>

<script>
/* ---------- sites ---------- */
function siteStats(site){const files=live().filter(f=>normSite(siteOf(f))===normSite(site));const last=files.reduce((m,f)=>Math.max(m,f.created||0),0);return {files,total:files.length,tr:files.filter(f=>f.category==='TR').length,pms:files.filter(f=>f.category==='PMS').length,last}}
VIEWS.sites={html(){
  const sites=(S.config.sites||[]).slice().sort((a,b)=>a.localeCompare(b));const q=(S.siteQ||'').toLowerCase();

  const unassigned=live().filter(f=>!isKnownSite(siteOf(f)));
  const active=sites.filter(s=>siteStats(s).total).length;
  const card=s=>{const st=siteStats(s),gen=st.total-st.tr-st.pms;const n=(v,l,c)=>`<div><b class="${v?'':'z'}">${v}</b><span><i class="dot" style="background:${c}"></i>${l}</span></div>`;
    return `<div class="card site-card" data-site="${esc(s)}" tabindex="0" role="button" aria-label="Open ${esc(s)} folder">
    <div class="site-top"><span class="site-pin">${I('pin')}</span><div class="site-name"><b title="${esc(s)}">${esc(s)} <small class="site-code">${esc(siteCode(s))}</small></b><span>${st.total?`${st.total} file${st.total===1?'':'s'} · last upload ${ago(st.last)}`:'No files yet'}</span></div><button class="btn sm icon ghost" data-smore="${esc(s)}" aria-label="Actions for ${esc(s)}">${I('more')}</button></div>
    <div class="site-stats">${n(st.tr,'TR','var(--tr)')}${n(st.pms,'PMS','var(--pms)')}${n(gen,'General','var(--oth)')}</div>
    <div class="site-bar">${st.total?`${st.tr?`<i style="flex:${st.tr};background:var(--tr)"></i>`:''}${st.pms?`<i style="flex:${st.pms};background:var(--pms)"></i>`:''}${gen?`<i style="flex:${gen};background:var(--oth)"></i>`:''}`:''}</div>
    <div class="site-foot"><span class="path">${esc(s)} / Technical Reports / …</span><button class="btn sm" data-sup="${esc(s)}">${I('upload')}Upload</button></div></div>`};
  return `<div class="page-head"><div><div class="eyebrow">Filing by location</div><h1>Sites</h1><p class="sub">Every upload is filed under its site, then by type, year and month. The AI matches each report to one of these names.</p></div><div class="toolbar"><button class="btn" id="refile">${I('refresh')}Re-file by site</button>${S.mode==='local'?`<button class="btn" id="scanDisk" title="Add files that were copied into the PC folder directly">${I('folder')}Sync PC folder</button>`:''}<button class="btn primary" id="addSites">${I('plus')}Add sites</button></div></div>${loadingNote()}
  <div class="sites-sum"><div class="card"><span class="site-pin">${I('pin')}</span><div><b class="num">${sites.length}</b><br><span>Sites on file</span></div></div><div class="card"><span class="site-pin" style="background:var(--pms-soft);color:var(--pms)">${I('chart')}</span><div><b class="num">${active}</b><br><span>Sites with uploads</span></div></div><div class="card"><span class="site-pin" style="background:var(--brass-soft);color:var(--brass)">${I('alert')}</span><div><b class="num">${unassigned.length}</b><br><span>Files without a site</span></div></div></div>
  <div class="toolbar" style="margin-bottom:14px"><label class="search" for="siteQ" style="max-width:340px;flex:1">${I('search')}<input id="siteQ" placeholder="Filter ${sites.length} site${sites.length===1?'':'s'}" value="${esc(S.siteQ||'')}" autocomplete="off"></label></div>
  <div class="site-grid">${shown.map(card).join('')}
  ${unassigned.length&&!q?`<div class="card site-card unassigned" data-site="Unassigned" tabindex="0" role="button"><div class="site-top"><span class="site-pin">${I('alert')}</span><div class="site-name"><b>Unassigned</b><span>${unassigned.length} file${unassigned.length===1?'':'s'} need a site</span></div></div><p class="muted" style="margin:0 16px 16px;font-size:12.5px">Open a file, choose Details & naming, and set its site. It moves into that site's folder.</p></div>`:''}
  ${!q?`<button class="site-add" id="addSites2">${I('plus')}Add more sites</button>`:''}</div>
  ${q&&!shown.length?`<div class="empty">${I('search')}<b>No site matches "${esc(S.siteQ)}"</b><span>Check the spelling or add it as a new site.</span></div>`:''}`},

    $('#scanDisk',v)&&($('#scanDisk',v).onclick=async()=>{try{const r=await LocalAPI.req('POST','/api/scan',{});toast(r.added?`Added ${r.added} file${r.added===1?'':'s'} found in the PC folder`:'Everything in the PC folder is already in File Org')}catch(e){toast(e.message,true)}});
    $$('[data-site]',v).forEach(c=>{c.onkeydown=e=>{if(e.key==='Enter'&&e.target===c)c.click()}});

    $('#addSites',v).onclick=async()=>{const r=await modal({title:'Add sites',body:`<div class="field"><label for="ns-list">Site names, one per line</label><textarea class="input" id="ns-list" rows="8" placeholder="Parkmall&#10;MCIA&#10;GORORDO"></textarea></div><p class="muted" style="margin:0;font-size:12.5px">Duplicates are skipped, even with different spacing or case.</p>`,actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:'Add sites',cls:'primary',value:sc=>$('#ns-list',sc).value}]});if(!r)return;
      const cur=[...(S.config.sites||[])];let added=0;r.split('\n').map(s=>s.trim().replace(/\//g,'-')).filter(Boolean).forEach(s=>{if(!cur.some(x=>normSite(x)===normSite(s))){cur.push(s);added++}});

      {label:'Remove site',icon:'trash',danger:true,run:()=>removeSite(s)}])});

async function renameSite(old){const n=await promptBox('Rename site','New name for '+old,old);if(!n||n===old)return;const name=n.replace(/\//g,'-');if((S.config.sites||[]).some(x=>x!==old&&normSite(x)===normSite(name))){toast('A site with that name already exists.',true);return}

      x.drawImage(i,0,0);const px=x.getImageData(0,0,c.width,c.height).data;let alpha=false;for(let k=3;k<px.length;k+=16)if(px[k]<250){alpha=true;break}if(!alpha)continue;

}

<script>

  key:()=>store.get('localKey','')||'',
  async req(method,url,body,headers={}){const h={'x-fo-key':LocalAPI.key(),'x-fo-user':S.me.id||'',...headers};let b=body;if(body&&!(body instanceof Blob)&&!(body instanceof ArrayBuffer)&&typeof body==='object'){b=JSON.stringify(body);h['content-type']='application/json'}const r=await fetch(url,{method,headers:h,body:b});if(r.status===401){store.set('localKey','');throw {message:'The passcode is wrong or has changed. Reload the page to sign in again.'}}const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw {message:(j&&j.error)||('Server error '+r.status)};return j},

  async envToBlob(env,name){if(env.kind==='doc')return (await docExport(env.html,name.replace(/\.\w+$/,''))).blob;if(env.kind==='sheet')return xlsxBlob(env.sheets);if(env.kind==='bin')return new Blob([b642ab(env.b64)]);return new Blob([JSON.stringify(env)])},

<script>
/* ================= Google Drive mode: static site, files + database in the company's Google Drive =================
   Turned on by config.js:  window.FILEORG_GDRIVE = { clientId: '....apps.googleusercontent.com' }
   - Everyone signs in with Google.
   - Reports are real files in a shared "File Org" folder (Site / Type / Year / Month).
   - The file list, chat, activity and settings are rows in a "File Org Database" Google Sheet inside File Org/_FileOrg.
   - It speaks the same /api/... language as the office PC server, so every screen works unchanged. */
const GD={cfg:window.FILEORG_GDRIVE||null,on:false,token:null,exp:0,email:'',root:null,sys:null,sheet:null,next:2,polling:null,
  db:{users:{},files:{},folders:{},messages:{},activity:{},profiles:{},config:{},signatures:{},transfers:{}},fold:new Map(),es:new Set(),rf:window.fetch.bind(window),pv:new Map()};
const GAPI={drive:'https://www.googleapis.com/drive/v3',up:'https://www.googleapis.com/upload/drive/v3',sheets:'https://sheets.googleapis.com/v4/spreadsheets'};
const GD_SCOPES='https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/spreadsheets openid email profile';
const GD_FOLDER='application/vnd.google-apps.folder';
const gdId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const gdQ=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const gdErr=(status,msg)=>Object.assign(new Error(msg),{status});
const gdSafe=s=>String(s||'').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'-').replace(/\s+/g,' ').trim().slice(0,150)||'Untitled';
const gdSafeFolder=f=>String(f||'Unassigned').split('/').map(gdSafe).filter(s=>s&&s!=='.'&&s!=='..').join('/')||'Unassigned';
const gdKind=n=>{const e=(n.split('.').pop()||'').toLowerCase();if(e==='pdf')return'pdf';if(['doc','docx','rtf','odt','txt','md'].includes(e))return'doc';if(['xls','xlsx','csv','ods'].includes(e))return'sheet';if(['png','jpg','jpeg','gif','webp'].includes(e))return'img';return'other'};
const GD_MIME={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',txt:'text/plain',csv:'text/csv',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',doc:'application/msword',xls:'application/vnd.ms-excel',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'};
const gdMime=n=>GD_MIME[(n.split('.').pop()||'').toLowerCase()]||'application/octet-stream';

/* ---------- Google sign-in (token in this tab only) ---------- */
GD.loadGsi=()=>window.google?.accounts?.oauth2?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('Could not load Google sign-in. Check the internet connection.'));document.head.appendChild(s)});
GD.saveTok=()=>{try{sessionStorage.setItem('fo-gtok',JSON.stringify({t:GD.token,e:GD.exp}))}catch(e){}};
GD.loadTok=()=>{try{const o=JSON.parse(sessionStorage.getItem('fo-gtok')||'null');if(o&&o.e>Date.now()+120000){GD.token=o.t;GD.exp=o.e;return true}}catch(e){}return false};
GD.requestToken=(prompt)=>new Promise(async(res,rej)=>{try{await GD.loadGsi()}catch(e){return rej(e)}
  const tc=google.accounts.oauth2.initTokenClient({client_id:GD.cfg.clientId,scope:GD_SCOPES,hint:store.get('gEmail','')||undefined,
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));
      if(!google.accounts.oauth2.hasGrantedAllScopes(r,'https://www.googleapis.com/auth/drive','https://www.googleapis.com/auth/spreadsheets'))return rej(new Error('File Org needs access to Google Drive and Google Sheets. Sign in again and tick both boxes.'));
      GD.token=r.access_token;GD.exp=Date.now()+(+r.expires_in||3600)*1000;GD.saveTok();res()},
    error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'The Google sign-in window was closed.':e&&e.type==='popup_failed_to_open'?'Allow pop-ups for this site, then try again.':'Google sign-in did not finish.'))});
  tc.requestAccessToken({prompt:prompt??''})});
/* a fresh token needs a tap (browsers block pop-ups otherwise) */
GD.reauth=()=>GD._ra||(GD._ra=new Promise((res,rej)=>{const sc=document.createElement('div');sc.className='scrim';sc.style.zIndex=95;
  sc.innerHTML=`<div class="modal" style="width:min(400px,100%)"><div class="mh"><h3>Continue to File Org</h3></div><div class="mb"><p class="muted" style="margin:0">Your Google sign-in timed out. Tap continue to keep working. Nothing is lost.</p><div class="muted" id="raErr" style="color:var(--bad)"></div></div><div class="mf"><button class="btn primary" id="raGo">Continue with Google</button></div></div>`;
  document.body.appendChild(sc);$('#raGo',sc).onclick=async()=>{try{await GD.requestToken('');sc.remove();GD._ra=null;res()}catch(e){$('#raErr',sc).textContent=e.message}}}));
GD.ensureToken=async()=>{if(GD.token&&GD.exp>Date.now()+60000)return;await GD.reauth()};

/* ---------- REST helper ---------- */
GD.api=async(url,opt={},retry=true)=>{await GD.ensureToken();
  const r=await GD.rf(url,{...opt,headers:{Authorization:'Bearer '+GD.token,...(opt.headers||{})}});
  if(r.status===401&&retry){GD.exp=0;await GD.reauth();return GD.api(url,opt,false)}
  if((r.status===429||r.status>=500)&&retry){await new Promise(z=>setTimeout(z,1500+Math.random()*1500));return GD.api(url,opt,false)}
  if(!r.ok){let m='Google Drive error '+r.status;try{const j=await r.json();m=j.error?.message||m}catch(e){}
    if(r.status===403&&/insufficient|permission/i.test(m))m='Your Google account does not have edit access to the File Org folder. Ask the admin to share it with you as Editor.';
    if(r.status===403&&/storage.*quota|quota.*storage/i.test(m))m='The Google Drive that owns File Org is full. Free up space or add storage.';
    throw gdErr(r.status,m)}
  return r};
GD.json=async(url,opt)=>(await GD.api(url,opt)).json();
GD.list=async(q,fields='files(id,name,mimeType,parents,size,modifiedTime,appProperties,owners(emailAddress),lastModifyingUser(emailAddress))')=>{let out=[],pt='';
  do{const j=await GD.json(`${GAPI.drive}/files?q=${encodeURIComponent(q)}&fields=nextPageToken,${encodeURIComponent(fields)}&pageSize=1000&supportsAllDrives=true&includeItemsFromAllDrives=true${pt?'&pageToken='+pt:''}`);out=out.concat(j.files||[]);pt=j.nextPageToken}while(pt);return out};
GD.mkFolder=async(name,parent,app)=>GD.made(await GD.json(`${GAPI.drive}/files?fields=id,name&supportsAllDrives=true`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,mimeType:GD_FOLDER,parents:parent?[parent]:undefined,appProperties:app})}));
GD.made=f=>{if(f&&f.id&&GD.sheet)GD.handOver(f.id);return f};
GD.upload=async(meta,blob,fileId)=>{const r=await GD.upload0(meta,blob,fileId);if(!fileId)GD.made(r);return r};
GD.upload0=async(meta,blob,fileId)=>{const isNew=!fileId;const mt=(meta.mimeType&&!/^application\/vnd\.google-apps\./.test(meta.mimeType)?meta.mimeType:blob.type)||'application/octet-stream';
  if(blob.size<=4.5*1024*1024){const b='fo'+gdId();const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,JSON.stringify(meta),`\r\n--${b}\r\nContent-Type: ${mt}\r\n\r\n`,blob,`\r\n--${b}--`]);
    return GD.json(`${GAPI.up}/files${isNew?'':'/'+fileId}?uploadType=multipart&supportsAllDrives=true&fields=id,name,size,modifiedTime,headRevisionId${isNew&&meta.parents?'':''}`,{method:isNew?'POST':'PATCH',headers:{'content-type':'multipart/related; boundary='+b},body})}
  const r=await GD.api(`${GAPI.up}/files${isNew?'':'/'+fileId}?uploadType=resumable&supportsAllDrives=true&fields=id,name,size,modifiedTime,headRevisionId`,{method:isNew?'POST':'PATCH',headers:{'content-type':'application/json; charset=UTF-8','x-upload-content-type':mt},body:JSON.stringify(meta)});
  const loc=r.headers.get('location');if(!loc)throw gdErr(500,'Google Drive did not accept the upload.');
  const r2=await GD.rf(loc,{method:'PUT',body:blob});if(!r2.ok)throw gdErr(r2.status,'The upload to Google Drive failed ('+r2.status+').');return r2.json()};
GD.download=async(id,rev)=>(await GD.api(`${GAPI.drive}/files/${id}${rev?'/revisions/'+rev:''}?alt=media&supportsAllDrives=true`)).blob();

/* ---------- folders ---------- */
GD.folderId=async(rel,create=true)=>{rel=gdSafeFolder(rel);if(GD.fold.has(rel.toLowerCase()))return GD.fold.get(rel.toLowerCase());
  let parent=GD.root,acc=[];for(const seg of rel.split('/')){acc.push(seg);const key=acc.join('/').toLowerCase();
    if(GD.fold.has(key)){parent=GD.fold.get(key);continue}
    const hit=(await GD.list(`'${parent}' in parents and mimeType='${GD_FOLDER}' and trashed=false and name='${gdQ(seg)}'`,'files(id,name)'))[0];
    if(hit)parent=hit.id;else{if(!create)return null;parent=(await GD.mkFolder(seg,parent)).id}
    GD.fold.set(key,parent)}
  return parent};
GD.uniqueName=async(folderId,name,selfId)=>{const ext=name.includes('.')?name.slice(name.lastIndexOf('.')):'';const base=name.slice(0,name.length-ext.length);
  const taken=new Set((await GD.list(`'${folderId}' in parents and trashed=false`,'files(id,name)')).filter(f=>f.id!==selfId).map(f=>f.name.toLowerCase()));
  let n=name,i=2;while(taken.has(n.toLowerCase()))n=`${base} (${i++})${ext}`;return n};
GD.canonFolder=(folder,selfId)=>{const parts=gdSafeFolder(folder).split('/');const known=new Map();
  const add=p=>{const ps=String(p||'').split('/').filter(Boolean);for(let i=1;i<=ps.length;i++){const sub=ps.slice(0,i).join('/');const k=sub.toLowerCase();if(!known.has(k))known.set(k,sub)}};
  ((GD.db.config.naming&&GD.db.config.naming.sites)||[]).forEach(add);((typeof S!=='undefined'&&S.config&&S.config.sites)||[]).forEach(x=>add(typeof x==='string'?x:x&&x.name));for(const[id,f]of Object.entries(GD.db.files))if(id!==selfId&&!f.trashed)add(f.folder);
  const out=[];for(const seg of parts){const hit=known.get([...out,seg].join('/').toLowerCase());out.push(hit?hit.split('/').pop():seg)}return out.join('/')};

/* ---------- the database: an append-only log in a Google Sheet (last row for an id wins) ---------- */
GD.encode=async(doc)=>{let s=JSON.stringify(doc);if(s.length<=45000)return s;
  const f=await GD.upload({name:'record-'+gdId()+'.json',parents:[GD.sysSub.blobs],mimeType:'application/json'},new Blob([s],{type:'application/json'}));return JSON.stringify({$spill:f.id})};
GD.decode=async s=>{let o;try{o=JSON.parse(s||'{}')}catch(e){return null}if(o&&o.$spill){try{o=JSON.parse(await (await GD.download(o.$spill)).text())}catch(e){return null}}return o};
GD.write=async(rows)=>{const values=[];for(const r of rows)values.push([Date.now(),r.col,r.id,r.op,r.op==='d'?'':await GD.encode(r.doc),S.me?.id||'']);
  await GD.json(`${GAPI.sheets}/${GD.sheet}/values/${encodeURIComponent('log!A:F')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({values})})};
GD.applyRow=async(row)=>{const[,col,id,op,js]=row;if(!col||!id||!GD.db[col])return null;
  if(op==='d'){if(!GD.db[col][id])return null;delete GD.db[col][id];return{col,op:'delete',doc:{id}}}
  const doc=await GD.decode(js);if(!doc)return null;GD.db[col][id]=doc;if(col==='config'&&id==='ai'&&GD.on&&S.mode==='local'){try{LocalAPI.enableAI(GD.info())}catch(e){}}return{col,op:'upsert',doc:{...doc,id}}};
GD.put=async(col,id,doc,silent)=>{GD.db[col][id]=doc;await GD.write([{col,id,op:'u',doc}]);if(!silent)GD.emit('change',{col,op:'upsert',doc:{...doc,id}})};
GD.drop=async(col,id)=>{delete GD.db[col][id];await GD.write([{col,id,op:'d'}]);GD.emit('change',{col,op:'delete',doc:{id}})};
GD.load=async()=>{const j=await GD.json(`${GAPI.sheets}/${GD.sheet}/values/${encodeURIComponent('log!A2:F')}?majorDimension=ROWS`);const rows=j.values||[];
  for(const r of rows)await GD.applyRow(r);GD.next=2+rows.length};
GD.poll=async()=>{if(GD._busy)return;GD._busy=true;try{
    const j=await GD.json(`${GAPI.sheets}/${GD.sheet}/values/${encodeURIComponent('log!A'+GD.next+':F')}?majorDimension=ROWS`);const rows=j.values||[];
    GD.next+=rows.length;for(const r of rows){const ch=await GD.applyRow(r);if(ch)GD.emit('change',ch)}
    if(GD.down){GD.down=false;GD.emit('open')}
  }catch(e){if(!GD.down&&(e instanceof TypeError||!navigator.onLine)){GD.down=true;GD.emit('error')}}finally{GD._busy=false}};
GD.startPolling=()=>{clearTimeout(GD.polling);const tick=async()=>{await GD.poll();GD.polling=setTimeout(tick,document.hidden?30000:6000)};GD.polling=setTimeout(tick,6000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(GD.polling);tick()}})};

/* ---------- live updates: a stand-in for the office PC's event stream ---------- */
GD.emit=(type,data)=>{for(const es of GD.es)es._fire(type,data)};
class GDEventSource{constructor(){this._l={};this.readyState=1;GD.es.add(this);setTimeout(()=>this.onopen&&this.onopen(),0)}
  addEventListener(t,fn){(this._l[t]=this._l[t]||[]).push(fn)}removeEventListener(t,fn){this._l[t]=(this._l[t]||[]).filter(x=>x!==fn)}
  close(){this.readyState=2;GD.es.delete(this)}
  _fire(t,d){if(t==='open'){this.onopen&&this.onopen();return}if(t==='error'){this.onerror&&this.onerror();return}const ev={data:JSON.stringify(d)};(this._l[t]||[]).forEach(fn=>fn(ev))}}

/* ---------- find or create the shared File Org folder ---------- */
GD.findRoot=async()=>{if(GD.cfg.folderId)return GD.cfg.folderId;
  const hits=await GD.list(`appProperties has { key='fileorg' and value='root' } and trashed=false`,'files(id,name,createdTime,owners(emailAddress))');
  if(!hits.length)return null;hits.sort((a,b)=>String(a.createdTime).localeCompare(String(b.createdTime)));
  const own=GD.cfg.ownerEmail&&hits.find(h=>(h.owners||[]).some(o=>o.emailAddress===GD.cfg.ownerEmail));return(own||hits[0]).id};
GD.openRoot=async(root)=>{GD.root=root;
  let sys=(await GD.list(`'${root}' in parents and appProperties has { key='fileorg' and value='sys' } and trashed=false`,'files(id)'))[0];
  if(!sys)sys=await GD.mkFolder('_FileOrg',root,{fileorg:'sys'});GD.sys=sys.id;
  const subs={};for(const n of['env','blobs','signatures','previews']){let f=(await GD.list(`'${GD.sys}' in parents and name='${n}' and mimeType='${GD_FOLDER}' and trashed=false`,'files(id)'))[0];if(!f)f=await GD.mkFolder(n,GD.sys);subs[n]=f.id}GD.sysSub=subs;
  let sh=(await GD.list(`'${GD.sys}' in parents and appProperties has { key='fileorg' and value='db' } and trashed=false`,'files(id)'))[0];
  if(!sh){const s=await GD.json(GAPI.sheets,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({properties:{title:'File Org Database (do not edit)'},sheets:[{properties:{title:'log',gridProperties:{frozenRowCount:1,columnCount:6}}}]})});
    await GD.json(`${GAPI.sheets}/${s.spreadsheetId}/values/${encodeURIComponent('log!A1:F1')}?valueInputOption=RAW`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({values:[['time','collection','id','op','json','by']]})});
    const meta=await GD.json(`${GAPI.drive}/files/${s.spreadsheetId}?fields=parents&supportsAllDrives=true`);
    await GD.json(`${GAPI.drive}/files/${s.spreadsheetId}?addParents=${GD.sys}&removeParents=${(meta.parents||[]).join(',')}&supportsAllDrives=true`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({appProperties:{fileorg:'db'}})});
    sh={id:s.spreadsheetId}}
  GD.sheet=sh.id;
  try{const r=await GD.json(`${GAPI.drive}/files/${root}?fields=owners(emailAddress)&supportsAllDrives=true`);GD.ownerEmail=(r.owners||[])[0]?.emailAddress||''}catch(e){GD.ownerEmail=''}};
/* ---------- one Google Drive for everything ----------
   On free Gmail accounts, a file a coworker uploads into a shared folder belongs to (and uses the storage of) that coworker.
   So File Org hands every new file and folder over to the owner of the File Org folder: the coworker's app asks Google to
   transfer ownership, and the owner's File Org accepts it automatically the next time it is open. */
GD.mine=()=>!GD.ownerEmail||GD.email.toLowerCase()===GD.ownerEmail.toLowerCase();
GD.handOver=async fileId=>{if(GD.mine()||!fileId)return;try{
    const perms=(await GD.json(`${GAPI.drive}/files/${fileId}/permissions?fields=permissions(id,emailAddress,role)&supportsAllDrives=true`)).permissions||[];
    let p=perms.find(x=>(x.emailAddress||'').toLowerCase()===GD.ownerEmail.toLowerCase());
    if(!p)p=await GD.json(`${GAPI.drive}/files/${fileId}/permissions?sendNotificationEmail=false&fields=id&supportsAllDrives=true`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'user',role:'writer',emailAddress:GD.ownerEmail})});
    await GD.json(`${GAPI.drive}/files/${fileId}/permissions/${p.id}?fields=id&supportsAllDrives=true`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({role:'writer',pendingOwner:true})});
    await GD.put('transfers',fileId,{by:S.me.id,at:Date.now()},true)}catch(e){console.warn('File Org: could not hand this file to the owner yet',e)}};
GD.acceptTransfers=async()=>{if(!GD.mine()||GD._acc)return;GD._acc=true;try{
    for(const id of Object.keys(GD.db.transfers)){try{
      const perms=(await GD.json(`${GAPI.drive}/files/${id}/permissions?fields=permissions(id,emailAddress,role,pendingOwner)&supportsAllDrives=true`)).permissions||[];
      const me=perms.find(x=>(x.emailAddress||'').toLowerCase()===GD.email.toLowerCase());
      if(me&&me.role!=='owner')await GD.json(`${GAPI.drive}/files/${id}/permissions/${me.id}?transferOwnership=true&fields=id&supportsAllDrives=true`,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({role:'owner'})});
      await GD.drop('transfers',id)}catch(e){if(e.status===404)await GD.drop('transfers',id).catch(()=>{})}}
  }finally{GD._acc=false}};
GD.createRoot=async()=>{const f=await GD.mkFolder(GD.cfg.folderName||'File Org',null,{fileorg:'root'});return f.id};

/* ---------- sign-in screen ---------- */
GD.signIn=()=>new Promise(res=>{
  const sc=document.createElement('div');sc.className='scrim';sc.style.zIndex=95;
  sc.innerHTML=`<div class="modal" style="width:min(420px,100%)"><div class="mh"><div style="margin-bottom:12px">${LOGO_SVG(48)}</div><h3>Sign in to File Org</h3><p class="muted" style="margin:6px 0 0">Use your Google account. Reports are saved in the company's <b>File Org</b> folder in Google Drive.</p></div>
    <div class="mb"><div class="muted" id="gsMsg" style="font-size:13px"></div></div><div class="mf"><button class="btn primary" id="gsGo" style="width:100%;height:44px">
    <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    Continue with Google</button></div></div>`;
  document.body.appendChild(sc);const msg=$('#gsMsg',sc);
  $('#gsGo',sc).onclick=async()=>{const b=$('#gsGo',sc);b.disabled=true;msg.style.color='';msg.textContent='Opening Google sign-in…';
    try{await GD.requestToken(store.get('gEmail','')?'':'consent');sc.remove();res()}catch(e){msg.style.color='var(--bad)';msg.textContent=e.message;b.disabled=false}}});
GD.setupRoot=(email)=>new Promise(res=>{const sc=document.createElement('div');sc.className='scrim';sc.style.zIndex=95;
  sc.innerHTML=`<div class="modal" style="width:min(460px,100%)"><div class="mh"><h3>No File Org folder yet</h3></div><div class="mb">
    <p style="margin:0">Signed in as <b>${esc(email)}</b>, but no File Org folder is shared with this account.</p>
    <p class="muted" style="margin:0"><b>Coworkers:</b> ask the admin to share the <b>File Org</b> folder in Google Drive with this email as <b>Editor</b>, then tap Check again.</p>
    <p class="muted" style="margin:0"><b>Admin, first time only:</b> create the folder in your own Google Drive. All reports and records will live there.</p>
    <div id="srErr" style="color:var(--bad);font-size:13px"></div></div>
    <div class="mf"><button class="btn ghost" id="srOut">Use another account</button><button class="btn" id="srAgain">Check again</button><button class="btn primary" id="srMake">Create File Org folder</button></div></div>`;
  document.body.appendChild(sc);
  $('#srAgain',sc).onclick=async()=>{const r=await GD.findRoot().catch(e=>{$('#srErr',sc).textContent=e.message;return null});if(r){sc.remove();res(r)}else $('#srErr',sc).textContent='Still not shared with '+email+'.'};
  $('#srMake',sc).onclick=async()=>{const b=$('#srMake',sc);b.disabled=true;b.textContent='Creating…';try{const r=await GD.createRoot();sc.remove();GD.justCreated=true;res(r)}catch(e){$('#srErr',sc).textContent=e.message;b.disabled=false;b.textContent='Create File Org folder'}};
  $('#srOut',sc).onclick=async()=>{store.set('gEmail','');try{sessionStorage.removeItem('fo-gtok')}catch(e){}try{google.accounts.oauth2.revoke(GD.token,()=>location.reload())}catch(e){location.reload()}}});

    const f=await GD.upload({mimeType:gdMime(doc.name)},blob,id);
    const nd={...doc,size:blob.size,updated:Date.now(),updatedBy:S.me.id,versions:versions.slice(-20),driveTime:Date.parse(f.modifiedTime)||Date.now()};

    if(method==='GET'){if(!e)return gdRes({error:'No editable copy'},404);return new Response(await GD.download(e),{headers:{'content-type':'application/json'}})}
    if(method==='PUT'){const b=await gdBody(init);const blob=typeof b==='string'?new Blob([b],{type:'application/json'}):b;await GD.upload(e?{mimeType:'application/json'}:{name:id+'.json',parents:[GD.sysSub.env],mimeType:'application/json'},blob,e||undefined);
      await GD.put('files',id,{...GD.db.files[id],hasEnv:true});return gdRes({ok:true})}}
  if((m=p.match(/^\/api\/files\/([\w-]+)\/restore$/))&&method==='POST'){const id=m[1];const doc=GD.db.files[id];if(!doc)return gdRes({error:'File not found'},404);const b=await gdJson(init);const v=(doc.versions||[])[b.index];

const GEM='https://generativelanguage.googleapis.com/v1beta';
GD.pickModel=async key=>{const r=await GD.rf(`${GEM}/models?pageSize=200&key=${encodeURIComponent(key)}`);const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error?.message?'Google did not accept that key: '+j.error.message:'Google did not accept that key.');

  const pref=[x=>x==='gemini-flash-latest',x=>/flash-lite-latest$/.test(x),x=>/^gemini-[\d.]+-flash$/.test(x),x=>/^gemini-[\d.]+-flash-lite$/.test(x),x=>/flash/.test(x)&&!/image|tts|audio|live|exp|preview|thinking/.test(x),x=>/flash/.test(x)];
  for(const t of pref){const hits=ok.filter(t).sort().reverse();if(hits.length)return hits[0]}
  if(!ok.length)throw new Error('That key works, but no Gemini text models are available to it.');return ok[0]};
GD.gemini=async(prompt,image)=>{const ai=GD.db.config.ai||{};if(!ai.key)throw gdErr(501,'AI is not set up.');
  const parts=[{text:String(prompt).slice(0,30000)}];if(image&&image.b64)parts.push({inline_data:{mime_type:image.type||'image/jpeg',data:image.b64}});
  const call=async model=>GD.rf(`${GEM}/models/${model}:generateContent?key=${encodeURIComponent(ai.key)}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:'You read company documents and reply with one JSON object only.'}]},contents:[{role:'user',parts}],generationConfig:{temperature:0,responseMimeType:'application/json'}})});
  let r=await call(ai.model);
  if(r.status===404){try{const m=await GD.pickModel(ai.key);if(m!==ai.model){await GD.put('config','ai',{...ai,model:m});r=await call(m)}}catch(e){}}
  const j=await r.json().catch(()=>({}));
  if(r.status===429)throw gdErr(429,'The free Gemini limit for now is used up. Names come from the built-in rules; try AI again in a minute.');
  if(!r.ok)throw gdErr(502,j.error?.message||'Gemini could not read this file.');
  return(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('')};

  downloadFile=async f=>{try{toast('Downloading '+f.name+'…');const b=await GD.download(f.id);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);logAct('downloaded',f.name,f.id)}catch(e){toast(e.message,true)}};
  LocalAPI.recheckAI=async()=>{const i=GD.info();LocalAPI.enableAI(i);return i};
  const _en=LocalAPI.enableAI;LocalAPI.enableAI=info=>_en.call(LocalAPI,GD.sheet?GD.info():info);
}

async function qrSvg(text,px){await loadScript(LIB.qrcode);const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2,s=n+m*2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;return `<svg viewBox="0 0 ${s} ${s}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR code for ${esc(text)}" style="display:block;max-width:100%;height:auto;background:#fff;border-radius:10px"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#0F1A16"/></svg>`}

        ${urls.length>1?`<div class="field"><label for="urlPick">This PC has more than one network. Pick the office Wi‑Fi one.</label><select class="select input" id="urlPick">${urls.map(u=>`<option>${esc(u)}</option>`).join('')}</select></div>`:''}
        <div style="display:flex;gap:8px;align-items:center"><input class="input mono" id="urlText" readonly value="${esc(urls[0]||'')}"><button class="btn" id="copyUrl">${I('copy')}Copy</button></div>
        <p class="muted" style="margin:0;font-size:12.5px">Typing it instead? Include <span class="mono">http://</span> at the start, especially in Safari on iPhone.</p>
      </div></div>
      <div class="card"><div class="card-h"><h3>Add a Wi‑Fi code to the poster</h3><span class="muted" style="font-size:12px">Optional</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">
        <div class="ufields" style="margin:0"><div class="field"><label for="wSsid">Wi‑Fi name</label><input class="input" id="wSsid" value="${esc(S.wifi?.ssid||'')}" autocomplete="off"></div><div class="field"><label for="wPass">Wi‑Fi password</label><input class="input" id="wPass" type="password" value="${esc(S.wifi?.pass||'')}" autocomplete="off"></div></div>

<script>
/* ================= File Organizer v2: collapsible tree, folder browsing, grouping, duplicates, clean-up ================= */
const lc=s=>String(s||'').toLowerCase();
const segKey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function inPath(f,p){if(!p)return true;const a=lc(f.folder),b=lc(p);return a===b||a.startsWith(b+'/')}
function directIn(f,p){return lc(f.folder)===lc(p)}
/* one entry per folder, ignoring differences in capital letters */
function allFolders(){const map=new Map();const add=p=>{const parts=String(p||'').split('/').filter(Boolean);for(let i=1;i<=parts.length;i++){const sub=parts.slice(0,i).join('/');const k=lc(sub);if(!map.has(k))map.set(k,sub)}};
  (S.config.sites||[]).forEach(add);live().forEach(f=>add(f.folder||'Unassigned'));S.folders.forEach(x=>add(x.path));return [...map.values()].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'}))}
function canonPath(p){const parts=String(p||'').split('/').map(s=>s.trim()).filter(Boolean);if(!parts.length)return '';if(isKnownSite(parts[0]))parts[0]=canonSite(parts[0]);const known=allFolders();const out=[];for(const seg of parts){const want=lc([...out,seg].join('/'));const hit=known.find(k=>lc(k)===want);out.push(hit?hit.split('/').pop():seg)}return out.join('/')}
function childFolders(p){const depth=p?p.split('/').length:0;return allFolders().filter(x=>{const parts=x.split('/');return parts.length===depth+1&&(!p||lc(parts.slice(0,depth).join('/'))===lc(p))})}
function dupKey(f){return f.hash?'h:'+f.hash:'n:'+lc(String(f.name).replace(/ \(\d+\)(?=\.\w+$)/,''))+'|'+(f.size||0)}
function dupGroups(){const g={};live().forEach(f=>{const k=dupKey(f);(g[k]=g[k]||[]).push(f)});return Object.values(g).filter(a=>a.length>1).map(a=>a.sort((x,y)=>y.updated-x.updated))}
S.org.open=new Set(store.get('orgOpen',[]));S.org.sub=store.get('orgSub',false);
function saveOpen(){store.set('orgOpen',[...S.org.open])}

VIEWS.files={html(){
  const o=S.org;const me=S.me.id||'me';const all=live();
  if(o.path&&!allFolders().some(p=>lc(p)===lc(o.path)))o.path='';
  if(o.path){const parts=o.path.split('/');for(let i=1;i<parts.length;i++)o.open.add(lc(parts.slice(0,i).join('/')))}
  const filtering=o.q||o.filter!=='all'||o.sub;
  let list=all.filter(f=>inPath(f,o.path));
  if(CATS[o.filter])list=list.filter(f=>f.category===o.filter);
  if(o.filter==='star')list=list.filter(starred);if(o.filter==='mine')list=list.filter(f=>f.ownerId===me);
  if(o.q){const q=lc(o.q);list=list.filter(f=>lc([f.name,f.originalName,f.folder,f.ai?.summary,...Object.values(f.fields||{})].join(' ')).includes(q))}
  const sorters={updated:(a,b)=>b.updated-a.updated,name:(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}),date:(a,b)=>String(b.date).localeCompare(String(a.date)),size:(a,b)=>(b.size||0)-(a.size||0)};
  list.sort(sorters[o.sort]||sorters.updated);
  const dups=dupGroups();
  // tree
  const count=p=>all.filter(f=>inPath(f,p)).length;
  const node=(p,depth)=>{const kids=childFolders(p);const isOpen=o.open.has(lc(p));const on=lc(o.path)===lc(p);const n=count(p);
    return `<div class="tnode" style="--d:${depth}"><div class="trow ${on?'on':''}">${kids.length?`<button class="tchev ${isOpen?'open':''}" data-tog="${esc(p)}" aria-label="${isOpen?'Collapse':'Expand'} ${esc(p.split('/').pop())}" aria-expanded="${isOpen}">${I('down')}</button>`:'<span class="tchev-sp"></span>'}<button class="tlabel" data-path="${esc(p)}">${I(depth===0&&isKnownSite(p)?'pin':'folder')}<span class="tname">${esc(p.split('/').pop())}</span><span class="c">${n||''}</span></button></div>${kids.length&&isOpen?kids.map(k=>node(k,depth+1)).join(''):''}</div>`};
  const roots=childFolders('');
  const tree=`<div class="trow ${!o.path?'on':''}"><span class="tchev-sp"></span><button class="tlabel" data-path="">${I('home')}<span class="tname">All files</span><span class="c">${all.length}</span></button></div>${roots.map(r=>node(r,0)).join('')}`;
  const crumbs=['',...(o.path?o.path.split('/'):[])].map((s,i,a)=>i===0?`<button data-path="">All files</button>`:`<span class="sep">/</span><button data-path="${esc(a.slice(1,i+1).join('/'))}" ${i===a.length-1?'aria-current="page"':''}>${esc(s)}</button>`).join('');
  // body
  let body='';
  if(o.filter==='dups'){body=dups.length?`<div class="dup-list">${dups.map((g,gi)=>`<div class="dup-group"><div class="dup-h"><b>${g.length} copies</b><span class="muted mono">${esc(g[0].name)}</span><button class="btn sm" data-dupkeep="${gi}">${I('check')}Keep newest, trash ${g.length-1}</button></div>${fileRows(g,{compact:true})}</div>`).join('')}</div>`:`<div class="empty">${I('copy')}<b>No duplicates</b><span>Every file in the library is unique.</span></div>`}
  else if(!filtering){
    const kids=childFolders(o.path);const here=list.filter(f=>directIn(f,o.path));
    const ftile=p=>{const fs=all.filter(f=>inPath(f,p));const tr=fs.filter(f=>f.category==='TR').length,pm=fs.filter(f=>f.category==='PMS').length;const last=fs.reduce((m,f)=>Math.max(m,f.updated||0),0);const isSite=!o.path&&isKnownSite(p);
      return `<button class="card ftile folder-tile" data-path="${esc(p)}"><span class="fold-ic ${isSite?'site':''}">${I(isSite?'pin':'folder')}</span><span class="fold-n">${esc(p.split('/').pop())}</span><span class="fold-m">${fs.length?`${fs.length} file${fs.length===1?'':'s'} · ${ago(last)}`:'Empty'}</span>${fs.length?`<span class="fold-chips">${tr?`<span class="chip tr">${tr} TR</span>`:''}${pm?`<span class="chip pms">${pm} PMS</span>`:''}${fs.length-tr-pm?`<span class="chip oth">${fs.length-tr-pm}</span>`:''}</span>`:''}</button>`};
    body=(kids.length?`<div class="sec-h">Folders <span class="muted">${kids.length}</span></div><div class="fgrid folders">${kids.map(ftile).join('')}</div>`:'')+
      (here.length?`<div class="sec-h">Files in this folder <span class="muted">${here.length}</span></div>`+(o.view==='grid'?fileTiles(here):fileRows(here)):'')+
      (!kids.length&&!here.length?`<div class="empty">${I('folder')}<b>This folder is empty</b><span>Upload files here, or move files into it from their menu.</span><button class="btn primary" id="upHere">${I('upload')}Upload to this folder</button></div>`:'');
  } else {
    // flat results grouped by folder so they stay organized
    const groups={};list.forEach(f=>{(groups[f.folder]=groups[f.folder]||[]).push(f)});const keys=Object.keys(groups).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    body=list.length?`<div class="res-note">${list.length} file${list.length===1?'':'s'} in ${keys.length} folder${keys.length===1?'':'s'}${o.q?` matching <b>${esc(o.q)}</b>`:''}${o.q?' <button class="btn sm ghost" id="clearQ">Clear search</button>':''}</div>`+keys.map(k=>`<div class="grp-h" data-path="${esc(k)}">${I('folder')}<span class="mono">${esc(k)}</span><span class="muted">${groups[k].length}</span></div>`+(o.view==='grid'?fileTiles(groups[k]):fileRows(groups[k],{compact:false}))).join(''):`<div class="empty">${I('search')}<b>No files match</b><span>Try another filter or search word.</span>${o.q?'<button class="btn" id="clearQ">Clear search</button>':''}</div>`;
  }
  return `<div class="page-head"><div><div class="eyebrow">Library</div><h1>File Organizer</h1><p class="sub">Browse by site, then type, year and month. Right-click any file for more actions.</p></div><div class="toolbar"><button class="btn" id="cleanUp">${I('sparkle')}Clean up${dups.length?` <span class="chip brass">${dups.length}</span>`:''}</button><button class="btn" id="newFolder">${I('plus')}New folder</button><button class="btn primary" id="upTop">${I('upload')}Upload</button></div></div>${loadingNote()}
  <div class="org"><nav class="card tree2" id="tree" aria-label="Folders"><div class="tree-h"><span>Folders</span><span><button class="btn sm ghost" id="tExpand" title="Expand all">Expand</button><button class="btn sm ghost" id="tCollapse" title="Collapse all">Collapse</button></span></div><div class="tree-b">${tree}</div></nav>
  <section class="card org-main" style="min-width:0"><div class="org-bar"><div class="crumbs">${crumbs}</div><div class="toolbar">
    <div class="seg" role="group" aria-label="Filter">${[['all','All'],['TR','TR'],['DR','Daily'],['NR','Network'],['PMS','PMS'],['OTHER','General'],['star','Starred'],['mine','Mine'],['dups','Duplicates'+(dups.length?' '+dups.length:'')]].map(([k,l])=>`<button class="${o.filter===k?'on':''}" data-filter="${k}">${l}</button>`).join('')}</div>
    <label class="chk" title="Show every file inside this folder and its subfolders"><input type="checkbox" id="subToggle" ${o.sub?'checked':''}> All files inside</label>
    <select class="select input" id="orgSort" style="width:auto;height:34px"><option value="updated">Last updated</option><option value="date">Report date</option><option value="name">Name</option><option value="size">Size</option></select>
    <div class="seg"><button class="${o.view==='list'?'on':''}" data-view="list" aria-label="List view">${I('list')}</button><button class="${o.view==='grid'?'on':''}" data-view="grid" aria-label="Grid view">${I('grid')}</button></div></div></div>
    <div class="org-body">${body}</div></section></div>`},
  bind(v){
    $$('[data-path]',v).forEach(b=>b.onclick=()=>{S.org.path=b.dataset.path;if(S.org.filter==='dups')S.org.filter='all';if(S.org.path)S.org.open.add(lc(S.org.path));saveOpen();renderView()});
    $$('[data-tog]',v).forEach(b=>b.onclick=e=>{e.stopPropagation();const k=lc(b.dataset.tog);S.org.open.has(k)?S.org.open.delete(k):S.org.open.add(k);saveOpen();renderView()});
    $('#tExpand',v).onclick=()=>{allFolders().forEach(p=>S.org.open.add(lc(p)));saveOpen();renderView()};
    $('#tCollapse',v).onclick=()=>{S.org.open.clear();saveOpen();renderView()};
    $$('[data-filter]',v).forEach(b=>b.onclick=()=>{S.org.filter=b.dataset.filter;renderView()});
    $$('[data-view]',v).forEach(b=>b.onclick=()=>{S.org.view=b.dataset.view;store.set('orgView',S.org.view);renderView()});
    $('#subToggle',v).onchange=e=>{S.org.sub=e.target.checked;store.set('orgSub',S.org.sub);renderView()};
    const so=$('#orgSort',v);so.value=S.org.sort;so.onchange=()=>{S.org.sort=so.value;renderView()};
    $$('#clearQ',v).forEach(b=>b.onclick=()=>{S.org.q='';$('#gsearch').value='';renderView()});
    const goUp=()=>{S.batchFolder=S.org.path||null;if(S.org.path&&isKnownSite(S.org.path.split('/')[0]))S.uploadSite=canonSite(S.org.path.split('/')[0]);location.hash='#upload'};
    $('#upTop',v).onclick=()=>{S.batchFolder=null;location.hash='#upload'};$('#upHere',v)&&($('#upHere',v).onclick=goUp);
    $('#newFolder',v).onclick=async()=>{const n=await promptBox('New folder',S.org.path?`Inside ${S.org.path}`:'Folder name');if(!n)return;const path=canonPath((S.org.path?S.org.path+'/':'')+n.replace(/\//g,'-'));try{await DB.add('folders',{path,created:Date.now(),by:S.me.id});S.org.path=path;S.org.open.add(lc(path));saveOpen();logAct('created folder',path);renderView()}catch(e){toast(dbErr(e),true)}};
    $('#cleanUp',v).onclick=()=>cleanUp();
    $$('[data-dupkeep]',v).forEach(b=>b.onclick=async()=>{const g=dupGroups()[+b.dataset.dupkeep];if(!g)return;for(const f of g.slice(1))await trashFile(f);toast(`Kept the newest copy and moved ${g.length-1} to Trash`)});
    bindFileRows(v);$$('.ftile[data-fid]',v).forEach(t=>t.onclick=e=>{if(e.target.closest('[data-more]'))return;openFile(fileById(t.dataset.fid))});
  }};
function fileTiles(list){return `<div class="fgrid">${list.map(f=>`<div class="card ftile" data-fid="${f.id}" tabindex="0"><div class="row">${ficon(f.kind,f.ext)}<div style="display:flex;gap:4px;align-items:center">${catChip(f.category)}<button class="btn sm icon ghost" data-more="${f.id}" aria-label="File actions">${I('more')}</button></div></div><div class="code" title="${esc(f.name)}">${esc(f.name)}</div><div class="row muted" style="font-size:12px"><span>${esc(f.date||'')}</span><span>${ago(f.updated)}</span></div></div>`).join('')}</div>`}

/* ---------- one-click clean-up ---------- */
function cleanupPlan(){
  const files=live();
  // 1. folders that differ only in capitals or spacing → one spelling (known site name, else most used spelling)
  const votes={};files.forEach(f=>{const parts=String(f.folder||'').split('/');parts.forEach((seg,i)=>{const k=parts.slice(0,i).map(segKey).join('/')+'|'+segKey(seg);(votes[k]=votes[k]||{})[seg]=(votes[k][seg]||0)+1})});
  const best=(prefix,seg,i)=>{if(i===0&&isKnownSite(seg))return canonSite(seg);const v=votes[prefix+'|'+segKey(seg)]||{};return Object.entries(v).sort((a,b)=>b[1]-a[1])[0]?.[0]||seg};
  const moves=[];files.forEach(f=>{const parts=String(f.folder||'').split('/');const fixed=parts.map((seg,i)=>best(parts.slice(0,i).map(segKey).join('/'),seg,i));const to=fixed.join('/');if(to!==f.folder)moves.push({f,to})});
  // 2. duplicate copies (keep newest)
  const extra=dupGroups().flatMap(g=>g.slice(1));
  // 3. empty folder records
  const used=new Set(files.map(f=>lc(f.folder)));const empty=S.folders.filter(x=>![...used].some(u=>u===lc(x.path)||u.startsWith(lc(x.path)+'/')));
  // 4. files outside their site folder (automatic filing only)
  return {moves,extra,empty};
}
async function cleanUp(){
  const p=cleanupPlan();const mergeNames=[...new Set(p.moves.map(m=>m.f.folder.split('/')[0]+' → '+m.to.split('/')[0]).filter(s=>{const [a,b]=s.split(' → ');return a!==b}))];
  if(!p.moves.length&&!p.extra.length&&!p.empty.length){toast('Everything is already tidy.');return}
  const r=await modal({title:'Clean up the library',wide:true,body:`<p class="muted" style="margin:0">Review what will change. Nothing is deleted permanently; duplicate copies go to Trash.</p>
   <label class="clean-opt"><input type="checkbox" id="cu1" ${p.moves.length?'checked':'disabled'}><span><b>Merge look-alike folders</b><br><span class="muted">${p.moves.length?`${p.moves.length} file${p.moves.length>1?'s':''} move so each site and folder has one spelling${mergeNames.length?': '+esc(mergeNames.slice(0,6).join(', ')):''}`:'Nothing to merge'}</span></span></label>
   <label class="clean-opt"><input type="checkbox" id="cu2" ${p.extra.length?'checked':'disabled'}><span><b>Move duplicate copies to Trash</b><br><span class="muted">${p.extra.length?`${p.extra.length} extra cop${p.extra.length>1?'ies':'y'} of the same file; the newest copy of each stays`:'No duplicates found'}</span></span></label>
   <label class="clean-opt"><input type="checkbox" id="cu3" ${p.empty.length?'checked':'disabled'}><span><b>Remove empty folders</b><br><span class="muted">${p.empty.length?`${p.empty.length} folder${p.empty.length>1?'s':''} with no files`:'No empty folders'}</span></span></label>`,
   actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:'Clean up',cls:'primary',value:sc=>({a:$('#cu1',sc).checked,b:$('#cu2',sc).checked,c:$('#cu3',sc).checked})}]});
  if(!r)return;let n=0;toast('Cleaning up…');
  try{
    if(r.a)for(const m of p.moves){await DB.update('files',m.f.id,{folder:m.to});n++}
    if(r.b)for(const f of p.extra){await DB.update('files',f.id,{trashed:true,trashedAt:Date.now(),trashedBy:S.me.id});n++}
    if(r.c)for(const x of p.empty){await DB.del('folders',x.id);n++}
    S.org.path='';logAct('cleaned up the library',`${n} change${n===1?'':'s'}`);toast(`Done: ${n} change${n===1?'':'s'}`)
  }catch(e){toast(dbErr(e),true)}
}

<script>
/* ================= Naming v2: company templates, site codes, report types ================= */
(()=>{const old={...CATS};for(const k of Object.keys(CATS))delete CATS[k];
  Object.assign(CATS,{TR:old.TR,DR:{label:'Daily Report',cls:'dr',folder:'Daily Reports'},NR:{label:'Network Report',cls:'nr',folder:'Network Reports'},PMS:old.PMS,OTHER:old.OTHER})})();
const DEFAULT_TPL={TR:'TR_{DATE}_{SITE}_{LOCATION}_{ISSUE}',DR:'DR_{DATE}_{SITE}_DAILY-REPORT',NR:'NR_{DATE}_{SITE}_NETWORK-REPORT',PMS:'TR_{DATE}_{SITE}_{LOCATION}_PMS',OTHER:'DOC_{DATE}_{SITE}_{TITLE}'};
const DEFAULT_CODES={PARKMALL:'PM',MCIA:'MCIA'};
const SITE_ALIASES={MCIA:['MACTAN CEBU','CEBU INTERNATIONAL AIRPORT','CEBU INTERNATION AIRPORT','MACTAN-CEBU']};
const SITE_COMPANY={PARKMALL:'GOLDEN GREAT VALUE PROPERTIES INC.',MCIA:'ABOITIZ INFRACAPITAL CEBU AIRPORT CORPORATION'};
const SITE_BRANCH={PARKMALL:'PARKMALL',MCIA:'MACTAN CEBU INTERNATIONAL AIRPORT'};
const TOKENS=['DATE','SITE','LOCATION','ISSUE','TITLE'];
function namingCfg(){const c=S.config;const has=!!c.templates;return {tpl:{...DEFAULT_TPL,...(c.templates||{})},fmt:has?(c.dateFormat||'YYYY-MM-DD'):'YYYY-MM-DD',codes:{...DEFAULT_CODES,...Object.fromEntries(Object.entries(c.siteCodes||{}).map(([k,v])=>[normSite(k),v]))}}}
function siteCode(site){if(!site)return '';const n=normSite(site);const c=namingCfg().codes[n];return c?seg(c):seg(canonSite(site))}
function tplHas(cat,tok){return (namingCfg().tpl[cat]||namingCfg().tpl.OTHER).includes('{'+tok+'}')}
function locSeg(s){if(!s)return '';let v=String(s).toUpperCase().replace(/\bGATE\s*(?:NO\.?\s*)?(\d+)/g,'G$1').replace(/\bTERMINAL\s*(\d+)/g,'T$1');return seg(v,'')}
function buildName(f,ext){const cfg=namingCfg();const tpl=cfg.tpl[f.category]||cfg.tpl.OTHER;
  const val={DATE:fmtDate(f.date,cfg.fmt),SITE:siteCode(f.site)||'SITE',LOCATION:locSeg(f.gate||f.place)||'LOCATION',ISSUE:seg(f.damage,'ISSUE'),TITLE:seg(f.title,'UNTITLED')};
  let n=tpl.replace(/\{(\w+)\}/g,(m,k)=>val[k.toUpperCase()]??m).replace(/[\\/:*?"<>|]+/g,'-').replace(/_+/g,'_').replace(/^_|_$/g,'');
  return n+(ext?'.'+ext:'')}
function nameHtml(n){const p=n.split('_');const first=p[0];const cls=first==='DR'?'seg-dr':first==='NR'?'seg-nr':first==='TR'?(/_PMS(\.|$)/.test(n)?'seg-pms':'seg-tr'):'';return p.map((s,i)=>`<span class="${i===0?cls:(/^PMS(\.|$)/.test(s)?'seg-pms':'')}">${esc(s)}</span>`).join('<span class="muted">_</span>')}
function toggleTok(sc,cat){$$('[data-tok]',sc).forEach(el=>el.hidden=!tplHas(cat,el.dataset.tok))}
function catLetters(c){return c==='OTHER'?'General':c}
function catChip(c){const x=CATS[c]||CATS.OTHER;return `<span class="chip ${x.cls}">${catLetters(c)}</span>`}

/* ---------- reading the company's report format ---------- */
function lineVal(text,label){const m=text.match(new RegExp('(?:^|\\n)\\s*'+label+'\\s*:?\\s*([^\\n]+)','i'));return m?m[1].trim():''}
function detectSite(text,filename){const all=(filename+'\n'+text);const branch=lineVal(text,'Branch');const sites=S.config.sites||[];
  for(const src of [branch,all]){if(!src)continue;const n=normSite(src);const hit=sites.find(x=>normSite(x)&&n.includes(normSite(x)));if(hit)return hit;for(const [code,al] of Object.entries(SITE_ALIASES))if(al.some(a=>n.includes(normSite(a)))){const s=sites.find(x=>normSite(x)===code);return s||code}}
  return branch?branch:''}
function heuristic(text,filename){
  const s=filename+'\n'+text;const low=s.toLowerCase();const head=text.slice(0,600).toLowerCase();
  const category=/network\s+(operation\s+)?report/.test(head)||/network\s+report/i.test(filename)?'NR':/daily\s+task|barrier\s+operation\s+report|daily\s+report/.test(low)?'DR':/preventive\s+maint|\bpms\b/.test(low)?'PMS':/technical\s+report|damage|replace|repair|defect|fault|broken|delay|not\s+working|\btr\b/.test(low)?'TR':'OTHER';
  const dos=lineVal(text,'Date of Service')||lineVal(text,'Date');const date=findDate(dos)||findDate(text)||findDate(filename.replace(/_/g,'-'));
  const site=detectSite(text,filename);
  let gate='';const g=s.match(/\bgate\s*(?:no\.?\s*)?(\d+)\s*(entrance|entry|exit)?/i);if(g)gate='Gate '+g[1]+(g[2]?' '+(/exit/i.test(g[2])?'Exit':'Entrance'):'');
  if(!gate){const l=lineVal(text,'Location');if(l&&!/^(parking area|t1 and t2 parking area)$/i.test(l))gate=l}
  if(!gate){const l=lineVal(text,'Location');if(l)gate=l}
  if(category==='PMS'){const l=lineVal(text,'Location');if(l)gate=l}
  let damage=lineVal(text,'Subject');if(!damage||/parking system and equipment support|preventive maint/i.test(damage)){const iss=lineVal(text,'Issue');if(iss)damage=iss}
  if(damage)damage=damage.replace(/[^\w\s-]/g,' ').split(/\s+/).filter(Boolean).slice(0,4).join(' ');
  return {category,date,gate,site:site?canonSite(site):'',damage,place:gate,title:(lineVal(text,'Subject')||filename.replace(/\.[^.]+$/,'')).replace(/[_-]+/g,' ').slice(0,50),summary:'',confidence:category==='OTHER'?0.35:(site&&date?0.6:0.45),source:'rules'};
}
async function aiAnalyze(file,extracted){
  const base=heuristic(extracted.text||'',file.name||'');const sample=S.cap.sample;
  if(!sample)return base;
  let images;
  if(extracted.image){try{const lim=await sample.limits();if(lim.images&&extracted.image.size<=lim.images.maxInputBytes&&lim.images.mediaTypes.includes(extracted.image.type))images=[extracted.image]}catch(e){}}
  if(!(extracted.text||'').trim()&&!images)return base;
  const c=S.config;const cfg=namingCfg();
  const prompt=`You file field reports for Deltech Parking Systems and Solutions. Read the document and extract the fields for its file name.

Report types:
- "TR": Technical Report about one problem or job (repair, replacement, delay, fault). It has "Subject", "Causes", "Action Taken", "Status".
- "DR": Daily Report. Heading may say TECHNICAL REPORT but it lists "Daily Task" and a "BARRIER OPERATION REPORT".
- "NR": Daily Network Report. Heading "NETWORK REPORT", "NETWORK OPERATION REPORT", latency per terminal.
- "PMS": Preventive Maintenance Services (Subject says preventive maintenance, cleaning of kiosks/booths, before/after photos per gate).
- "OTHER": anything else.

Known sites: ${(c.sites||[]).join(', ')||'none'}. "Mactan Cebu International Airport" means MCIA. Match "Branch:" to a known site.
Known gates/places: ${(c.gates||[]).join(', ')||'none'}.

Fields:
- date: the "Date of Service" (or report date) as YYYY-MM-DD. Dates in these reports are written MM/DD/YYYY.
- location: where the job was, short, e.g. "Gate 1 Entrance", "Gate 5 Exit", "Carpark Entrance", "Terminal 2 Exit 1". Use photo captions like "GATE 1 EXIT" when the Location line is generic. Null for DR and NR.
- issue: the equipment or problem in 1 to 3 words, e.g. "GP60 Reader", "Ticket Printer", "IO Board", "Boom Delay". Null for DR, NR and PMS.
Example names: TR_2026-10-16_PM_G1-ENTRANCE_GP60-READER and TR_2026-10-16_MCIA_CARPARK-ENTRANCE_TICKET-PRINTER.

Return ONLY JSON: {"category":"TR"|"DR"|"NR"|"PMS"|"OTHER","date":"YYYY-MM-DD or null","site_name":"one of the known sites or null","location":"string or null","issue":"string or null","title":"2-5 word title for OTHER or null","summary":"one plain sentence","confidence":0 to 1}
Do not invent values that the document does not support.

File name: ${file.name||'(new document)'}
Document text${images?' (also see the attached page image)':''}:
"""
${(extracted.text||'(no extractable text)').slice(0,S.localInfo?.aiTextLimit||9000)}
"""`;
  try{
    const r=await sample.json(prompt,{modelTier:'quick',images});
    if(!r||typeof r!=='object')return base;
    const cat=CATS[r.category]?r.category:base.category;
    const site=r.site_name?canonSite(detectSite(r.site_name,'')||r.site_name):base.site;
    const loc=r.location||base.gate;
    return {category:cat,date:/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')?r.date:base.date,gate:loc,site,damage:r.issue||base.damage,place:loc,title:r.title||base.title,summary:r.summary||'',confidence:Math.max(0,Math.min(1,+r.confidence||0.7)),source:'ai'};
  }catch(e){if(e&&e.code==='not_granted')S.aiDenied=true;else if(e&&e.code==='rate_limited')toast('The AI is busy. Using rule-based naming for now.',true);return base}
}

/* ---------- Word templates in the company format ---------- */
function usDate(){const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+'/'+d.getFullYear()}
