const MySig={
  key(){return 'sig:'+(S.me.id||'me')},
  async get(){if(S.mySig!==undefined)return S.mySig;let v=null;
    try{if(S.mode==='local'&&!S.offline){const r=await LocalAPI.req('GET','/api/signature');v=(r&&r.png)||null}
      else if(S.mode==='live'&&S.cap.db&&S.me.id){const d=await S.cap.db.collection('data/users/'+S.me.id).doc('signature').get();v=d.exists?(d.data().png||null):null}
      else v=store.get(this.key(),null)}catch(e){v=store.get(this.key(),null)}

  async set(png){if(S.mode==='local')await LocalAPI.req('PUT','/api/signature',{png});else if(S.mode==='live'&&S.cap.db)await S.cap.db.collection('data/users/'+S.me.id).doc('signature').set({png,updated:Date.now()});S.mySig=png;store.set(this.key(),png)},
  async clear(){if(S.mode==='local')await LocalAPI.req('DELETE','/api/signature');else if(S.mode==='live'&&S.cap.db)await S.cap.db.collection('data/users/'+S.me.id).doc('signature').delete();S.mySig=null;store.set(this.key(),null)}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that image.'));i.src=src})}
function sigTrim(c,maxW=800){const x=c.getContext('2d');const d=x.getImageData(0,0,c.width,c.height).data;let x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(let y=0;y<c.height;y++)for(let i=0;i<c.width;i++){if(d[(y*c.width+i)*4+3]>12){if(i<x0)x0=i;if(i>x1)x1=i;if(y<y0)y0=y;if(y>y1)y1=y}}
  if(x1<x0)return null;const pad=6;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(c.width-1,x1+pad);y1=Math.min(c.height-1,y1+pad);
  const w=x1-x0+1,h=y1-y0+1,s=Math.min(1,maxW/w);const o=document.createElement('canvas');o.width=Math.round(w*s);o.height=Math.round(h*s);o.getContext('2d').drawImage(c,x0,y0,w,h,0,0,o.width,o.height);return o.toDataURL('image/png')}
/* photo of a signature on paper -> ink only, transparent background */
function removeBg(img,thr,ink){const sc=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);/* see-through parts count as paper, not ink */x.drawImage(img,0,0,c.width,c.height);
  const id=x.getImageData(0,0,c.width,c.height),p=id.data;const lum=new Float32Array(p.length/4);const hist=new Uint32Array(256);
  for(let i=0,j=0;i<p.length;i+=4,j++){const l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];lum[j]=l;hist[l|0]++}
  let acc=0,paper=255;const target=lum.length*0.6;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=target){paper=Math.max(v,60);break}}
  const ic=ink==='blue'?[26,58,143]:ink==='black'?[17,17,17]:null;const soft=0.12;
  for(let i=0,j=0;i<p.length;i+=4,j++){const r=lum[j]/paper;let a=(thr-r)/soft;a=a<0?0:a>1?1:a;if(ic){p[i]=ic[0];p[i+1]=ic[1];p[i+2]=ic[2]}else{const k=0.55;p[i]*=k;p[i+1]*=k;p[i+2]*=k}p[i+3]=Math.round(a*255)}
  x.putImageData(id,0,0);return c}
async function signatureModal(){
  let mode='draw',ink='#111111',photo=null,photoCanvas=null;
  const body=`<div class="seg" role="tablist" style="align-self:flex-start"><button type="button" class="on" data-sm="draw">Draw</button><button type="button" data-sm="photo">Photo of signature</button></div>
  <div data-pane="draw" style="display:flex;flex-direction:column;gap:8px"><canvas class="sigpad checker" id="sgPad" width="900" height="300" aria-label="Draw your signature here"></canvas>
    <div class="sg-tools"><span>Ink</span><button type="button" class="ink on" data-ink="#111111" style="background:#111111" aria-label="Black ink"></button><button type="button" class="ink" data-ink="#1a3a8f" style="background:#1a3a8f" aria-label="Blue ink"></button><label for="sgW" style="margin-left:8px">Pen</label><input type="range" id="sgW" min="2" max="12" value="5"><button type="button" class="btn sm ghost" id="sgClear" style="margin-left:auto">Clear</button></div></div>
  <div data-pane="photo" hidden style="flex-direction:column;gap:8px"><label class="btn" for="sgFile" style="align-self:flex-start">${I('image')}Choose photo</label><input type="file" id="sgFile" accept="image/*" hidden>
    <div class="sg-prev checker" id="sgPrev"><span class="muted" style="font-size:12.5px">Sign on clean white paper, take a close photo in good light, then choose it here.</span></div>
    <div class="sg-tools"><label for="sgThr">Remove background</label><input type="range" id="sgThr" min="55" max="95" value="80"><label for="sgInk" style="margin-left:8px">Ink</label><select id="sgInk" class="select input" style="width:auto;height:30px"><option value="keep">Keep original</option><option value="blue">Blue</option><option value="black">Black</option></select></div></div>
  <p class="muted" style="margin:0;font-size:12.5px">Saved to your profile and only used when you sign. The background is see-through, so it sits cleanly over your name.</p>`;
  setTimeout(()=>{const sc=$('.scrim:last-of-type');if(!sc)return;const pad=$('#sgPad',sc),ctx=pad.getContext('2d');let drawing=false,last=null;
    const pos=e=>{const r=pad.getBoundingClientRect();return [(e.clientX-r.left)*pad.width/r.width,(e.clientY-r.top)*pad.height/r.height]};
    pad.addEventListener('pointerdown',e=>{drawing=true;pad.setPointerCapture(e.pointerId);last=pos(e);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.lineWidth=+$('#sgW',sc).value;ctx.beginPath();ctx.arc(last[0],last[1],ctx.lineWidth/2,0,7);ctx.fillStyle=ink;ctx.fill()});
    pad.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);const mx=(last[0]+p[0])/2,my=(last[1]+p[1])/2;ctx.quadraticCurveTo(last[0],last[1],mx,my);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p});
    const end=()=>{drawing=false};pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
    $('#sgClear',sc).onclick=()=>ctx.clearRect(0,0,pad.width,pad.height);
    $$('[data-ink]',sc).forEach(b=>b.onclick=()=>{ink=b.dataset.ink;$$('[data-ink]',sc).forEach(x=>x.classList.toggle('on',x===b))});
    $$('[data-sm]',sc).forEach(b=>b.onclick=()=>{mode=b.dataset.sm;$$('[data-sm]',sc).forEach(x=>x.classList.toggle('on',x===b));$$('[data-pane]',sc).forEach(p=>{p.hidden=p.dataset.pane!==mode;if(!p.hidden)p.style.display='flex'})});
    const redo=()=>{if(!photo)return;photoCanvas=removeBg(photo,+$('#sgThr',sc).value/100,$('#sgInk',sc).value);const url=sigTrim(photoCanvas,900);$('#sgPrev',sc).innerHTML=url?`<img src="${url}" alt="Signature preview">`:'<span class="muted">No ink found. Move the slider to the right.</span>'};
    $('#sgFile',sc).onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await loadImg(URL.createObjectURL(f));redo()}catch(err){toast(err.message,true)}};
    $('#sgThr',sc).oninput=redo;$('#sgInk',sc).onchange=redo},0);
  const r=await modal({title:'My signature',wide:true,body,actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:'Save signature',cls:'primary',value:sc=>{const url=mode==='draw'?sigTrim($('#sgPad',sc)):(photoCanvas?sigTrim(photoCanvas):null);if(!url){toast(mode==='draw'?'Draw your signature first.':'Choose a photo of your signature first.',true);return false}return url}}]});
  return r||null}
async function ensureSig(){try{const s=await MySig.get();if(s)return s;const png=await signatureModal();if(!png)return null;await MySig.set(png);toast('Signature saved to your profile');return png}catch(e){toast(e.message||'Could not save the signature.',true);return null}}

  $('[data-ia="del"]',b).onclick=()=>{img.remove();hideImgBar();$('#paper')?.dispatchEvent(new Event('input'))};
  $('#wBody')?.addEventListener('scroll',hideImgBar,{once:true})}

const normTxt=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function docxParas(xml){const out=[];const re=/<w:p(?=[\s>\/])[^>]*>|<\/w:p>/g;const stack=[];let m;while((m=re.exec(xml))){if(m[0].endsWith('/>'))continue;if(m[0]==='</w:p>'){const s=stack.pop();if(s!=null){const end=m.index+6;const body=xml.slice(s,end);out.push({start:s,end,depth:stack.length+1,text:(body.match(/<w:t(?:\s[^>]*)?>[^<]*<\/w:t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'')).join('')})}}else stack.push(m.index)}return out}
async function signDocx(f,buf){
  if(!f||!buf)return;const sig=await ensureSig();if(!sig)return;let sigUrl=sig;let im=await loadImg(sigUrl);
  const sc=document.createElement('div');sc.className='scrim';sc.innerHTML=`<div class="modal sg-modal" role="dialog" aria-modal="true"><div class="pv-h"><b class="mono">${esc(f.name)}</b><span class="orig-actions"><label class="chk" for="sgSize">Size <input type="range" id="sgSize" min="40" max="260" value="120"></label><button class="btn sm" data-a="new" type="button">${I('sign')}Change</button><button class="btn sm ghost" data-a="x" type="button">Cancel</button><button class="btn sm" data-a="pdf" type="button">${I('pdf')}Save signed PDF</button><button class="btn sm primary" data-a="save" type="button">${I('save')}Sign Word file</button></span></div><div class="sg-hint">${I('info')}Drag your signature into place. Drag the corner to resize. Click another page to move it there.</div><div class="pv-b" id="sgPages"><div class="empty"><span class="spinner"></span><span>Preparing the pages…</span></div></div></div>`;
  document.body.appendChild(sc);const close=()=>sc.remove();$('[data-a="x"]',sc).onclick=close;sc.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  let pdfBytes,pdf;const pages=[];
  try{const r=await fetch(previewUrl(f.id));if(!r.ok)throw new Error('Could not prepare the pages.');pdfBytes=await r.arrayBuffer();pdf=await openPdfDoc(pdfBytes.slice(0))}catch(e){$('#sgPages',sc).innerHTML=`<div class="empty">${I('alert')}<b>Cannot sign this file</b><span>${esc(e.message)}</span></div>`;return}
  const box=$('#sgPages',sc);box.innerHTML='<div class="pv-pages"></div>';const wrap=$('.pv-pages',box);const avail=Math.max(280,Math.min(900,box.clientWidth-40));const dpr=Math.min(2,devicePixelRatio||1);
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const v1=pg.getViewport({scale:1});const s=avail/v1.width;const vp=pg.getViewport({scale:s*dpr});const el=document.createElement('div');el.className='sg-page';el.dataset.i=i-1;el.style.width=v1.width*s+'px';el.style.height=v1.height*s+'px';const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width='100%';c.style.height='100%';el.appendChild(c);wrap.appendChild(el);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const tc=await pg.getTextContent();const items=tc.items.filter(t=>t.str&&t.str.trim()).map(t=>({str:t.str,x:t.transform[4],y:v1.height-t.transform[5],w:t.width||0,h:Math.abs(t.transform[3])||10}));pages.push({el,s,W:v1.width,H:v1.height,items})}
  // default spot: above the signer's name, else above "Signature over Printed Name" on the page with PREPARED BY
  let pi=pages.length-1;for(let k=pages.length-1;k>=0;k--){if(pages[k].items.some(t=>/prepared\s*by/i.test(t.str))){pi=k;break}}
  const nm=normTxt(S.me.name);const parts=String(S.me.name||'').split(/\s+/).filter(w=>w.length>1);const nm2=parts.length>1?normTxt(parts[0])+'.*'+normTxt(parts[parts.length-1]):null;
  let anchorItem=pages[pi].items.find(t=>nm.length>4&&(normTxt(t.str).includes(nm)||(nm2&&new RegExp(nm2).test(normTxt(t.str)))));let above=false;
  if(!anchorItem){anchorItem=pages[pi].items.filter(t=>/signature\s*over/i.test(t.str)).sort((a,b)=>a.x-b.x)[0];above=true}
  const st={pi,w:120,x:0,y:0};const ar=im.height/im.width;
  if(anchorItem){const cx=anchorItem.x+(anchorItem.w||60)/2;const h=st.w*ar;st.x=cx-st.w/2;st.y=above?anchorItem.y-anchorItem.h-h-2:anchorItem.y-h*0.8}else{const P=pages[pi];st.x=P.W*0.12;st.y=P.H*0.75}
  const sbox=document.createElement('div');sbox.className='sg-box';sbox.innerHTML=`<img src="${sigUrl}" alt="Your signature"><span class="sg-rs" title="Resize"></span>`;
  const clamp=()=>{const P=pages[st.pi];const h=st.w*ar;st.x=Math.max(0,Math.min(P.W-st.w,st.x));st.y=Math.max(0,Math.min(P.H-h,st.y))};

<script>
/* ================= Offline mode (office PC version): keep working while the PC is off ================= */
const Outbox={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('fileorg-outbox',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore('ops',{keyPath:'qid'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},

  put(op){return this.tx('readwrite',st=>st.put(op))},

S.waiting=0;
async function refreshWaiting(){S.waiting=(await Outbox.all()).length;updateNavMeta()}
function offlineBanner(){return `<div class="banner off-banner">${I('alert')}<span><b>The office PC is offline.</b> Keep working: new uploads, reports and chat messages are saved on this device${S.waiting?` (<b>${S.waiting}</b> waiting)`:''} and sent automatically when it is back. Files already in the library open again once it is back.</span></div>`}
function addPlaceholder(op){const id='pending-'+op.qid;if(op.type==='create'){if(S.files.some(f=>f.id===id))return;S.files.push({...op.meta,id,pending:true,qid:op.qid,size:op.blob?op.blob.size:JSON.stringify(op.env||{}).length,_blob:op.blob||null,_env:op.env||null,created:op.at,updated:op.at,trashed:false,starredBy:[],versions:[]})}
  else if(op.type==='replace'){const f=fileById(op.fileId);if(f){f._blob=op.blob||null;f._env=op.env||null;f.pendingEdit=op.qid;f.updated=op.at}}
  else if(op.type==='msg'){if(!S.messages.some(m=>m.id===id))S.messages.push({...op.data,id,pending:true})}}
async function queue(op){op.qid=op.qid||'q'+uid();op.at=op.at||Date.now();await Outbox.put(op);addPlaceholder(op);await refreshWaiting();return op}

function anyDirty(){return !!((typeof W!=='undefined'&&W.dirty)||(typeof X!=='undefined'&&X.dirty)||(typeof P!=='undefined'&&P.dirty))}

let flushing=false;

  try{for(const op of await Outbox.all()){try{
      if(op.type==='create'){const id=await OFF.create(op.meta,op.isEnv?op.env:op.blob,op.isEnv);S.files=S.files.filter(f=>f.id!=='pending-'+op.qid);OFF.add('activity',{uid:S.me.id,action:'uploaded (saved while offline)',target:op.meta.name,fileId:id,created:Date.now()}).catch(()=>{});for(const k of ['word','excel','pdf'])if(S.open[k]==='pending-'+op.qid)S.open[k]=id}

let syncTimer=null;

  if(S.offline){let ok=false;try{const r=await fetch('/api/info',{cache:'no-store'});ok=r.ok}catch(e){}
    if(!ok)return;S.offline=false;updateNavMeta();
    if(S.coldOffline){await flushOutbox();if(anyDirty()){S.reloadReady=true;toast('The office PC is back. Save your work, then reload to see the latest files.');softRender()}else location.reload();return}
    softRender()}
  if(!S.offline&&S.waiting)await flushOutbox()},12000)}

async function offlineBoot(){
  const me=store.get('localMe',null),info=store.get('localInfo',null),snap=store.get('snap',null);
  if(!me||!info)throw new Error('The office PC is offline, and this device has not used File Org before. Try again when the PC is on.');

  toast('Working offline. New work is saved on this device and uploads when the office PC is back.')}

(()=>{
  OFF.create=LocalAPI.create.bind(LocalAPI);OFF.replace=LocalAPI.replace.bind(LocalAPI);OFF.fetch=LocalAPI.fetch.bind(LocalAPI);OFF.start=LocalAPI.start.bind(LocalAPI);
  OFF.add=DB.add.bind(DB);OFF.update=DB.update.bind(DB);OFF.del=DB.del.bind(DB);
  LocalAPI.create=async(meta,blobOrEnv,isEnv)=>{if(!S.offline){try{return await OFF.create(meta,blobOrEnv,isEnv)}catch(e){if(!isNetErr(e))throw e;S.offline=true}}
    const op=await queue({type:'create',meta:{...meta,ownerId:S.me.id,updatedBy:S.me.id},blob:isEnv?null:blobOrEnv,env:isEnv?blobOrEnv:null,isEnv:!!isEnv});toast('Saved on this device. It uploads when the office PC is back.');softRender();return 'pending-'+op.qid};
  LocalAPI.replace=async(f,blobOrEnv,isEnv)=>{
    if(f.pending){const op=await Outbox.get(f.qid);if(!op)throw new Error('The waiting copy was not found on this device.');op.blob=isEnv?null:blobOrEnv;op.env=isEnv?blobOrEnv:null;op.isEnv=!!isEnv;await Outbox.put(op);f._blob=op.blob;f._env=op.env;f.updated=Date.now();return}
    if(!S.offline){try{return await OFF.replace(f,blobOrEnv,isEnv)}catch(e){if(!isNetErr(e))throw e;S.offline=true}}
    if(f.pendingEdit){const op=await Outbox.get(f.pendingEdit);if(op){op.blob=isEnv?null:blobOrEnv;op.env=isEnv?blobOrEnv:null;op.isEnv=!!isEnv;await Outbox.put(op);addPlaceholder(op);return}}
    await queue({type:'replace',fileId:f.id,name:f.name,blob:isEnv?null:blobOrEnv,env:isEnv?blobOrEnv:null,isEnv:!!isEnv});toast('Changes saved on this device. They upload when the office PC is back.')};
  LocalAPI.fetch=async f=>{if(f._env)return f._env;if(f._blob)return f._blob.arrayBuffer();if(S.offline)throw new Error('This file is on the office PC, which is offline right now. It opens again when the PC is back.');return OFF.fetch(f)};
  LocalAPI.start=async()=>{let ok=false;try{const r=await fetch('/api/info',{cache:'no-store'});ok=r.ok}catch(e){}
    if(!ok)return offlineBoot();
    await OFF.start();try{store.set('localInfo',{...S.localInfo})}catch(e){}snapSave();setInterval(snapSave,30000);window.addEventListener('beforeunload',snapSave);await restorePending();startSync();if(S.waiting)setTimeout(flushOutbox,1500)};
  DB.add=async(col,data)=>{if(S.mode!=='local')return OFF.add(col,data);if(!S.offline){try{return await OFF.add(col,data)}catch(e){if(!isNetErr(e))throw e;S.offline=true}}

  const guard=fn=>async(...a)=>{if(S.mode==='local'&&S.offline)throw {message:'The office PC is offline. Moving, renaming and deleting work again when it is back.'};return fn(...a)};
  DB.update=guard(OFF.update);DB.del=guard(OFF.del);
})();

<script>
/* ================= Photos side by side (photo grid) ================= */
const isImgBlock=el=>!!el&&el.nodeType===1&&!el.dataset?.dx&&/^(P|DIV|H[1-6]|SPAN|FIGURE)$/.test(el.tagName)&&!!el.querySelector('img')&&!el.querySelector('table')&&el.textContent.replace(/ /g,'').trim()==='';
function buildGrid(imgs,cols){const t=document.createElement('table');t.className='photo-grid';t.setAttribute('style','width:100%;border-collapse:collapse;table-layout:fixed');let tr;
  imgs.forEach((im,n)=>{if(n%cols===0)tr=t.insertRow();const td=tr.insertCell();td.setAttribute('style',`border:none;padding:4px;vertical-align:top;text-align:center;width:${(100/cols).toFixed(2)}%`);
    im.removeAttribute('width');im.removeAttribute('height');im.classList.remove('img-sel');im.setAttribute('style','width:100%;height:auto;display:block');td.appendChild(im)});
  const last=t.rows[t.rows.length-1];while(last&&last.cells.length<cols){const td=last.insertCell();td.setAttribute('style','border:none;padding:4px');td.innerHTML='&nbsp;'}
  return t}
/* after importing a Word file: runs of 2+ photo-only paragraphs become a 2-column grid, like the photo pairs in the original */
function gridify(html,cols=2){const d=document.createElement('div');d.innerHTML=html;const kids=[...d.children];let i=0;
  while(i<kids.length){if(!isImgBlock(kids[i])){i++;continue}let j=i;const run=[];while(j<kids.length&&isImgBlock(kids[j])){run.push(...kids[j].querySelectorAll('img'));j++}
    if(run.length>=2){kids[i].before(buildGrid(run,cols));for(let k=i;k<j;k++)kids[k].remove()}i=j}
  return d.innerHTML}
(()=>{const imp=importToHtml;importToHtml=async(buf,name)=>{const h=await imp(buf,name);return extOf(name||'')==='docx'?gridify(h):h}})();

/* ribbon button: arrange the selected photos (or the photo you clicked) side by side */
async function arrangePhotos(){const paper=$('#paper');if(!paper)return;const sel=getSelection();
  let imgs=[...paper.querySelectorAll('img')].filter(im=>sel.rangeCount&&!sel.isCollapsed&&sel.containsNode(im,true));
  const picked=$('#paper img.img-sel')||(window._lastImg&&paper.contains(window._lastImg)?window._lastImg:null);let grid=null;
  if(!imgs.length&&picked){grid=picked.closest('table.photo-grid');if(grid)imgs=[...grid.querySelectorAll('img')];else{
      let blk=picked;while(blk.parentElement&&blk.parentElement!==paper)blk=blk.parentElement;let a=blk,b=blk;
      while(isImgBlock(a.previousElementSibling))a=a.previousElementSibling;while(isImgBlock(b.nextElementSibling))b=b.nextElementSibling;
      for(let n=a;n;n=n.nextElementSibling){imgs.push(...n.querySelectorAll('img'));if(n===b)break}}}
  if(!imgs.length){toast('Click a photo, or select several photos, then click Side by side.');return}
  const cols=await modal({title:'Arrange photos',body:`<p class="muted" style="margin:0">${imgs.length} photo${imgs.length>1?'s':''} selected. How many per row?</p><div class="seg" role="group" style="align-self:flex-start">${[1,2,3,4].map(n=>`<button type="button" data-cols="${n}" class="${n===2?'on':''}">${n}</button>`).join('')}</div>`,
    actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:'Arrange',cls:'primary',value:sc=>+($('[data-cols].on',sc)?.dataset.cols||2)}]});
  if(!cols)return;const first=imgs[0];let anchor=first.closest('table.photo-grid')||first;while(anchor.parentElement&&anchor.parentElement!==paper)anchor=anchor.parentElement;
  const blocks=new Set();imgs.forEach(im=>{let b=im.closest('table.photo-grid')||im;while(b.parentElement&&b.parentElement!==paper)b=b.parentElement;blocks.add(b)});
  const t=buildGrid(imgs,cols);anchor.before(t);blocks.forEach(b=>{if(b!==t&&!b.querySelector('img'))b.remove()});
  hideImgBar();paper.dispatchEvent(new Event('input'));toast(cols===1?'Photos stacked':'Photos arranged '+cols+' per row')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-cols]');if(c){$$('[data-cols]',c.parentElement).forEach(b=>b.classList.toggle('on',b===c))}});
document.addEventListener('mousedown',e=>{if(e.target.closest('#wGrid'))e.preventDefault()},true);
document.addEventListener('click',e=>{if(e.target.closest('#wGrid'))arrangePhotos()});
</script>

  rib.before(tabs);let start='home';try{start=store.get('wTab','home')||'home'}catch(e){}WP.tab(start==='pic'?'home':start);

    const k=b.dataset.pf;({wrap:()=>WP.menu(b,WP.wrapItems(img)),front:()=>WP.order(img,+1),back:()=>WP.order(img,-1),al:()=>WP.align(img,'left'),ac:()=>WP.align(img,'center'),ar:()=>WP.align(img,'right'),

WP.fit=(force)=>{const p=WP.paper(),body=$('#wBody');if(!p||!body||!body.clientWidth)return;if(W.userZoom&&!force)return;
  const avail=body.clientWidth-(innerWidth<=860?16:48);const z=Math.min(1,Math.max(.25,+(avail/WP.pageW()).toFixed(3)));

<script>
ICONS.mail='<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>';
const GM={recent:()=>{try{return JSON.parse(localStorage.getItem('fo-gm-recent')||'[]')}catch(e){return[]}},
  remember:list=>{try{const r=[...new Set([...list,...GM.recent()].map(x=>x.toLowerCase()))].slice(0,8);localStorage.setItem('fo-gm-recent',JSON.stringify(r))}catch(e){}},
  emails:s=>String(s||'').split(/[,;\s]+/).map(x=>x.trim()).filter(Boolean),
  valid:e=>/^[^\s@<>()",;]+@[^\s@<>()",;]+\.[a-z]{2,}$/i.test(e),
  direct:()=>typeof GD!=='undefined'&&GD.on&&S.localInfo?.storage==='gdrive'};
GM.size=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
/* the real file bytes, whatever mode File Org runs in */
GM.blob=f=>Promise.race([GM.blob0(f),new Promise((_,j)=>setTimeout(()=>j(new Error('Reading the file took too long. Check the connection and try again.')),60000))]);
GM.blob0=async f=>{let b;
  if(GM.direct()){try{b=await GD.download(f.id)}catch(e){throw new Error(e instanceof TypeError?'Could not download the file from Google Drive. Check the connection.':e.message)}}
  else if(S.mode==='local'){const r=await fetch(LocalAPI.blobUrl(f));if(!r.ok)throw new Error('Could not read the file ('+r.status+').');b=await r.blob()}
  else if(f._blob&&f.store!=='env')b=f._blob;
  else if(f.url&&f.store!=='env'){const r=await fetch(f.url);if(!r.ok)throw new Error('Could not read the file ('+r.status+').');b=await r.blob()}
  else{const d=await fetchFile(f);if(d instanceof ArrayBuffer)b=new Blob([d]);else if(f.kind==='doc'&&d&&d.html)b=(await docExport(d.html,'x')).blob;else if(f.kind==='sheet'&&d&&(d.sheets||Array.isArray(d)))b=await xlsxBlob(d.sheets||d);else if(d&&d.b64)b=new Blob([b642ab(d.b64)]);else throw new Error('This file cannot be attached yet. Download it and attach it by hand.')}
  return new File([b],f.name,{type:b.type||(typeof gdMime==='function'?gdMime(f.name):'application/octet-stream')})};
const b64=async blob=>{const buf=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<buf.length;i+=0x8000)s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));return btoa(s)};
const b64s=str=>btoa(unescape(encodeURIComponent(str)));
GM.mime=async({to,cc,subject,body,file,sig})=>{const rnd=()=>'fo_'+Math.random().toString(36).slice(2);const mx=rnd(),alt=rnd(),rel=rnd();const enc=s=>/^[\x20-\x7e]*$/.test(s)?s:`=?UTF-8?B?${b64s(s)}?=`;
  const wrap=s=>s.replace(/.{1,76}/g,'$&\r\n');
  /* pictures in the signature travel inside the email (Gmail shows them without "load images") */
  const inl=[];const imgMap={};if(sig){for(const k of['photo','logo']){const src=k==='logo'?(sig.showLogo?DELTECH_LOGO:''):(sig.showPhoto?sig.photo:'');const m=src&&src.match(/^data:(image\/[\w+.-]+);base64,(.*)$/);if(m){const cid=k+'.'+rnd()+'@fileorg';imgMap[k]='cid:'+cid;inl.push({cid,type:m[1],data:m[2],name:k+(m[1].includes('png')?'.png':'.jpg')})}}}
  const textBody=body+(sig?'\n\n'+ES.text(sig):'');
  const htmlBody=`<div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55;color:#16201C">${esc(body).replace(/\r?\n/g,'<br>')}</div>${sig?`<div style="margin-top:22px">${ES.html(sig,imgMap)}</div>`:''}`;
  const L=[`To: ${to.join(', ')}`,...(cc.length?[`Cc: ${cc.join(', ')}`]:[]),`Subject: ${enc(subject)}`,'MIME-Version: 1.0',`Content-Type: multipart/mixed; boundary="${mx}"`,'',
    `--${mx}`,`Content-Type: multipart/alternative; boundary="${alt}"`,'',
    `--${alt}`,'Content-Type: text/plain; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap(b64s(textBody)),
    `--${alt}`,`Content-Type: multipart/related; boundary="${rel}"`,'',
    `--${rel}`,'Content-Type: text/html; charset="UTF-8"','Content-Transfer-Encoding: base64','',wrap(b64s(htmlBody))];
  for(const im of inl)L.push(`--${rel}`,`Content-Type: ${im.type}; name="${im.name}"`,'Content-Transfer-Encoding: base64',`Content-ID: <${im.cid}>`,`Content-Disposition: inline; filename="${im.name}"`,'',wrap(im.data));
  L.push(`--${rel}--`,'',`--${alt}--`,'');
  if(file){const fn=file.name.replace(/"/g,'');L.push(`--${mx}`,`Content-Type: ${file.type||'application/octet-stream'}; name="${enc(fn)}"`,`Content-Disposition: attachment; filename="${enc(fn)}"`,'Content-Transfer-Encoding: base64','',wrap(await b64(file)))}
  L.push(`--${mx}--`,'');return L.join('\r\n')};
/* Gmail permission (asked once, the first time someone sends) */
GM.scope='https://www.googleapis.com/auth/gmail.send';
GM.askGmail=()=>new Promise(async(res,rej)=>{if(!window.google?.accounts?.oauth2){try{await GD.loadGsi()}catch(e){return rej(e)}}const tc=google.accounts.oauth2.initTokenClient({client_id:GD.cfg.clientId,scope:GM.scope,include_granted_scopes:true,hint:GD.email||undefined,
    callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));if(!google.accounts.oauth2.hasGrantedAllScopes(r,GM.scope))return rej(new Error('File Org needs permission to send email. Tap Send again and tick “Send email on your behalf”.'));
      GD.token=r.access_token;GD.exp=Date.now()+(+r.expires_in||3600)*1000;GD.saveTok();try{sessionStorage.setItem('fo-gm-ok','1')}catch(e){}res()},
    error_callback:e=>rej(new Error(e&&e.type==='popup_failed_to_open'?'Allow pop-ups for this site, then tap Send again.':'Gmail permission was not given.'))});
  tc.requestAccessToken({prompt:''})});
GM.hasGmail=()=>{try{return sessionStorage.getItem('fo-gm-ok')==='1'&&GD.exp>Date.now()+60000}catch(e){return false}};
GM.sendGmail=async(msg)=>{const raw=await GM.mime(msg);if(raw.length>34*1024*1024)throw new Error('This file is too big for Gmail (25 MB limit). Choose “Google Drive link” instead.');
  if(!navigator.onLine)throw new Error('You are offline. Connect to the internet, then send again.');
  let r;try{
    if(raw.length<4.5*1024*1024){const b64u=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      r=await GD.rf('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+GD.token,'content-type':'application/json'},body:JSON.stringify({raw:b64u})})}
    else r=await GD.rf('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media',{method:'POST',headers:{Authorization:'Bearer '+GD.token,'content-type':'message/rfc822'},body:raw})}
  catch(e){throw new Error('Could not reach Gmail. Check the internet connection and send again.')}
  if(!r.ok){const j=await r.json().catch(()=>({}));const m=j.error?.message||'';
    if(/has not been used|is disabled|accessNotConfigured|SERVICE_DISABLED/i.test(m+JSON.stringify(j.error?.details||'')))throw new Error('Gmail sending is not turned on yet. Ask the admin to enable the Gmail API in Google Cloud (project FileOrg).');
    if(r.status===401||r.status===403){try{sessionStorage.removeItem('fo-gm-ok')}catch(e){}throw new Error('Gmail permission expired or was not given. Tap Send again and allow “Send email on your behalf”.')}
    throw new Error(m||'Gmail could not send this ('+r.status+').')}
  return r.json()};
GM.driveLink=async(f,to)=>{for(const em of to){try{await GD.json(`${GAPI.drive}/files/${f.id}/permissions?sendNotificationEmail=false&supportsAllDrives=true&fields=id`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:'user',role:'reader',emailAddress:em})})}catch(e){}}
  const m=await GD.json(`${GAPI.drive}/files/${f.id}?fields=webViewLink&supportsAllDrives=true`);return m.webViewLink||('https://drive.google.com/file/d/'+f.id+'/view')};

async function sendByGmail(f){if(!f){toast('Save the file first, then send it.');return}
  const me=S.me?.name||'';const base=f.name.replace(/\.[^.]+$/,'');const kind={TR:'technical report',PMS:'preventive maintenance report',DR:'daily report',NR:'network report'}[f.category]||'file';
  const direct=GM.direct();const recent=GM.recent();
  const sig=ES.get();const useSig=sig.on||!sig.saved;const defBody=`Good day,\n\nPlease see the attached ${kind}: ${f.name}\n\nThank you.`+(useSig?'':`\n\n${me}\nDeltech Parking Systems and Solutions Inc.`);
  let file=null,fileErr='';const ready=GM.blob(f).then(x=>{file=x;const st=document.getElementById('gm-st');if(st){st.textContent=GM.size(x.size);st.classList.add('ok')}const big=x.size>24*1024*1024;const lk=document.getElementById('gm-link');if(big&&lk){lk.checked=true}}).catch(e=>{fileErr=e.message;const st=document.getElementById('gm-st');if(st)st.textContent='Could not read'});
  const canShare=!direct&&!!navigator.canShare&&matchMedia('(pointer:coarse)').matches;
  const how=direct?`Sends from your Gmail (${esc(GD.email)}) with the file attached. The first time, Google asks you to allow File Org to send email.`
    :canShare?'Opens your phone’s share sheet with the file attached. Choose Gmail.':'Opens a new Gmail message and downloads the file. Drag the downloaded file into the email to attach it.';
  const res=await modal({title:'Send by Gmail',cls:'gm-modal',body:`<div class="gm-modal" style="display:flex;flex-direction:column;gap:12px">
    <div class="gm-file">${ficon(f.kind)}<div style="min-width:0"><div class="nm">${esc(f.name)}</div><div class="sz">${esc(f.folder||'')}</div></div><span class="st" id="gm-st">Preparing…</span></div>
    <div class="field"><label for="gm-to">To</label><input class="input" id="gm-to" type="email" multiple autocomplete="email" inputmode="email" placeholder="name@example.com, another@example.com" spellcheck="false"></div>
    ${recent.length?`<div class="gm-chips" aria-label="Recent recipients">${recent.map(r=>`<button type="button" data-gm-add="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}
    <div class="field"><label for="gm-cc">Cc <span class="muted" style="font-weight:400">(optional)</span></label><input class="input" id="gm-cc" type="email" multiple autocomplete="email" inputmode="email" spellcheck="false"></div>
    <div class="field"><label for="gm-su">Subject</label><input class="input" id="gm-su" value="${esc(base)}"></div>
    <div class="field"><label for="gm-bd">Message</label><textarea class="input" id="gm-bd" rows="7">${esc(defBody)}</textarea></div>
    ${direct?`<div class="gm-seg" role="radiogroup" aria-label="How to send the file"><label><input type="radio" name="gm-how" value="attach" checked> Attach the file</label><label><input type="radio" name="gm-how" value="link" id="gm-link"> Google Drive link (for big files)</label></div>`:''}
    <div class="gm-sigrow" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer"><input type="checkbox" id="gm-sig" ${useSig?'checked':''} style="accent-color:var(--accent);width:16px;height:16px;margin:0"> Add my email signature</label><a href="#profile" data-gm-editsig style="font-size:12.5px;color:var(--accent)">${sig.saved?'Edit':'Set up'} signature</a></div>
    <div class="gm-how">${I('info')}<span>${how}</span></div><div class="gm-err" id="gm-err"></div></div>`,
    actions:[{label:'Cancel',cls:'ghost',value:()=>null},{label:direct?'Send':canShare?'Share…':'Open Gmail',cls:'primary',value:sc=>{
      const err=$('#gm-err',sc);err.textContent='';const to=GM.emails($('#gm-to',sc).value),cc=GM.emails($('#gm-cc',sc).value);
      const bad=[...to,...cc].filter(x=>!GM.valid(x));if(!to.length&&!canShare){err.textContent='Add at least one email address.';$('#gm-to',sc).focus();return false}
      if(bad.length){err.textContent='Check this address: '+bad[0];return false}
      const msg={to,cc,subject:$('#gm-su',sc).value.trim()||base,body:$('#gm-bd',sc).value,how:(sc.querySelector('input[name="gm-how"]:checked')||{}).value||'attach',sig:$('#gm-sig',sc)?.checked?ES.get():null};
      if(direct){if(!GM.hasGmail()){msg.perm=GM.askGmail()/* started inside the tap, so the Google window is allowed */}return msg}
      if(canShare){if(!file){err.textContent=fileErr||'Still preparing the file… tap again in a moment.';return false}
        const data={files:[file],title:msg.subject,text:msg.body+(msg.sig?'\n\n'+ES.text(msg.sig):'')};if(!navigator.canShare(data)){err.textContent='This phone cannot share this file type. Use Download instead.';return false}
        msg.share=navigator.share(data);return msg}
      const u='https://mail.google.com/mail/?view=cm&fs=1'+(to.length?'&to='+encodeURIComponent(to.join(',')):'')+(cc.length?'&cc='+encodeURIComponent(cc.join(',')):'')+'&su='+encodeURIComponent(msg.subject)+'&body='+encodeURIComponent(msg.body+(msg.sig?'\n\n'+ES.text(msg.sig):'')+'\n\n(Attachment: '+f.name+')');
      msg.win=window.open(u,'_blank','noopener');return msg}}]});
  if(!res)return;
  try{
    if(res.share){await res.share;GM.remember(res.to);logAct('shared by email',f.name,f.id);return}
    if(res.win!==undefined){await ready;if(file){const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
      GM.remember(res.to);toast(file?'Gmail opened. Drag '+f.name+' from Downloads into the email.':'Gmail opened. Attach the file from File Org.');logAct('emailed',f.name,f.id);return}
    if(res.perm)await res.perm;
    toast('Sending '+f.name+'…');let body=res.body;let attach=null;
    if(res.how==='link'){const link=await GM.driveLink(f,[...res.to,...res.cc]);body+=`\n\nOpen the file: ${link}`}
    else{await ready;if(!file)throw new Error(fileErr||'Could not read the file.');attach=file}
    await GM.sendGmail({to:res.to,cc:res.cc,subject:res.subject,body,file:attach,sig:res.sig});
    GM.remember(res.to);toast('Sent to '+res.to.join(', '));logAct('emailed',f.name+' to '+res.to.join(', '),f.id)}
  catch(e){if(e&&e.name==='AbortError')return;toast(e.message||'Could not send.',true)}}
document.addEventListener('click',e=>{if(e.target.closest('[data-gm-editsig]')){e.target.closest('.scrim')?.remove()}});

  t.innerHTML=`<div class="ic">${NT.svg(NT.ic[k])}</div><div><div class="tt">${esc(opt.title||NT.title[k])}</div><div class="tm">${esc(msg)}</div>${opt.action?`<div class="act"><button class="btn sm" type="button">${esc(opt.action.label)}</button></div>`:''}</div><button class="x" type="button" aria-label="Close">${NT.svg('<path d="M18 6 6 18M6 6l12 12"/>')}</button><div class="bar" style="animation-duration:${dur}ms"></div>`;
  box.appendChild(t);let timer;const close=()=>{clearTimeout(timer);t.classList.add('out');setTimeout(()=>t.remove(),260)};
  const arm=ms=>{clearTimeout(timer);timer=setTimeout(close,ms)};arm(dur);
  t.addEventListener('mouseenter',()=>clearTimeout(timer));t.addEventListener('mouseleave',()=>arm(1800));
  $('.x',t).onclick=close;if(opt.action)$('.act button',t).onclick=()=>{close();opt.action.run()};
  if(k==='err'||k==='ok')NC.addLocal(k,msg);return{close}};

/* ---------- notification bell ---------- */
const NC={key:()=>'fo-nc-'+(S.me?.id||'me'),items:[],seen:{msgs:0,acts:0},inited:false,filter:'all'};
NC.load=()=>{try{const o=JSON.parse(localStorage.getItem(NC.key())||'{}');NC.items=o.items||[];NC.seen=o.seen||{msgs:0,acts:0}}catch(e){}};
NC.save=()=>{try{localStorage.setItem(NC.key(),JSON.stringify({items:NC.items.slice(0,60),seen:NC.seen}))}catch(e){}};
NC.unread=()=>NC.items.filter(i=>!i.read).length;
NC.push=(it,quiet)=>{if(NC.items.some(x=>x.id===it.id))return;NC.items.unshift({read:false,at:Date.now(),...it});NC.items=NC.items.slice(0,60);NC.save();NC.badge(true);
  if(!quiet&&document.hidden&&'Notification'in window&&Notification.permission==='granted'){try{const n=new Notification(it.title.replace(/<[^>]+>/g,''),{body:it.sub||'',icon:'/icons/icon-192.png',tag:it.id});n.onclick=()=>{focus();NC.open(it);n.close()}}catch(e){}}};
NC.addLocal=(k,msg)=>{if(k!=='err')return;NC.push({id:'l'+Date.now()+Math.random(),type:'err',title:'Problem: '+msg.slice(0,90)},true)};
NC.badge=(ring)=>{const b=$('#nBell');if(!b)return;const n=NC.unread();const d=$('.nb-dot',b);if(n){if(d)d.textContent=n>99?'99+':n;else b.insertAdjacentHTML('beforeend',`<span class="nb-dot">${n>99?'99+':n}</span>`)}else d&&d.remove();
  b.setAttribute('aria-label',n?`Notifications, ${n} new`:'Notifications');if(ring){b.classList.remove('ring');void b.offsetWidth;b.classList.add('ring')}};
NC.scan=()=>{if(!S.me||!S.me.id||!Array.isArray(S.messages))return;const me=S.me.id;
  if(!NC.inited){NC.load();NC.inited=true;if(!NC.seen.msgs&&!NC.seen.acts){/* first run: start from now */NC.seen.msgs=Date.now();NC.seen.acts=Date.now();NC.save()}}
  const quiet=!NC.ready;const inChat=currentRoute()==='chat'&&!document.hidden;
  for(const m of S.messages){if(m.created>NC.seen.msgs&&m.uid!==me){if(!inChat)NC.push({id:'m'+m.id,type:'msg',uid:m.uid,title:`<b>${esc(nameOf(m.uid))}</b> in #${esc(m.channel||'general')}`,sub:(m.text||'').slice(0,120)||(m.fileId?'Shared a file':''),go:'#chat'},quiet)}}
  NC.seen.msgs=Math.max(NC.seen.msgs,...S.messages.map(m=>m.created||0));
  for(const a of (S.activity||[])){if(a.created>NC.seen.acts&&a.uid!==me&&a.uid!=='system'&&!/^viewed|^downloaded|^opened/.test(a.action||''))NC.push({id:'a'+a.id,type:'act',uid:a.uid,title:`<b>${esc(nameOf(a.uid))}</b> ${esc(a.action)} ${a.target?`<b>${esc(a.target)}</b>`:''}`,fileId:a.fileId},quiet)}
  NC.seen.acts=Math.max(NC.seen.acts,...(S.activity||[]).map(a=>a.created||0));NC.save();NC.badge();NC.ready=true;
  if($('#nPanel'))NC.renderList()};
NC.ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d'};
NC.av=it=>{if(it.type==='err')return`<span class="av ic" style="background:color-mix(in srgb,#C2410C 14%,transparent);color:#C2410C">${NT.svg(NT.ic.err)}</span>`;
  const u=S.namesFull?.[it.uid]||{};const nm=nameOf(it.uid);return`<span class="av" style="background:${u.color||'#1C5B49'}">${u.photo?`<img src="${esc(u.photo)}" alt="">`:esc(initials(nm))}</span>`};
NC.renderList=()=>{const l=$('#nList');if(!l)return;const f=NC.filter;const list=NC.items.filter(i=>f==='all'||(f==='msg'?i.type==='msg':f==='files'?i.type==='act':!i.read));
  l.innerHTML=list.length?list.map(i=>`<button class="ni ${i.read?'':'unread'}" data-nid="${esc(i.id)}" type="button">${NC.av(i)}<span style="min-width:0"><span class="t">${i.title}</span>${i.sub?`<span class="s" style="display:block">${esc(i.sub)}</span>`:''}</span><span class="w">${NC.ago(i.at)}</span></button>`).join('')
    :`<div class="ne">${NT.svg(ICONS.bell)}<div>You're all caught up</div><div style="margin-top:4px;font-size:12px">New chat messages and file changes from your team show up here.</div></div>`};
NC.toggle=()=>{if($('#nPanel')){NC.close();return}const sc=document.createElement('div');sc.className='nscrim';sc.onclick=NC.close;
  const p=document.createElement('div');p.className='npanel';p.id='nPanel';p.setAttribute('role','dialog');p.setAttribute('aria-label','Notifications');
  const perm='Notification'in window?Notification.permission:'unsupported';
  p.innerHTML=`<div class="nh"><h3>Notifications</h3><button class="btn sm ghost" id="nRead" type="button">Mark all read</button></div>
    <div class="nf" role="tablist">${[['all','All'],['unread','Unread'],['msg','Chat'],['files','Files']].map(([k,l])=>`<button type="button" data-nf="${k}" class="${NC.filter===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="nl" id="nList"></div>
    ${perm==='default'?`<div class="nfoot">${NT.svg(ICONS.bell)}<span style="flex:1">Get alerts even when File Org is in the background.</span><button class="btn sm primary" id="nPerm" type="button">Turn on</button></div>`:''}`;
  document.body.append(sc,p);NC.renderList();
  p.onclick=e=>{const it=e.target.closest('[data-nid]');if(it){const n=NC.items.find(x=>x.id===it.dataset.nid);if(n){n.read=true;NC.save();NC.badge();NC.close();NC.open(n)}return}
    const fb=e.target.closest('[data-nf]');if(fb){NC.filter=fb.dataset.nf;$$('[data-nf]',p).forEach(b=>b.classList.toggle('on',b===fb));NC.renderList()}};
  $('#nRead',p).onclick=()=>{NC.items.forEach(i=>i.read=true);NC.save();NC.badge();NC.renderList()};
  $('#nPerm',p)?.addEventListener('click',async()=>{try{const r=await Notification.requestPermission();toast(r==='granted'?'Alerts are on':'Alerts were not allowed. You can change this in the browser settings.',r!=='granted');$('#nPerm',p)?.closest('.nfoot')?.remove()}catch(e){}});
  document.addEventListener('keydown',NC.esc)};
NC.esc=e=>{if(e.key==='Escape')NC.close()};
NC.close=()=>{$('#nPanel')?.remove();$$('.nscrim').forEach(x=>x.remove());document.removeEventListener('keydown',NC.esc)};
NC.open=it=>{if(it.go)location.hash=it.go;else if(it.fileId){const f=fileById(it.fileId);if(f)openFile(f);else location.hash='#activity'}};
NC.mount=()=>{const top=$('.top');if(!top||$('#nBell'))return;const theme=top.querySelector('#themeBtn,[data-theme-toggle],.theme-btn')||[...top.querySelectorAll('button')].find(b=>/theme|dark/i.test(b.getAttribute('aria-label')||b.title||''));
  const b=document.createElement('button');b.className='btn icon ghost nbell';b.id='nBell';b.type='button';b.innerHTML=I('bell');b.onclick=NC.toggle;
  if(theme)theme.before(b);else top.appendChild(b);NC.badge()};
setInterval(()=>{try{NC.mount();NC.scan()}catch(e){}},2500);
[300,1200].forEach(ms=>setTimeout(()=>{try{NC.mount()}catch(e){}},ms));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){try{NC.scan()}catch(e){}}});
</script>

<style>
/* ================= Email signature (Profile) ================= */
.es-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.es-grid .full{grid-column:1/-1}
.es-prev{border:1px solid var(--line);border-radius:14px;background:#fff;padding:22px 20px;overflow:auto;position:relative}
.es-prev::before{content:"Preview · how it looks in Gmail";position:absolute;top:8px;right:12px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8A9792}
.es-opts{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.es-opts label{display:flex;align-items:center;gap:7px;cursor:pointer}
.es-opts input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.es-photo{display:flex;align-items:center;gap:10px}
.es-photo .pv{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;font-weight:600;color:var(--accent);flex:none}
.es-photo .pv img{width:100%;height:100%;object-fit:cover}
@media (max-width:640px){.es-grid{grid-template-columns:minmax(0,1fr)}}
</style>

</td></tr></table>`};

ES.small=async(file,max=192)=>{const url=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(file)});const im=await loadImg(url);
  const c=document.createElement('canvas');const sz=Math.min(max,Math.min(im.naturalWidth,im.naturalHeight));c.width=c.height=sz;const x=c.getContext('2d');const s=Math.min(im.naturalWidth,im.naturalHeight);
  x.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,sz,sz);return c.toDataURL('image/jpeg',.86)};
ES.card=()=>{const s=ES.get();const f=(id,label,val,ph,type='text',cls='')=>`<div class="field ${cls}"><label for="${id}">${label}</label><input class="input" id="${id}" type="${type}" value="${esc(val||'')}" placeholder="${esc(ph||'')}" autocomplete="off"></div>`;
  return`<div class="card" id="esCard"><div class="card-h"><h3>Email signature</h3><span class="muted" style="font-size:12px">Added to emails you send with Send by Gmail</span></div><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
  <div class="es-prev" id="esPrev"></div>
  <div class="es-grid">${f('esName','Full name',s.name,'Juan Dela Cruz')}${f('esTitle','Position',s.title,'IT Support')}${f('esCompany','Company',s.company,'Deltech Parking Systems and Solutions Inc.','text','full')}
  ${f('esPhone','Mobile',s.phone,'0917 123 4567','tel')}${f('esEmail','Email',s.email,'name@gmail.com','email')}${f('esWeb','Website',s.web,'deltechsystem.com')}${f('esAddr','Office address',s.address,'10 W Geonzon St, Lahug, Cebu City')}
  ${f('esTag','Tagline (optional)',s.tagline,'Keeping systems running.','text','full')}</div>
  <div class="es-photo"><span class="pv" id="esPv">${s.photo?`<img src="${esc(s.photo)}" alt="">`:esc(initials(s.name))}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><label class="btn sm" for="esFile" style="cursor:pointer">${I('upload')}Upload photo</label><input type="file" id="esFile" accept="image/*" hidden>${s.photo?`<button class="btn sm ghost" type="button" id="esNoPhoto">Remove photo</button>`:''}</div></div>
  <div class="es-opts"><label><input type="checkbox" id="esShowPhoto" ${s.showPhoto?'checked':''}> Show photo</label><label><input type="checkbox" id="esShowLogo" ${s.showLogo?'checked':''}> Show Deltech logo</label><label><input type="checkbox" id="esOn" ${s.on||!s.saved?'checked':''}> Add to my emails</label></div>
  <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn primary" type="button" id="esSave">${I('save')}Save signature</button></div></div></div>`};
ES.read=v=>({name:$('#esName',v).value.trim(),title:$('#esTitle',v).value.trim(),company:$('#esCompany',v).value.trim(),phone:$('#esPhone',v).value.trim(),email:$('#esEmail',v).value.trim(),web:$('#esWeb',v).value.trim(),
  address:$('#esAddr',v).value.trim(),tagline:$('#esTag',v).value.trim(),photo:ES._photo??ES.get().photo,showPhoto:$('#esShowPhoto',v).checked,showLogo:$('#esShowLogo',v).checked,on:$('#esOn',v).checked});
ES.bind=v=>{const card=$('#esCard',v);if(!card)return;ES._photo=undefined;const prev=()=>{$('#esPrev',v).innerHTML=ES.html(ES.read(v))};prev();
  card.addEventListener('input',prev);card.addEventListener('change',prev);
  $('#esFile',v).onchange=async e=>{const file=e.target.files[0];if(!file)return;try{ES._photo=await ES.small(file);$('#esPv',v).innerHTML=`<img src="${ES._photo}" alt="">`;$('#esShowPhoto',v).checked=true;prev()}catch(err){toast('Could not read that picture.',true)}};
  $('#esNoPhoto',v)?.addEventListener('click',()=>{ES._photo='';$('#esPv',v).textContent=initials($('#esName',v).value);prev()});
  $('#esSave',v).onclick=async()=>{const sig=ES.read(v);if(sig.email&&!GM.valid(sig.email)){toast('Check the email address.',true);return}const id=S.me.id||'me';
    try{await DB.set('profiles/'+id,{...(S.profiles[id]||{}),emailSig:sig,updated:Date.now()});S.profiles[id]={...(S.profiles[id]||{}),emailSig:sig};toast('Signature saved')}catch(e){toast(dbErr(e),true)}}};
(()=>{const oh=VIEWS.profile.html,ob=VIEWS.profile.bind;

<script>
/* ================= New reports in the exact company format =================
   Same as the company's Word reports: Legal paper, margins (top 1", left 0.75", right 0.69"),
   Deltech logo in the header at the same size and place, Arial title and fields, line under Location. */
const RP={page:{w:816,h:1344,mt:96,mb:96,ml:72,mr:66,hd:48,ft:0}};
RP.f="font-family:Arial,'Liberation Sans',Helvetica,sans-serif";
RP.p=(html,extra='')=>`<p style="margin:0;line-height:1.322;${RP.f};font-size:10pt;${extra}">${html}</p>`;
RP.gap=(pt=10)=>`<p style="margin:0;line-height:1.322;${RP.f};font-size:${pt}pt"><br></p>`;
RP.header=()=>`<div data-dx="header" data-page='${JSON.stringify(RP.page)}' style="margin:-48px 0 0 0;min-height:48px;display:flow-root"><p style="margin:0 0 0 13.3pt;line-height:1;${RP.f};font-size:12pt"><img src="${DELTECH_LOGO_PNG}" alt="Deltech Parking Systems and Solutions Inc." style="width:221px;height:64px;vertical-align:top"></p>${'<p style="margin:0;line-height:1.15;font-size:5pt"><br></p>'.repeat(4)}</div>`;
RP.head=(title,site,subject,location)=>{const n=normSite(site);
  return RP.header()+`<h1 style="margin:0;text-align:center;line-height:1.322;${RP.f};font-size:18pt;font-weight:700">${esc(title)}</h1>`+RP.gap(11)+RP.gap(9)
    +RP.p('Date of Service: '+usDate())+RP.p('Company: '+esc(SITE_COMPANY[n]||''))+RP.p('Branch: '+esc(SITE_BRANCH[n]||(site||'').toUpperCase()))
    +RP.p('Subject: '+esc(subject||''))+RP.p('Location: '+esc(location||''),'border-bottom:1.5pt solid #000;padding-bottom:1pt')+RP.gap(8)};
RP.label=t=>RP.p(`<b>${t}</b>`);
RP.list=(items,ordered)=>`<${ordered?'ol':'ul'} style="margin:0 0 0 0;padding-left:26pt;line-height:1.322;${RP.f};font-size:10pt">${items.map(i=>`<li>${i||'&nbsp;'}</li>`).join('')}</${ordered?'ol':'ul'}>`;
RP.photos=(label)=>RP.gap(8)+(label?RP.p(`<b><u>${label}</u></b>`):'')+`<table class="photo-grid" style="width:100%;border-collapse:collapse;table-layout:fixed;margin:4pt 0"><tr>${['BEFORE','AFTER'].map(t=>`<td style="border:none;padding:4px 8px 2px 0;${RP.f};font-size:9pt;vertical-align:top;width:50%">${t}</td>`).join('')}</tr><tr>${'<td data-ph="1" style="background:#F3F6F4;border-radius:6px;height:170px;padding:4px;text-align:center;vertical-align:middle;color:#8a9792;font-family:Arial,sans-serif;font-size:8.5pt">Insert photo here</td>'.repeat(2)}</tr></table>`;
RP.cell="border:none;padding:0 10px;vertical-align:bottom;text-align:center;"+RP.f+";font-size:10pt";
RP.sign=()=>RP.gap(10)+`<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr><td style="border:none;padding:0 0 22pt;${RP.f};font-size:10pt;font-weight:700">PREPARED BY:</td><td style="border:none;padding:0 0 22pt;${RP.f};font-size:10pt;font-weight:700">NOTED BY:</td></tr>
<tr><td style="${RP.cell};height:22px"><div style="border-bottom:1px solid #1F4E79;margin:0 18px;padding-bottom:2px">${esc(S.me?.name||'')}</div></td><td style="${RP.cell}"><div style="border-bottom:1px solid #1F4E79;margin:0 18px;padding-bottom:2px">&nbsp;</div></td></tr>
<tr><td style="${RP.cell};padding-top:6px;font-style:italic">Signature over Printed Name<br>(Technical Support)</td><td style="${RP.cell};padding-top:6px;font-style:italic">Signature over Printed Name<br>(Admin Officer)</td></tr></table>`;
RP.table=(head,rows)=>`<table style="width:100%;border-collapse:collapse;margin:3pt 0 8pt"><tr>${head.map(h=>`<td style="border:1px solid #000;padding:2px 5px;${RP.f};font-size:8.5pt;font-weight:700">${h}</td>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>typeof c==='object'?`<td colspan="${c.span}" style="border:1px solid #000;padding:2px 5px;${RP.f};font-size:8.5pt;text-align:center">${c.t}</td>`:`<td style="border:1px solid #000;padding:2px 5px;${RP.f};font-size:8.5pt">${c||'&nbsp;'}</td>`).join('')}</tr>`).join('')}</table>`;
/* ---- PMS report with findings tables and before/after photo pages (same layout as the company's PMS report) ---- */
RP.BLUE='#4F81BD';RP.LB='#95B3D7';
RP.pb=()=>'<hr class="pb" style="border:0;margin:0;height:0;break-after:page">';
RP.h=(t,extra='')=>RP.p(`<b>${t}</b>`,extra);
RP.task=(n,title,items)=>RP.gap(9)+RP.p(`<b>${n}. ${title}</b>`,'font-size:11pt')+`<ul style="margin:0;padding-left:44pt;line-height:1.25;${RP.f};font-size:11pt">${items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
RP.ftable=(title,last,rows)=>{const c=(t,bg,col,extra='')=>`<td style="border:1px solid #fff;padding:3px 6px 8px;background:${bg};color:${col};vertical-align:top;${RP.f};font-size:9pt;line-height:1.25;${extra}">${t||'&nbsp;'}</td>`;
  const head=['Location','Equipment / Concern','Findings',last].map((h,i)=>c(`<b>${h}</b>`,RP.BLUE,'#fff',i===0||i===2?'text-align:center':'text-align:center')).join('');
  return RP.gap(10)+RP.p(`<b>${title}</b>`,'font-size:8pt')+`<table style="width:100%;border-collapse:collapse;table-layout:fixed;margin:0"><colgroup><col style="width:17%"><col style="width:19%"><col style="width:27%"><col style="width:26%"></colgroup><tr style="height:30px">${head}</tr>`
    +rows.map((r,i)=>{const bg=i%2?'#DBE5F1':'#B8CCE4';return`<tr style="height:26px">${c(r[0],RP.BLUE,'#fff','text-align:center')}${c(r[1],bg,'#000')}${c(r[2],bg,'#000')}${c(r[3],bg,'#000')}</tr>`}).join('')+'</table>'};
RP.btitle=t=>t?RP.p(`<b>${t}</b>`,`text-align:center;color:${RP.LB};font-size:11pt;margin-top:16pt`):RP.gap(12);
RP.ph=(h,cap)=>`<td data-ph="1" style="background:#F3F6F4;border-radius:6px;height:${h}px;padding:4px;text-align:center;vertical-align:middle;color:#8a9792;${RP.f};font-size:8.5pt">${cap||'Insert photo here'}</td>`;
RP.bgrid=(title,caps,rows,h)=>{const sp=`<td style="border:none;width:4%"></td>`;
  return RP.btitle(title)+`<table class="photo-grid" style="width:100%;border-collapse:collapse;table-layout:fixed;margin:2pt 0 0"><colgroup><col style="width:48%"><col style="width:4%"><col style="width:48%"></colgroup>`
    +(caps?`<tr>${caps.map((t,i)=>(i?sp:'')+`<td style="border:none;padding:6px 0 3px;text-align:center;color:${RP.LB};${RP.f};font-size:10pt;font-weight:700">${t}</td>`).join('')}</tr>`:'')
    +Array.from({length:rows},(_,k)=>`<tr>${RP.ph(h)}${sp}${RP.ph(h)}</tr>`+(k<rows-1?`<tr><td colspan="3" style="border:none;height:10px"></td></tr>`:'')).join('')+'</table>'};
RP.cgrid=(title,n,h)=>{const sp=`<td style="border:none;width:4%"></td>`;const cap=`<td style="border:none;padding:3px 0 8px;text-align:center;${RP.f};font-size:8pt;font-weight:700;color:#3a4a5a">PHOTO CAPTION</td>`;
  let rows='';for(let k=0;k<n;k+=2)rows+=`<tr>${RP.ph(h)}${sp}${RP.ph(h)}</tr><tr>${cap}${sp}${cap}</tr>`;
  return RP.btitle(title)+`<table class="photo-grid" style="width:78%;margin:6pt auto 0;border-collapse:collapse;table-layout:fixed"><colgroup><col style="width:48%"><col style="width:4%"><col style="width:48%"></colgroup>${rows}</table>`};
RP.signx=()=>RP.gap(10)+`<table style="width:100%;border-collapse:collapse;table-layout:fixed"><tr><td style="border:none;padding:0 0 26pt;${RP.f};font-size:10pt;font-weight:700">PREPARED BY:</td><td style="border:none;padding:0 0 26pt;${RP.f};font-size:10pt;font-weight:700">NOTED BY:</td></tr>
<tr><td style="${RP.cell}"><div style="border-bottom:1px solid #1F4E79;margin:0 34px;padding-bottom:2px">${esc(S.me?.name||'')}</div></td><td style="${RP.cell}"><div style="border-bottom:1px solid #1F4E79;margin:0 34px;padding-bottom:2px">&nbsp;</div></td></tr>
<tr><td style="${RP.cell};padding-top:6px;font-style:italic">Signature over Printed Name<br>(Technical Support)</td><td style="${RP.cell};padding-top:6px;font-style:italic">Signature over Printed Name<br>(Admin Officer)</td></tr></table>`;
RP.pmsx=site=>RP.head('TECHNICAL REPORT',site,'PREVENTIVE MAINTENANCE SCHEDULE','TOWER 2, TOWER 3 PARKING AREA')
  +RP.gap(6)+RP.p('<b>PARKING MANAGEMENT SYSTEM<br>PREVENTIVE MAINTENANCE TASKS COMPLETED</b>','font-size:11pt')
  +RP.task(1,'Entry Kiosk',['Inspected the kiosk enclosure, system unit, display, wave buttons, card dispenser, and other peripherals.','Inspected the vehicle detector controller and loop coil.','Cleaned the kiosk, card dispenser sensors, and other peripherals, and tested their functionality.'])
  +RP.task(2,'Parking Barrier Gate',['Inspected the barrier arm, boom cover, and mounting bolts.','Tested the barrier opening and closing operations.','Inspected the motor, spring mechanism, and limit switches.','Tested the loop detector and IR/photocell anti-hit safety sensors.'])
  +RP.task(3,'VIP / GP Card Reader',['Cleaned the VIP/GP card reader surfaces and inspected wiring connections.','Tested card detection and access validation.','Verified communication with the Parking Management System.'])
  +RP.task(4,'Point-of-Sale (POS) System',['Cleaned the POS unit and peripherals, and tested their functionality.','Checked LAN connections and communication with the entry and exit kiosks.','Performed database backup and database shrink maintenance.'])
  +RP.task(5,'Back Office PC',['Inspected and cleaned the Back Office PC and its components.','Tested the functionality of the PC and connected peripherals.','Tested the Back Office System to verify proper operation.'])
  +RP.task(6,'Network Infrastructure',['Inspected and cleaned the network data cabinet.','Checked network cables, LAN connections, and equipment connections.','Inspected the network switch, UPS (Uninterruptible Power Supply), media converter, and exhaust fan.','Tested the functionality of network devices and connected peripherals.'])
  +RP.pb()+RP.gap(10)+RP.h('Findings and Recommendations','font-size:9pt')
  +RP.ftable('A. TOWER 2 — ENTRANCE AND EXIT','Recommended Action',[['Tower 2 – Entrance','GP60 Card Reader','',''],['Tower 2 – Entrance','Wave Button','',''],['Tower 2 – Entrance','Entrance Loop Coil','',''],['Tower 2 – Entrance','Barrier Loop Coil','',''],['Tower 2 – Exit','Barrier Mechanism','',''],['Tower 2 – Exit','UPS','','']])
  +RP.ftable('B. TOWER 3 — ENTRANCE AND EXIT','Recommended Action',[['Tower 3 – Entrance','GP60 Card Reader','',''],['Tower 3 – Exit Booth','UPS','',''],['Tower 3 – Exit Booth','Barrier Arm','','']])
  +RP.ftable('C. NETWORK INFRASTRUCTURE','Recommended Action / Status',[['Network Infrastructure','Media Converter','',''],['Tower 3 Data Cabinet','UPS','',''],['Tower 3 Data Cabinet','Exhaust Fan','','']])
  +RP.ftable('D. BACK OFFICE — POWER BACKUP','Recommended Action',[['Back Office','UPS – 650VA','','']])
  +RP.pb()+RP.bgrid('TOWER 3 ENTRANCE &amp; EXIT',['BEFORE','AFTER'],1,330)+RP.bgrid('',null,1,230)
  +RP.pb()+RP.bgrid('TOWER 2 ENTRANCE &amp; EXIT',['BEFORE','AFTER'],1,250)+RP.bgrid('',null,1,170)+RP.bgrid('TOWER 2 &amp; 3 CARD DISPENSER',['Tower 2','Tower 3'],1,230)
  +RP.pb()+RP.bgrid('TOWER 3 NETWORK CABINET',['BEFORE','AFTER'],1,160)+RP.bgrid('TOWER 2 NETWORK CABINET',['BEFORE','AFTER'],1,160)+RP.bgrid('BACKOFFICE PC',['BEFORE','AFTER'],1,200)
  +RP.pb()+RP.cgrid('TOWER 2 LOOP',4,170)
  +RP.pb()+RP.cgrid('TOWER 3 VISUAL PICTURES',4,110)+RP.cgrid('TOWER 2 VISUAL PICTURES',4,140)+RP.signx();

  nr:{label:'Network Report',cat:'NR',html:site=>RP.head('NETWORK REPORT',site,'Parking System and Equipment Support','T1 and T2 Parking Area')+RP.label('NETWORK OPERATION REPORT')

    +RP.p('<b>Status:</b> Working')+RP.p('<b>Recommendation:</b> ')+RP.sign()},
  pms:{label:'Preventive Maintenance (PMS)',cat:'PMS',html:site=>RP.head('TECHNICAL REPORT',site,'PREVENTIVE MAINTENANCE','PARKING AREA, TERMINAL')+RP.p('TASK DONE:')

    +RP.gap(6)+RP.p('<b>Status:</b> Complete')+RP.photos('GATE 1')+RP.photos('GATE 2')+RP.sign()},
  pmsx:{label:'PMS Report with Findings and Photos',cat:'PMS',html:site=>RP.pmsx(site)},
  memo:{label:'Memo',html:()=>RP.header()+`<h1 style="margin:0;text-align:center;line-height:1.322;${RP.f};font-size:18pt;font-weight:700">MEMORANDUM</h1>`+RP.gap(11)
    +RP.p('To: All staff')+RP.p('From: '+esc(S.me?.name||''))+RP.p('Date: '+usDate())+RP.p('Subject: ','border-bottom:1.5pt solid #000;padding-bottom:1pt')+RP.gap(10)+RP.p('&nbsp;')}
});
(()=>{const blank=TEMPLATES.blank;delete TEMPLATES.blank;TEMPLATES.blank=blank})();

<script>
/* ================= Save as PDF =================
   The PDF is drawn from the page itself, so it looks exactly like the editor:
   same fonts, logo, lines, photos and spacing. Pages break between lines and
   table rows (never through a line of text or a photo), and the company header
   repeats at the top of every page, like in Word. */
const PDFS={};const PX={};
PDFS.can=()=>S.mode==='local';
PX.css=()=>[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n').replace(/@import[^;]+;/g,'').replace(/@font-face\s*\{[^}]*\}/g,'');
PX.toData=async src=>{try{const b=await (await fetch(src)).blob();return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)})}catch(e){return src}};
PX.isSafari=/^((?!chrome|android|crios|fxios).)*safari/i.test(navigator.userAgent);
/* a clean copy of the page: no editing marks, empty photo boxes left blank */
PX.clean=async(paper,pg)=>{const c=paper.cloneNode(true);
  const st=c.style;st.zoom='1';st.margin='0';st.boxShadow='none';st.outline='none';st.transform='none';st.border='none';st.borderRadius='0';st.background='#fff';st.width=pg.pageW+'px';st.minHeight='0';st.height='auto';st.maxWidth='none';st.position='relative';st.left=st.top='0';

  c.querySelectorAll('td[data-ph]').forEach(td=>{if(!td.querySelector('img')){td.innerHTML='&nbsp;';td.style.background='none';td.style.color='transparent'}});
  c.querySelectorAll('script,.ph-hint,[data-noprint]').forEach(e=>e.remove());
  await Promise.all([...c.querySelectorAll('img')].map(async im=>{const s=im.getAttribute('src')||'';if(s&&!s.startsWith('data:'))im.setAttribute('src',await PX.toData(im.src))}));
  return c};
/* lay the copy out at real page width in a hidden frame (the same width the PDF is drawn at) */
PX.frame=async(html,css,w)=>{const fr=document.createElement('iframe');fr.setAttribute('aria-hidden','true');fr.tabIndex=-1;fr.style.cssText=`position:fixed;left:-${w+400}px;top:0;width:${w}px;height:1200px;border:0;visibility:hidden;pointer-events:none`;document.body.appendChild(fr);
  const d=fr.contentDocument;d.open();d.write(`<!doctype html><html data-theme="light"><head><meta charset="utf-8"><style>${css}</style></head><body>${html}</body></html>`);d.close();
  const b=d.body;for(const [k,v] of Object.entries({margin:'0',padding:'0',display:'block',background:'#fff',overflow:'visible',height:'auto','min-height':'0',width:w+'px'}))b.style.setProperty(k,v,'important');

/* where the page can break: never through a text line, a picture, a short table row or a heading + its next line */
PX.layout=(p,pg)=>{const o=p.getBoundingClientRect().top;const iv=[];const add=(r,pad=0)=>{if(r.height>0.5&&r.width>0.5)iv.push([r.top-o-pad,r.bottom-o+pad])};
  const hd=p.querySelector(':scope > [data-dx="header"]'),ft=p.querySelector(':scope > [data-dx="footer"]');
  const padT=pg.pad[0],padB=pg.pad[2];const bodyStart=hd?hd.getBoundingClientRect().bottom-o:padT;
  const inHF=n=>(hd&&hd.contains(n))||(ft&&ft.contains(n));

  const ftH=ft?ft.getBoundingClientRect().height:0;const bottom=Math.min(pg.pageH-padB,ft?pg.pageH-Math.max(24,padB/2)-ftH-8:1e9);const avail=bottom-bodyStart;

  const hasPic=el=>!!(el&&el.querySelector('img,td[data-ph]'));const keep=(a,b)=>{if(b-a<avail*0.85)iv.push([a-o,b-o])};
  p.querySelectorAll('tr').forEach(tr=>{if(inHF(tr)||hasPic(tr))return;const n=tr.nextElementSibling;if(n&&hasPic(n))keep(tr.getBoundingClientRect().top,n.getBoundingClientRect().bottom)});

/* draw one horizontal band of the page into a canvas through the browser's own renderer */
PX.band=async(ctx,xml,w,y0,y1,dy,scale,hideFooter)=>{const h=Math.max(1,Math.ceil(y1-y0));
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" data-theme="light" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="font-size:16px"><foreignObject x="0" y="0" width="${w}" height="${h}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;height:${h}px;overflow:hidden;background:#fff"><div style="position:relative;top:${-y0}px;width:${w}px">${xml}</div></div></foreignObject></svg>`;

  if(PX.isSafari){ctx.drawImage(img,0,dy*scale,w*scale,h*scale);await new Promise(r=>setTimeout(r,120))}
  ctx.drawImage(img,0,dy*scale,w*scale,h*scale)};
PX.make=async(paper,title,onStep)=>{const pg=DW.page();const W=Math.round(pg.pageW),H=Math.round(pg.pageH);
  const c=await PX.clean(paper,pg);const css=PX.css();

  const fr=await PX.frame(wrap,css,W);
  try{const fp=fr.contentDocument.getElementById('paper')||fr.contentDocument.querySelector('.paper');
    const L=PX.layout(fp,pg);
    const ft=fp.querySelector(':scope > [data-dx="footer"]');

    const xs=new XMLSerializer();const docEl=fr.contentDocument.body.firstElementChild;
    const xmlBody=`<style>${css.replace(/[<&]/g,m=>m==='<'?'\\3c ':'&amp;')}</style>`+xs.serializeToString(docEl);

    const pdf=await PDFLib.PDFDocument.create();pdf.setTitle(title);pdf.setProducer('File Org');pdf.setCreator('File Org · Deltech Parking Systems and Solutions Inc.');
    const scale=Math.min(2,Math.max(1.5,Math.floor(4000000/(W*H)*10)/10||2));
    const cv=document.createElement('canvas');cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);const ctx=cv.getContext('2d');

/* the browser's print window, for anyone who prefers it */

async function saveAsPdf(){const paper=$('#paper');if(!paper)return;const f=W.fileId?fileById(W.fileId):null;const base=($('#edName-doc')?.value||'document').replace(/\.\w+$/,'')||'document';

{const _fm=fileMenu;fileMenu=function(f,x,y){const _om=openMenu;openMenu=function(x2,y2,items){openMenu=_om;if(PDFS.can()&&OFFICE_EXT.includes(String(f.ext||'').toLowerCase())){const i=items.findIndex(it=>it&&it.label==='Download');items.splice(i<0?items.length-2:i,0,{label:'Save as PDF',icon:'pdf',run:()=>fileToPdf(f)})}return _om(x2,y2,items)};try{return _fm.apply(this,arguments)}finally{openMenu=_om}}}

/* ================= Share to Viber, Messenger, Facebook and other apps =================

const SHR={icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>'};
SHR.can=file=>{try{return !!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){return false}};
SHR.ready=async(blob,name,type)=>{const file=new File([blob],name,{type:type||blob.type||'application/octet-stream'});const can=SHR.can(file);

    actions:[{label:'Download',cls:'ghost',value:()=>'dl'},...(can?[{label:'Share…',cls:'primary',value:()=>'share'}]:[])]});
  if(r==='dl'){await saveDownload(name,blob);return}

{const _s=showImgBar,_h=hideImgBar;showImgBar=function(img){const r=_s.apply(this,arguments);if(img&&img.closest&&img.closest('#paper'))IF.show(img);

{const _imp=importXlsxStyled;importXlsxStyled=async function(buf){const book=await _imp.apply(this,arguments);try{const wb=new ExcelJS.Workbook();await wb.xlsx.load(buf);let i=0;

const XR={};

  Object.entries(sh.cells).forEach(([k,c])=>{if(c.v===''&&!c.f&&!c.s?.bg&&!c.s?.bd)return;const p=parseRef(k);r1=Math.max(r1,p.r);c1=Math.max(c1,p.c)});(sh.merges||[]).forEach(m=>{const B=parseRef(m.split(':')[1]||m);if(B){r1=Math.max(r1,B.r);c1=Math.max(c1,B.c)}});return{c0:0,r0:0,c1,r1}};
XR.table=sh=>{const R=XR.range(sh),vals=evalSheet(sh),mi=mergeInfo(sh),dw=sh.defW||100;const grid=!!sh.page?.showGrid;const FF="Calibri,Carlito,'Segoe UI',Arial,sans-serif";
  const ws=[];for(let c=R.c0;c<=R.c1;c++)ws.push(sh.colW?.[c]||dw);const tw=ws.reduce((a,b)=>a+b,0);const hs=[];
  let h=`<table style="border-collapse:collapse;table-layout:fixed;width:${tw}px;font-family:${FF};font-size:11pt;color:#000"><colgroup>${ws.map(w=>`<col style="width:${w}px">`).join('')}</colgroup>`;
  for(let r=R.r0;r<=R.r1;r++){const rh=sh.rowH?.[r]||20;hs.push(rh);h+=`<tr style="height:${rh}px">`;
    for(let c=R.c0;c<=R.c1;c++){const k=refKey(c,r);if(mi.cover.has(k))continue;const sp=mi.anchor[k];const cell=sh.cells[k];const st=cell?.s||{};const v=vals[k];
      const bd=x=>st.bd&&st.bd[x]?`${st.bd[x][0]}px solid ${st.bd[x][1]}`:(grid?'1px solid #D9D9D9':'none');
      const css=`border-top:${bd('t')};border-right:${bd('r')};border-bottom:${bd('b')};border-left:${bd('l')};padding:0 4px;overflow:hidden;`+(st.wrap?'white-space:pre-wrap;word-wrap:break-word;':'white-space:nowrap;')
        +(st.b?'font-weight:700;':'')+(st.i?'font-style:italic;':'')+(st.u?'text-decoration:underline;':'')+(st.c?`color:${st.c};`:'')+(st.bg?`background:${st.bg};`:'')+`text-align:${st.al||(isNum(v)?'right':'left')};`+`vertical-align:${st.va||'bottom'};`+(st.fs?`font-size:${st.fs}pt;`:'')+(st.ff?`font-family:'${String(st.ff).replace(/'/g,'')}',${FF};`:'')+'line-height:1.2';

XR.pages=(sh,scale0)=>{const p=sh.page||{orientation:'portrait',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0};const sz=XR.paper[p.paperSize]||XR.paper[9];const land=p.orientation==='landscape';
  const PW=Math.round((land?sz[1]:sz[0])*96),PH=Math.round((land?sz[0]:sz[1])*96);const m=p.margins||{left:.5,right:.5,top:.6,bottom:.6};const ml=m.left*96,mr=m.right*96,mt=m.top*96,mb=m.bottom*96;

  const pages=[];let y=0,start=0,acc=0;T.rows.forEach((h,i)=>{if((acc+h)*k>ah&&acc>0){pages.push([start,i,y]);y+=acc;start=i;acc=0}acc+=h});pages.push([start,T.rows.length,y]);

XR.draw=async(pg,scale)=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${pg.PW}" height="${pg.PH}"><foreignObject x="0" y="0" width="${pg.PW}" height="${pg.PH}"><div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:${pg.PW}px;height:${pg.PH}px;background:#fff">%%BODY%%</div></foreignObject></svg>`;

XR.pdf=async(sheets,title)=>{if(!window.PDFLib)await loadScript(LIB.pdflib);const pdf=await PDFLib.PDFDocument.create();pdf.setTitle(title);pdf.setProducer('File Org');

<script>
/* ================= PDF editor ================= */

  dirtyReset(){P.mountedFor=undefined},refresh(){},leave(){},
  empty(){P.srcs=[];P.pages=[];$('#pPages').innerHTML=`<div class="empty" style="margin-top:40px">${I('pdf')}<b>No PDF open</b><span>Add text, sign, highlight, white-out, rotate, reorder and merge pages.</span><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" onclick="document.getElementById('pOpen').click()">${I('upload')}Open from computer</button><a class="btn" href="#files">${I('folder')}Choose from library</a></div></div>`;$('#pThumbs').innerHTML=''},
  async load(bytes,replace){

  async pageCanvas(p,scale){const c=document.createElement('canvas');const r=(p.orig+p.rot)%360;const sw=(r%180?p.H:p.W),sh=(r%180?p.W:p.H);const dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(sw*scale*dpr);c.height=Math.round(sh*scale*dpr);c.style.width=sw*scale+'px';c.style.height=sh*scale+'px';const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);

  async renderAll(){const box=$('#pPages'),th=$('#pThumbs');if(!box)return;box.innerHTML='';th.innerHTML='';const token=P.rt=Math.random();

      const c=await this.pageCanvas(p,P.scale);if(token!==P.rt)return;wrap.style.width=c.style.width;wrap.style.height=c.style.height;wrap.appendChild(c);const ov=document.createElement('div');ov.className='ov';wrap.appendChild(ov);this.drawAnns(i);

  markCur(){$$('.thumb').forEach(t=>t.classList.toggle('on',+t.dataset.i===P.cur));$('#pPageNo').textContent=P.pages.length?`Page ${P.cur+1} of ${P.pages.length}`:''},

    p.anns.forEach((a,ai)=>{const el=document.createElement('div');el.className='ann '+a.t+(P.sel&&P.sel.i===i&&P.sel.ai===ai?' sel':'');el.dataset.ai=ai;
