<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0F1A16"><link rel="icon" href="/icons/logo.svg" type="image/svg+xml"><link rel="icon" href="/icons/icon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="File Org"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="/config.js"></script><title>File Org</title></head><body><title>File Org</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed field-ledger sidebar + working canvas; content in quiet panels, the filename code is the hero detail */
:root{
  --bg:#F3F5F3; --panel:#FFFFFF; --panel-2:#F8FAF8; --sunk:#E9EDEA;
  --ink:#121A17; --ink-2:#46524D; --ink-3:#7A8681; --line:#DCE2DE; --line-2:#C9D2CD;
  --accent:#1C5B49; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4; --brass:#9C7A33; --brass-soft:#F2E9D3;
  --tr:#B24A2E; --tr-soft:#F6E1DA; --pms:#1F6E8C; --pms-soft:#DCEBF2; --oth:#5D6A64; --oth-soft:#E6EBE8;
  --ok:#2F7D4F; --warn:#B07A12; --bad:#B23A3A;
  --side:#0F1A16; --side-ink:#C7D3CD; --side-ink-2:#7F918A; --side-hi:#1A2924;
  --shadow:0 1px 2px rgba(18,26,23,.05),0 8px 24px -12px rgba(18,26,23,.14);
  --shadow-lg:0 24px 60px -20px rgba(18,26,23,.35);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1110; --panel:#121A17; --panel-2:#16201C; --sunk:#0E1513;
  --ink:#E6ECE9; --ink-2:#A9B6B0; --ink-3:#73817B; --line:#24302B; --line-2:#2F3D37;
  --accent:#5DB592; --accent-ink:#06120D; --accent-soft:#163128; --brass:#D4B26A; --brass-soft:#2C2616;
  --tr:#E6876B; --tr-soft:#3A1F17; --pms:#6BB7D6; --pms-soft:#132C37; --oth:#9BA9A2; --oth-soft:#1D2724;
  --ok:#6CC18F; --warn:#E0B356; --bad:#E57A7A;
  --side:#080D0B; --side-ink:#C7D3CD; --side-ink-2:#6E7F78; --side-hi:#14201C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1110; --panel:#121A17; --panel-2:#16201C; --sunk:#0E1513;
  --ink:#E6ECE9; --ink-2:#A9B6B0; --ink-3:#73817B; --line:#24302B; --line-2:#2F3D37;
  --accent:#5DB592; --accent-ink:#06120D; --accent-soft:#163128; --brass:#D4B26A; --brass-soft:#2C2616;
  --tr:#E6876B; --tr-soft:#3A1F17; --pms:#6BB7D6; --pms-soft:#132C37; --oth:#9BA9A2; --oth-soft:#1D2724;
  --ok:#6CC18F; --warn:#E0B356; --bad:#E57A7A;
  --side:#080D0B; --side-ink:#C7D3CD; --side-ink-2:#6E7F78; --side-hi:#14201C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
svg[aria-hidden]{width:18px;height:18px;flex:none;display:block}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:6px;overflow-y:auto;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
.brand-mark svg{display:block;width:32px;height:32px}
.install-btn{display:flex;align-items:center;gap:8px;margin:6px 8px 0;padding:8px 10px;border-radius:8px;border:1px solid #24453A;background:#13241F;color:#CFE6DB;font-size:12.5px;font-weight:500;cursor:pointer}
.install-btn:hover{background:#1A3029;color:#fff}
.install-btn svg{width:15px;height:15px}
.dest{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.dest-l{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);font-weight:500}
.dest-l svg{width:15px;height:15px;color:var(--accent)}
.dest .select{flex:1;min-width:200px;width:auto;max-width:520px;font-family:var(--f-mono);font-size:12.5px}
.dest-path{font-size:11.5px;color:var(--ink-3);margin-top:6px;word-break:break-all}
.dest-path b{color:var(--ink-2);font-weight:500}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:600;color:#F1F5F3;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--side-ink-2);letter-spacing:.08em;text-transform:uppercase;margin-top:-2px}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--side-ink-2);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:13.5px;position:relative}
.nav a:hover{background:var(--side-hi);color:#fff}
.nav a.on{background:var(--side-hi);color:#fff}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#5DB592}
.nav svg{width:17px;height:17px;flex:none;opacity:.85}
.nav .count{margin-left:auto;font-size:11px;color:var(--side-ink-2);font-family:var(--f-mono)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid #1E2C27;display:flex;align-items:center;gap:10px}
.side-foot .who{min-width:0}
.side-foot .who b{display:block;font-weight:500;color:#EEF3F0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .who span{font-size:11.5px;color:var(--side-ink-2)}
/* main */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.menu-btn{display:none}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:0 10px;height:38px}
.search svg{width:16px;height:16px;color:var(--ink-3)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.search kbd{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.presence{display:flex;align-items:center}
.presence .av{margin-left:-6px;border:2px solid var(--panel)}
.view{flex:1;overflow:auto;padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.view.enter>*{animation:vin .28s ease-out both}
@keyframes vin{from{opacity:.001;transform:translateY(4px)}}
.view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{font-size:28px;line-height:1.15}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px;font-weight:500}
.sub{color:var(--ink-2);margin:6px 0 0;max-width:62ch}
/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
a.btn,a.btn:visited{text-decoration:none;color:var(--ink)}a.btn.primary,a.btn.primary:visited{color:var(--accent-ink)}
.btn svg{flex:none}
.btn:hover{background:var(--panel-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn.danger{color:var(--bad)}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.mode-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--side-ink-2);padding:6px 10px;margin:4px 8px 0;border:1px solid #1E2C27;border-radius:8px}
.mode-chip i{width:7px;height:7px;border-radius:50%;background:#5DB592;box-shadow:0 0 0 3px rgba(93,181,146,.18)}
.mode-chip.off i{background:#E0B356;box-shadow:0 0 0 3px rgba(224,179,86,.18)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.chip.tr{background:var(--tr-soft);color:var(--tr)}
.chip.pms{background:var(--pms-soft);color:var(--pms)}
.chip.oth{background:var(--oth-soft);color:var(--oth)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.brass{background:var(--brass-soft);color:var(--brass)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#fff;flex:none;overflow:hidden;background:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:72px;height:72px;font-size:24px}
.input,.select,textarea.input{width:100%;height:38px;border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:0 11px;outline:none}
textarea.input{height:auto;padding:9px 11px;resize:vertical}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.muted{color:var(--ink-3)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 16px;color:var(--ink-2)}
.empty>svg{width:40px;height:40px;color:var(--ink-3)}
.empty .btn{margin-top:6px}.empty .btn svg{width:16px;height:16px;flex:none}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:16px;font-weight:600}
.banner{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;background:var(--brass-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--brass) 30%,transparent);margin-bottom:18px;font-size:13px}
.banner svg{width:18px;height:18px;color:var(--brass);flex:none}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--panel-2)}
.fname{display:flex;align-items:center;gap:10px;min-width:0}
.fname .code{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
.ficon{width:32px;height:38px;border-radius:5px;flex:none;display:grid;place-items:end center;padding-bottom:5px;font-family:var(--f-mono);font-size:8.5px;font-weight:500;color:#fff;position:relative;letter-spacing:.04em}
.ficon::after{content:"";position:absolute;top:0;right:0;width:9px;height:9px;background:linear-gradient(225deg,var(--bg) 50%,rgba(255,255,255,.35) 50%);border-radius:0 5px 0 2px}
.ficon.pdf{background:#B5413A}.ficon.doc{background:#2D5DA8}.ficon.xls{background:#2B7A4B}.ficon.img{background:#7C5BA6}.ficon.oth{background:#6B7570}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* toast & modal */
.toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow-lg);font-size:13px;max-width:360px;animation:tin .25s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:.4}}
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:min(520px,100%);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal .mh{padding:18px 20px 6px}.modal .mh h3{font-size:18px}
.modal .mb{padding:10px 20px 6px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.menu{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:190px}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu button svg{width:15px;height:15px;color:var(--ink-3)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
/* chat dock */
.dock{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60}
.dock-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-lg);cursor:pointer;display:grid;place-items:center;position:relative}
.dock-btn svg{width:22px;height:22px}
.dock-badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--tr);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.dock-panel{position:absolute;right:0;bottom:64px;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 120px));display:flex;flex-direction:column;overflow:hidden}
/* chat */
.chat{display:flex;flex-direction:column;min-height:0;flex:1}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-head h3{font-size:15px}
.chat-list{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:5px 6px;border-radius:8px}
.msg:hover{background:var(--panel-2)}
.msg .body{min-width:0;flex:1}
.msg .meta{display:flex;gap:8px;align-items:baseline}
.msg .meta b{font-weight:600;font-size:13px}
.msg .meta span{font-size:11px;color:var(--ink-3)}
.msg .text{white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.msg.cont{padding-top:0}.msg.cont .av{visibility:hidden;height:0}
.msg .att{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:6px 10px 6px 6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;max-width:100%}
.msg .att .ficon{width:24px;height:30px;font-size:7px}
.day-sep{text-align:center;font-size:11px;color:var(--ink-3);margin:12px 0 6px;letter-spacing:.06em;text-transform:uppercase}
.chat-input{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;min-height:38px;max-height:120px;resize:none}
.typing{font-size:11.5px;color:var(--ink-3);padding:0 16px 6px;min-height:18px}
.channels{display:flex;flex-direction:column;gap:2px}
.channels button{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;background:none;border-radius:7px;text-align:left;cursor:pointer;color:var(--ink-2)}
.channels button:hover{background:var(--panel-2)}
.channels button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
/* upload */
.drop{border:1.5px dashed var(--line-2);border-radius:14px;padding:36px 20px;text-align:center;background:var(--panel);transition:border-color .2s,background .2s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:36px;height:36px;color:var(--accent)}
.drop h3{font-size:18px;margin-top:10px}
.rule-line{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.rule-line code{font-family:var(--f-mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.uitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:16px}
.uitem + .uitem{border-top:1px solid var(--line)}
.proposed{font-family:var(--f-mono);font-size:14px;font-weight:500;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;word-break:break-all;display:flex;align-items:center;gap:8px}
.proposed .seg-tr{color:var(--tr)}.proposed .seg-pms{color:var(--pms)}
.ufields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.conf{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;width:90px}
.conf i{display:block;height:100%;background:var(--accent)}
.spinner{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* organizer */
.org{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.tree{padding:8px}
.tree button{display:flex;align-items:center;gap:7px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13px}
.tree button:hover{background:var(--panel-2)}
.tree button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tree button svg{width:15px;height:15px;flex:none}
.tree button .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:0 11px;height:34px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--sunk);color:var(--ink);font-weight:500}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.crumbs button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2)}
.crumbs button:hover{color:var(--accent)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ftile{padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
.ftile:hover{border-color:var(--accent);transform:translateY(-1px)}
.ftile .code{font-family:var(--f-mono);font-size:12px;word-break:break-all;line-height:1.4}
.ftile .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.star{color:var(--brass)}
/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .stack{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;background:var(--sunk)}
.bars .stack i{display:block}
.bars small{font-size:11px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:5px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.act:last-child{border-bottom:0}
.act .t{color:var(--ink-3);font-size:11.5px;white-space:nowrap;margin-left:auto}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .15s,box-shadow .15s}
.quick button:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.quick button{transition:border-color .15s,box-shadow .15s,transform .15s}
.quick .qi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.quick .qi svg{width:18px;height:18px}
.qi svg{width:18px;height:18px}
.sites-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.sites-sum .card{padding:14px 16px;display:flex;align-items:center;gap:12px}
.sites-sum b{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1}
.sites-sum span{font-size:12px;color:var(--ink-2)}
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.site-card{display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .2s,transform .2s;overflow:hidden}
.site-card:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:0 1px 2px rgba(18,26,23,.05),0 16px 32px -18px rgba(18,26,23,.35);transform:translateY(-2px)}
.site-top{display:flex;align-items:center;gap:12px;padding:16px 14px 12px 16px}
.site-pin{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.site-pin svg{width:20px;height:20px}
.site-name{min-width:0;flex:1}
.site-name b{display:block;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-name span{font-size:12px;color:var(--ink-3)}
.site-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:0 16px 12px;gap:4px}
.site-stats div{display:flex;flex-direction:column;gap:2px}
.site-stats b{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.site-stats b.z{color:var(--ink-3);font-weight:500}
.site-stats span{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.site-bar{display:flex;height:4px;margin:0 16px;border-radius:2px;overflow:hidden;background:var(--sunk);gap:2px}
.site-bar i{display:block;height:100%}
.site-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 12px 16px;margin-top:12px;border-top:1px solid var(--line);background:var(--panel-2)}
.site-foot .path{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.site-card.unassigned{border-style:dashed}
.site-card.unassigned .site-pin{background:var(--brass-soft);color:var(--brass)}
.site-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:190px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:transparent;color:var(--ink-2);cursor:pointer;font-weight:500;transition:border-color .15s,color .15s,background .15s}
.site-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.site-add svg{width:22px;height:22px}
.quick b{font-weight:600;font-size:14px}
.quick span{font-size:12px;color:var(--ink-3)}
.hello{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 24px;margin-bottom:18px;background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),var(--panel)}
.hello h1{font-size:26px}
/* editors shared */
.ed-bar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ed-title input{border:1px solid transparent;background:none;font-family:var(--f-mono);font-size:13.5px;font-weight:500;padding:5px 8px;border-radius:6px;min-width:0;width:100%;max-width:420px}
.ed-title input:hover{border-color:var(--line)}
.ed-title input:focus{border-color:var(--accent);outline:none}
.save-state{font-size:12px;color:var(--ink-3);white-space:nowrap}
.ribbon{display:flex;align-items:center;gap:4px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel-2);overflow-x:auto;flex-wrap:nowrap}
.ribbon .grp{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid var(--line);flex:none}
.ribbon .grp:last-child{border-right:0}
.rb{height:30px;min-width:30px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12.5px;color:var(--ink)}
.rb:hover{background:var(--sunk)}
.rb.on{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.rb svg{width:16px;height:16px}
.ribbon select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 6px;font-size:12.5px}
.ribbon input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.clr{position:relative;display:inline-flex;align-items:center}
.clr input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ed-body{flex:1;overflow:auto;background:var(--sunk);min-height:0}
.ed-status{display:flex;gap:16px;align-items:center;padding:6px 16px;border-top:1px solid var(--line);background:var(--panel);font-size:11.5px;color:var(--ink-3)}
/* word */
.paper{background:#fff;color:#1b1b1b;width:816px;flex:none;min-height:1056px;margin:28px auto;padding:96px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 32px -12px rgba(0,0,0,.25);outline:none;font-family:Calibri,"Carlito","Geist",sans-serif;font-size:11pt;line-height:1.5;color-scheme:light}
.paper.landscape{width:1056px;min-height:816px}
.paper.narrow{padding:48px}.paper.wide{padding:144px}
.paper h1{font-family:inherit;font-size:20pt;font-weight:700;margin:0 0 10px}
.paper h2{font-family:inherit;font-size:15pt;font-weight:700;margin:16px 0 6px;color:#1F3864}
.paper h3{font-family:inherit;font-size:12.5pt;font-weight:700;margin:12px 0 4px}
.paper p{margin:0 0 8px}
.paper table{border-collapse:collapse;width:100%;margin:8px 0}
.paper td,.paper th{border:1px solid #9aa3a0;padding:5px 8px;vertical-align:top;min-width:40px}
.paper th{background:#eef2f0}
.paper img{max-width:100%}
.paper blockquote{border-left:3px solid #c9d2cd;margin:8px 0;padding:2px 12px;color:#444}
.paper hr.pb{border:0;border-top:2px dashed #c9d2cd;margin:24px -40px;position:relative}
.find-bar{display:flex;gap:6px;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.find-bar .input{height:32px;width:180px}
/* excel */
.fx{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.fx .ref{width:72px;height:30px;font-family:var(--f-mono);font-size:12.5px;text-align:center}
.fx .fxl{font-family:var(--f-mono);color:var(--ink-3);font-style:italic;font-size:13px}
.fx input.formula{flex:1;height:30px;font-family:var(--f-mono);font-size:12.5px}
.sheet-wrap{flex:1;overflow:auto;background:var(--panel);min-height:0;position:relative}
table.sheet{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.sheet th{position:sticky;background:var(--panel-2);color:var(--ink-3);font-weight:500;font-size:11.5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;user-select:none;z-index:2}
.sheet thead th{top:0}
.sheet tbody th{left:0;width:46px;z-index:1}
.sheet thead th.corner{left:0;z-index:3}
.sheet th.sel{background:var(--accent-soft);color:var(--accent)}
.sheet td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:cell;background:var(--panel)}
.sheet td.in{background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.sheet td.act{outline:2px solid var(--accent);outline-offset:-2px}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.err{color:var(--bad)}
.sheet td input.cell-ed{width:100%;height:100%;border:0;outline:none;background:transparent;font:inherit;padding:0}
.col-rs{position:absolute;right:-3px;top:0;bottom:0;width:6px;cursor:col-resize}
.tabs{display:flex;align-items:center;gap:2px;padding:4px 10px;border-top:1px solid var(--line);background:var(--panel-2);overflow-x:auto}
.tabs button.t{border:0;background:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.tabs button.t.on{background:var(--panel);color:var(--accent);font-weight:600;box-shadow:var(--shadow)}
/* pdf */
.pdf-layout{flex:1;display:grid;grid-template-columns:170px minmax(0,1fr);min-height:0}
.thumbs{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:12px}
.thumb{cursor:pointer;border:2px solid transparent;border-radius:6px;padding:4px;text-align:center;font-size:11px;color:var(--ink-3)}
.thumb.on{border-color:var(--accent)}
.thumb canvas{width:100%;box-shadow:0 1px 4px rgba(0,0,0,.2);background:#fff;display:block;margin-bottom:4px}
.pages{overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:20px;background:var(--sunk)}
.pg{position:relative;box-shadow:0 2px 8px rgba(0,0,0,.18),0 18px 40px -20px rgba(0,0,0,.35);background:#fff;flex:none}
.pg canvas{display:block}
.pg .ov{position:absolute;inset:0}
.ann{position:absolute}
.ann.text{min-width:20px;padding:1px 2px;white-space:pre;line-height:1.2;outline:1px dashed transparent}
.ann.text:focus,.ann.sel{outline:1px dashed #1C5B49}
.ann.rect{border:2px solid}
.ann.hl{mix-blend-mode:multiply;opacity:.45}
.ann.wo{background:#fff}
.ann.img img{width:100%;height:100%;display:block}
.ann.sel{outline:2px solid #1C5B49;outline-offset:1px}
.ann .del{position:absolute;top:-11px;right:-11px;width:20px;height:20px;border-radius:50%;background:#B23A3A;color:#fff;border:0;font-size:12px;cursor:pointer;display:none;line-height:20px;padding:0}
.ann.sel .del{display:block}
.sigpad{width:100%;height:160px;border:1px solid var(--line-2);border-radius:8px;background:#fff;touch-action:none}
/* organizer v2 */
.org{grid-template-columns:260px minmax(0,1fr)}
.tree2{position:sticky;top:0;max-height:calc(100vh - 150px);display:flex;flex-direction:column;overflow:hidden}
.tree-h{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px 14px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;border-bottom:1px solid var(--line)}
.tree-h .btn{height:24px;padding:0 6px;font-size:11px;text-transform:none;letter-spacing:0}
.tree-b{overflow-y:auto;padding:6px}
.trow{display:flex;align-items:center;gap:2px;padding-left:calc(var(--d,0) * 14px);border-radius:7px}
.tnode .tnode .trow{--pad:1}
.tchev,.tchev-sp{width:22px;height:26px;flex:none}
.tchev{border:0;background:none;border-radius:5px;cursor:pointer;color:var(--ink-3);display:grid;place-items:center;transition:transform .15s}
.tchev svg{width:14px;height:14px;transform:rotate(-90deg);transition:transform .15s}
.tchev.open svg{transform:none}
.tchev:hover{background:var(--sunk);color:var(--ink)}
.tlabel{flex:1;min-width:0;display:flex;align-items:center;gap:7px;border:0;background:none;padding:5px 8px 5px 4px;border-radius:7px;cursor:pointer;text-align:left;color:var(--ink-2);font-size:13px}
.tlabel svg{width:15px;height:15px;color:var(--ink-3)}
.tlabel .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlabel .c{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.trow:hover{background:var(--panel-2)}
.trow.on{background:var(--accent-soft)}.trow.on .tlabel{color:var(--accent);font-weight:600}.trow.on .tlabel svg{color:var(--accent)}
.org-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.org-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.org-body .tbl-wrap{border:1px solid var(--line);border-radius:9px}
.crumbs .sep{color:var(--line-2)}
.crumbs [aria-current]{color:var(--ink);font-weight:600}
.sec-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;margin-top:6px}
.sec-h .muted{letter-spacing:0;margin-left:4px}
.fgrid.folders{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.folder-tile{text-align:left;border:1px solid var(--line);background:var(--panel);font:inherit;color:inherit;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:12px;row-gap:2px;align-items:center}
.fold-ic{grid-row:1/3;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.fold-ic.site{background:var(--accent-soft);color:var(--accent)}
.fold-ic svg{width:19px;height:19px}
.fold-n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-m{font-size:12px;color:var(--ink-3)}
.fold-chips{grid-column:1/-1;display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.grp-h{display:flex;align-items:center;gap:8px;margin-top:8px;padding:2px 2px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.grp-h svg{width:15px;height:15px;color:var(--accent)}
.grp-h:hover .mono{color:var(--accent);text-decoration:underline}
.res-note{font-size:13px;color:var(--ink-2)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.ftile .code{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all;min-height:3.6em}
.dup-group{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dup-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dup-h .mono{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.dup-list{display:flex;flex-direction:column;gap:12px}
.dup-warn{display:flex;gap:8px;align-items:flex-start;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--brass-soft);font-size:12.5px}
.dup-warn svg{width:16px;height:16px;color:var(--brass);flex:none;margin-top:1px}
.dup-warn a{color:var(--accent);word-break:break-all}
.clean-opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13px}
.clean-opt input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
@media (max-width:860px){.tree2{position:static;max-height:300px}}
/* photo grid */
.paper table.photo-grid{margin:6px 0}
.paper table.photo-grid td{border:1px dashed transparent!important;padding:4px}
.paper table.photo-grid:hover td{border-color:#d4dcd8!important}
.paper table.photo-grid img{width:100%;height:auto;display:block}
/* signatures + offline */
.checker{background-color:#fff;background-image:conic-gradient(#ececec 25%,#fff 0 50%,#ececec 0 75%,#fff 0);background-size:16px 16px;border:1px solid var(--line);border-radius:10px}
#sgPad{width:100%;height:auto;aspect-ratio:3/1;touch-action:none;cursor:crosshair}
.sig-show{height:110px;display:grid;place-items:center;padding:10px}.sig-show img{max-height:90px;max-width:100%}
.sg-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.ink{width:24px;height:24px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line-2);cursor:pointer;padding:0}.ink.on{box-shadow:0 0 0 2px var(--accent)}
.sg-prev{min-height:150px;display:grid;place-items:center;padding:8px;text-align:center}.sg-prev img{max-height:140px;max-width:100%}
.img-bar{position:fixed;z-index:65;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);font-size:12px;color:var(--ink-2)}
.paper img.img-sel{outline:2px solid #1C5B49;outline-offset:2px}
.sg-modal{width:min(1100px,100%);height:92vh;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.sg-hint{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--line)}.sg-hint svg{width:15px;height:15px;color:var(--accent)}
.sg-page{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 32px -12px rgba(0,0,0,.3);cursor:copy;flex:none}
.sg-box{position:absolute;cursor:move;outline:1.5px dashed #1C5B49;outline-offset:3px;touch-action:none;background:rgba(28,91,73,.04)}
.sg-box img{width:100%;height:100%;display:block;pointer-events:none}
.sg-rs{position:absolute;right:-9px;bottom:-9px;width:18px;height:18px;border-radius:50%;background:#1C5B49;border:2px solid #fff;cursor:nwse-resize;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.ann .rs{display:none;position:absolute;right:-8px;bottom:-8px;width:15px;height:15px;border-radius:50%;background:#1C5B49;border:2px solid #fff;cursor:nwse-resize;touch-action:none}.ann.sel .rs{display:block}
.off-banner{background:color-mix(in srgb,var(--warn) 16%,var(--panel));border-color:color-mix(in srgb,var(--warn) 40%,transparent)}.off-banner svg{color:var(--warn)}
/* naming v2 */
.chip.dr{background:var(--brass-soft);color:var(--brass)}
.chip.nr{background:var(--accent-soft);color:var(--accent)}
.proposed .seg-dr{color:var(--brass)}.proposed .seg-nr{color:var(--accent)}
.site-code{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;vertical-align:middle;letter-spacing:.02em}
.code-row{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
.code-row .input{height:32px;text-transform:uppercase}
.ai-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--accent-soft);font-size:13px}
.ai-note svg{width:17px;height:17px;color:var(--accent);flex:none;margin-top:1px}
.tpl-pick{text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;font:inherit;color:inherit}
.tpl-pick b{font-size:13.5px}
.tpl-pick:hover{border-color:var(--accent)}
.away-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
/* exact preview */
.pv-pages{display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px}
.pv-page{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 32px -12px rgba(0,0,0,.3);max-width:100%;height:auto!important}
.pv-modal{width:min(1040px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.pv-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pv-h b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.pv-b{overflow:auto;background:var(--sunk);flex:1;min-height:300px}
/* office fidelity */
.sheet td.wrap{white-space:normal;word-break:break-word;line-height:1.25;padding-block:2px}
.sheet td{vertical-align:bottom}
.orig-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);font-size:13px;position:sticky;top:0;z-index:3}
.orig-bar svg{width:16px;height:16px;color:var(--accent)}
.orig-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
#docxPages .docx-wrapper{background:transparent!important;padding:24px 12px!important}
#docxPages .docx-wrapper>section.docx{box-shadow:0 1px 3px rgba(0,0,0,.12),0 12px 32px -12px rgba(0,0,0,.25)!important;margin-bottom:24px!important;color-scheme:light}
/* connect / poster */
.poster-in{padding:28px;display:flex;flex-direction:column;gap:22px}
.poster-brand{display:flex;align-items:center;gap:14px}
.poster-brand b{display:block;font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.poster-brand span{font-size:13px;color:var(--ink-3)}
.poster-steps{display:flex;flex-direction:column;gap:18px}
.pstep{display:grid;grid-template-columns:auto minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center}
.pstep b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600}
.pstep span{font-size:13px;color:var(--ink-2);word-break:break-all}
.pnum{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:14px}
.pqr{width:220px;max-width:100%;aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.poster-foot{margin:0;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:560px){.pstep{grid-template-columns:auto minmax(0,1fr)}.pstep>div:last-child{grid-column:1/-1}}
@media print{body *{visibility:hidden!important}#poster,#poster *{visibility:visible!important}#poster{position:absolute;left:0;top:0;width:100%;border:0;box-shadow:none;background:#fff;color:#111}.pstep{grid-template-columns:auto 260px 1fr}.pqr{width:260px}}
/* responsive */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:75;transform:translateX(-100%);transition:transform .25s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:var(--shadow-lg)}
  .menu-btn{display:inline-flex}
  .org{grid-template-columns:minmax(0,1fr)}
  .pdf-layout{grid-template-columns:minmax(0,1fr)}.thumbs{display:none}
  .top .search kbd,.presence{display:none}
  .two-col{grid-template-columns:minmax(0,1fr)!important}
}
@media (max-width:640px){.sites-sum{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.kpis,.quick{grid-template-columns:minmax(0,1fr)}.page-head h1{font-size:23px}.hide-sm{display:none!important}.uitem{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function putBlob(blob,type){
  if(S.mode!=='live'){return {id:'local-'+uid(),url:URL.createObjectURL(blob),sizeBytes:blob.size,local:blob}}
  if(!S.cap.assets)throw {message:'Your access level cannot store files. Ask the File Org owner for Contributor access.'};
  try{return await S.cap.assets.upload(blob,type?{type}:undefined)}catch(e){if(e.code==='too_large')throw {message:'That file is over the 20 MB limit.'};if(e.code==='unsupported_type')throw {message:'That file type cannot be stored as-is.'};throw e}
}
async function putEnvelope(obj){const blob=new Blob([JSON.stringify(obj)],{type:'application/json'});return putBlob(blob,'application/json')}
async function fetchFile(f){
  if(S.mode==='local')return LocalAPI.fetch(f);
  if(f.demo)return demoContent(f);
  if(f._blob)return f.store==='env'?JSON.parse(await f._blob.text()):await f._blob.arrayBuffer();
  const r=await fetch(f.url);if(!r.ok)throw new Error('Could not open the stored file ('+r.status+').');
  return f.store==='env'?r.json():r.arrayBuffer();
}

async function updateFileContent(f,blobOrEnv,isEnv){
  if(S.mode==='local')return LocalAPI.replace(f,blobOrEnv,isEnv);
  const up=isEnv?await putEnvelope(blobOrEnv):await putBlob(blobOrEnv,blobOrEnv.type);

/* ================= naming convention ================= */
function seg(s,fallback='UNSPECIFIED'){const v=String(s||'').trim().toUpperCase().replace(/&/g,' AND ').replace(/[^A-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);return v||fallback}
function fmtDate(iso,fmt=S.config.dateFormat){if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return 'NODATE';const [y,m,d]=iso.split('-');return {YYYYMMDD:y+m+d,'YYYY-MM-DD':`${y}-${m}-${d}`,DDMMYYYY:d+m+y,MMDDYYYY:m+d+y}[fmt]||y+m+d}
function buildName(f,ext){
  const date=fmtDate(f.date);let parts;
  if(f.category==='TR')parts=['TR',date,seg(f.gate,'GATE'),seg(f.site,'SITE'),seg(f.damage,'DAMAGE')];
  else if(f.category==='PMS')parts=['TR',date,seg(f.place||f.site,'PLACE'),'PMS'];
  else parts=['DOC',date,seg(f.title,'UNTITLED')];
  return parts.join('_')+(ext?'.'+ext:'');
}
function nameHtml(n){const p=n.split('_');return p.map((s,i)=>{const c=i===0&&s==='TR'?(n.includes('_PMS')?'seg-pms':'seg-tr'):(s.startsWith('PMS')?'seg-pms':'');return `<span class="${c}">${esc(s)}</span>`}).join('<span class="muted">_</span>')}
function normSite(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function canonSite(s){const n=normSite(s);if(!n)return '';const hit=(S.config.sites||[]).find(x=>normSite(x)===n);return hit||String(s).trim().replace(/\//g,'-')}
function isKnownSite(s){const n=normSite(s);return !!n&&(S.config.sites||[]).some(x=>normSite(x)===n)}
function siteOf(f){return canonSite(f.fields?.site)||(f.folder||'').split('/')[0]||'Unassigned'}
function folderFor(cat,iso,site){const st=canonSite(site)||'Unassigned';const c=(CATS[cat]||CATS.OTHER).folder;if(!iso||!/^\d{4}-\d{2}/.test(iso))return `${st}/${c}/Undated`;const [y,m]=iso.split('-');return `${st}/${c}/${y}/${m}-${MONTHS[+m-1]}`}

let firstData={files:false};
function subscribe(){
  const db=S.cap.db;const t=setTimeout(()=>{if(!firstData.files){S.loadSlow=true;softRender()}},10000);
  db.collection('files').onSnapshot(s=>{S.files=s.docs.map(d=>({id:d.id,...d.data()}));firstData.files=true;clearTimeout(t);wantNames(S.files.flatMap(f=>[f.ownerId,f.updatedBy]));softRender()},e=>{firstData.files=true;S.dbError=dbErr(e);softRender()});
  db.collection('folders').onSnapshot(s=>{S.folders=s.docs.map(d=>({id:d.id,...d.data()}));softRender()},()=>{});
  db.collection('messages').orderBy('created','desc').limit(400).onSnapshot(s=>{S.messages=s.docs.map(d=>({id:d.id,...d.data()})).reverse();wantNames(S.messages.map(m=>m.uid));onMessages()},()=>{});
  db.collection('activity').orderBy('created','desc').limit(200).onSnapshot(s=>{S.activity=s.docs.map(d=>({id:d.id,...d.data()}));wantNames(S.activity.map(a=>a.uid));softRender()},()=>{});
  db.collection('profiles').onSnapshot(s=>{S.profiles={};s.docs.forEach(d=>S.profiles[d.id]=d.data());softRender()},()=>{});
  db.doc('config/naming').onSnapshot(d=>{if(d.exists)S.config={...S.config,...d.data()};softRender()},()=>{});
}

function fileRows(list,{compact}={}){
  if(!list.length)return `<div class="empty">${I('folder')}<b>No files here yet</b><span>Upload a report and the AI will name and file it for you.</span><button class="btn primary" onclick="location.hash='#upload'">${I('upload')}Upload files</button></div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Type</th>${compact?'':'<th class="hide-sm">Site / place</th><th class="hide-sm">Report date</th><th class="hide-sm">Owner</th>'}<th>Updated</th><th></th></tr></thead><tbody>${list.map(f=>`<tr data-fid="${f.id}"><td><div class="fname">${ficon(f.kind,f.ext)}<div style="min-width:0"><div class="code" title="${esc(f.name)}">${esc(f.name)}</div><div class="muted" style="font-size:11.5px">${esc(f.folder)}</div></div>${starred(f)?`<span class="star">${I('star')}</span>`:''}</div></td><td>${catChip(f.category)}${f.pending||f.pendingEdit?' <span class="chip brass">Waiting to upload</span>':''}${(f.ai?.confidence??1)<0.6?' <span class="chip brass">Review</span>':''}</td>${compact?'':`<td class="hide-sm">${esc(f.fields?.site||f.fields?.place||'—')}</td><td class="hide-sm num">${esc(f.date||'—')}</td><td class="hide-sm"><div style="display:flex;align-items:center;gap:8px">${avatar(f.ownerId)}<span>${esc(nameOf(f.ownerId))}</span></div></td>`}<td class="muted num" style="white-space:nowrap">${ago(f.updated)}</td><td style="width:40px"><button class="btn sm icon ghost" data-more="${f.id}" aria-label="File actions">${I('more')}</button></td></tr>`).join('')}</tbody></table></div>`;
}
function bindFileRows(root){
  $$('[data-fid]',root).forEach(tr=>{tr.onclick=e=>{if(e.target.closest('[data-more]'))return;const f=fileById(tr.dataset.fid);f&&openFile(f)};tr.oncontextmenu=e=>{e.preventDefault();const f=fileById(tr.dataset.fid);f&&fileMenu(f,e.clientX,e.clientY)}});
  $$('[data-more]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();const f=fileById(b.dataset.more);const r=b.getBoundingClientRect();f&&fileMenu(f,r.right-190,r.bottom+4)});
}
function loadingNote(){return S.mode==='live'&&!firstData.files?`<div class="empty"><span class="spinner"></span><span>${S.loadSlow?'The library is taking longer than usual to load. It will appear here as soon as it connects.':'Loading the company library…'}</span></div>`:''}

/* ---------- dashboard ---------- */
VIEWS.dashboard={html(){
  const me=S.me.id||'me';const files=live();const h=new Date().getHours();
  const greet=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  const mine=files.filter(f=>f.ownerId===me||f.updatedBy===me).sort((a,b)=>b.updated-a.updated).slice(0,6);
  const recent=files.slice().sort((a,b)=>b.updated-a.updated).slice(0,6);
  const review=files.filter(f=>(f.ai?.confidence??1)<0.6||f.category==='OTHER'&&/SCAN|UNTITLED|NODATE/.test(f.name)).slice(0,5);
  const wk=Date.now()-7*86400000;
  const msgs=S.messages.filter(m=>m.channel==='general').slice(-4);
  return `<div class="card hello"><div><div class="eyebrow">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</div><h1>${greet}, ${esc((S.me.name||'').split(' ')[0]||'there')}</h1><p class="sub">${files.filter(f=>f.created>wk).length} files added this week · ${files.filter(f=>f.category==='TR'&&f.created>wk).length} new technical reports · ${review.length} awaiting review</p></div><button class="btn primary" onclick="location.hash='#upload'">${I('sparkle')}Upload with AI naming</button></div>
  ${loadingNote()}
  <div class="quick" style="margin-bottom:18px">
    <button data-q="upload"><span class="qi" style="background:var(--accent-soft);color:var(--accent)">${I('sparkle')}</span><b>AI Upload</b><span>Auto-name to TR or PMS format</span></button>
    <button data-q="word"><span class="qi" style="background:var(--pms-soft);color:var(--pms)">${I('doc')}</span><b>New report</b><span>Start from a TR or PMS template</span></button>
    <button data-q="excel"><span class="qi" style="background:var(--accent-soft);color:var(--ok)">${I('sheet')}</span><b>New spreadsheet</b><span>Checklists, logs and budgets</span></button>
    <button data-q="pdf"><span class="qi" style="background:var(--tr-soft);color:var(--tr)">${I('pdf')}</span><b>Edit a PDF</b><span>Annotate, sign, merge pages</span></button>
  </div>
  <div class="grid two-col" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)">
    <div class="grid">
      <div class="card"><div class="card-h"><h3>Recently updated</h3><a href="#files" class="btn sm ghost">Open organizer</a></div>${fileRows(recent,{compact:true})}</div>
      <div class="card"><div class="card-h"><h3>My files</h3><span class="muted" style="font-size:12px">${mine.length} recent</span></div>${mine.length?fileRows(mine,{compact:true}):`<div class="empty"><span>Files you upload or edit show up here.</span></div>`}</div>
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h"><h3>Needs review</h3>${review.length?`<span class="chip brass">${review.length}</span>`:''}</div><div class="card-b" style="padding-top:6px;padding-bottom:6px">${review.length?review.map(f=>`<div class="act" data-fid="${f.id}" style="cursor:pointer">${ficon(f.kind,f.ext)}<div style="min-width:0"><div class="mono" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.name)}</div><div class="muted" style="font-size:12px">AI confidence ${Math.round((f.ai?.confidence??0)*100)}% · check the naming fields</div></div></div>`).join(''):`<p class="muted" style="margin:10px 0">Every file has a confident name. Nice.</p>`}</div></div>
      <div class="card"><div class="card-h"><h3>#general</h3><button class="btn sm ghost" onclick="location.hash='#chat'">Open chat</button></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">${msgs.length?msgs.map(m=>`<div style="display:flex;gap:10px">${avatar(m.uid)}<div style="min-width:0"><b style="font-size:13px">${esc(nameOf(m.uid))}</b> <span class="muted" style="font-size:11px">${ago(m.created)}</span><div style="font-size:13px;color:var(--ink-2)">${esc(m.text)}</div></div></div>`).join(''):'<p class="muted" style="margin:0">No messages yet. Say hello to the team.</p>'}</div></div>
      <div class="card"><div class="card-h"><h3>Team activity</h3><a href="#activity" class="btn sm ghost">View all</a></div><div class="card-b" style="padding-top:4px;padding-bottom:4px">${actRows(S.activity.slice(0,5))}</div></div>
    </div>
  </div>`},
  bind(v){bindFileRows(v);$$('[data-q]',v).forEach(b=>b.onclick=()=>{const q=b.dataset.q;if(q==='word'){newWordFromTemplate()}else if(q==='excel'){S.open.excel=null;EDITORS.excel.newBlank=true;location.hash='#excel'}else location.hash='#'+q})}};
function actRows(list){if(!list.length)return '<p class="muted" style="margin:10px 0">No activity yet.</p>';return list.map(a=>`<div class="act">${avatar(a.uid)}<div style="min-width:0"><b>${esc(nameOf(a.uid))}</b> ${esc(a.action)} ${a.fileId&&fileById(a.fileId)?`<a href="#" data-open="${a.fileId}" class="mono" style="font-size:12px;color:var(--accent);word-break:break-all">${esc(a.target)}</a>`:`<span class="mono" style="font-size:12px;word-break:break-all">${esc(a.target)}</span>`}</div><span class="t">${ago(a.created)}</span></div>`).join('')}
document.addEventListener('click',e=>{const a=e.target.closest('[data-open]');if(a){e.preventDefault();const f=fileById(a.dataset.open);f&&openFile(f)}});

/* ---------- overview ---------- */
VIEWS.overview={html(){
  const files=live();const tr=files.filter(f=>f.category==='TR'),pms=files.filter(f=>f.category==='PMS'),oth=files.filter(f=>f.category==='OTHER');
  const bytes=files.reduce((s,f)=>s+(+f.size||0),0);
  const now=new Date();const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),tr:0,pms:0,oth:0})}
  files.forEach(f=>{const d=new Date(f.created);const mo=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(mo)mo[f.category==='TR'?'tr':f.category==='PMS'?'pms':'oth']++});
  const max=Math.max(1,...months.map(m=>m.tr+m.pms+m.oth));
  const tally=(arr,fn)=>{const t={};arr.forEach(f=>{const k=fn(f);if(k)t[k]=(t[k]||0)+1});return Object.entries(t).sort((a,b)=>b[1]-a[1])};
  const sites=tally(files,f=>siteOf(f)).slice(0,7);const smax=Math.max(1,...sites.map(s=>s[1]));
  const dmg=tally(tr,f=>(f.fields?.damage||'').trim()).slice(0,6);const dmax=Math.max(1,...dmg.map(s=>s[1]));
  const kinds=tally(files,f=>f.kind);const KC={pdf:'#B5413A',doc:'#2D5DA8',sheet:'#2B7A4B',img:'#7C5BA6',other:'#6B7570'},KL={pdf:'PDF',doc:'Word',sheet:'Excel',img:'Image',other:'Other'};
  let acc=0;const total=files.length||1;const grad=kinds.map(([k,n])=>{const a=acc/total*360;acc+=n;return `${KC[k]} ${a}deg ${acc/total*360}deg`}).join(',')||'var(--sunk) 0 360deg';
  const contrib=tally(files,f=>f.ownerId).slice(0,5);
  const wk=Date.now()-30*86400000;
  return `<div class="page-head"><div><div class="eyebrow">Company-wide</div><h1>Overview</h1><p class="sub">How documentation is flowing across sites, gates and maintenance programs.</p></div></div>${loadingNote()}
  <div class="kpis" style="margin-bottom:16px">
    <div class="card kpi"><div class="l">${I('file')}Documents</div><div class="v num">${files.length}</div><div class="d">${files.filter(f=>f.created>wk).length} added in the last 30 days</div></div>
    <div class="card kpi"><div class="l"><span class="dot" style="background:var(--tr)"></span>Technical reports</div><div class="v num">${tr.length}</div><div class="d">${tally(tr,f=>f.fields?.site).length} sites reported damage</div></div>
    <div class="card kpi"><div class="l"><span class="dot" style="background:var(--pms)"></span>PMS records</div><div class="v num">${pms.length}</div><div class="d">${tally(pms,f=>f.fields?.place).length} places maintained</div></div>
    <div class="card kpi"><div class="l">${I('folder')}Storage used</div><div class="v num">${fmtBytes(bytes)}</div><div class="d">${oth.length} general documents</div></div>
  </div>
  <div class="grid two-col" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Uploads per month</h3><div class="legend"><span><i class="dot" style="background:var(--tr)"></i>TR</span><span><i class="dot" style="background:var(--pms)"></i>PMS</span><span><i class="dot" style="background:var(--oth)"></i>General</span></div></div><div class="card-b"><div class="bars">${months.map(m=>{const t=m.tr+m.pms+m.oth;return `<div class="b" title="${t} files"><small class="num" style="color:var(--ink-2)">${t||''}</small><div class="stack" style="height:${Math.max(3,t/max*140)}px">${m.tr?`<i style="height:${m.tr/t*100}%;background:var(--tr)"></i>`:''}${m.pms?`<i style="height:${m.pms/t*100}%;background:var(--pms)"></i>`:''}${m.oth?`<i style="height:${m.oth/t*100}%;background:var(--oth)"></i>`:''}</div><small>${MONTHS[m.m]}</small></div>`}).join('')}</div></div></div>
    <div class="card"><div class="card-h"><h3>File formats</h3></div><div class="card-b donut-wrap"><div style="width:130px;height:130px;border-radius:50%;background:conic-gradient(${grad});display:grid;place-items:center;flex:none"><div style="width:84px;height:84px;border-radius:50%;background:var(--panel);display:grid;place-items:center;text-align:center"><div><div style="font-family:var(--f-display);font-size:22px;font-weight:600" class="num">${files.length}</div><div class="muted" style="font-size:11px">files</div></div></div></div><div style="display:flex;flex-direction:column;gap:8px;font-size:13px">${kinds.map(([k,n])=>`<span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${KC[k]}"></i>${KL[k]}<b class="num" style="margin-left:auto;padding-left:18px">${n}</b></span>`).join('')||'<span class="muted">No files yet</span>'}</div></div></div>
  </div>
  <div class="grid two-col" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <div class="card"><div class="card-h"><h3>Files by site</h3></div><div class="card-b">${sites.map(([k,n])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(k)}">${esc(k)}</span><div class="t"><i style="width:${n/smax*100}%"></i></div><b class="num">${n}</b></div>`).join('')||'<p class="muted" style="margin:0">Sites appear once reports are uploaded.</p>'}</div></div>
    <div class="card"><div class="card-h"><h3>Damage reported</h3></div><div class="card-b">${dmg.map(([k,n])=>`<div class="hbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="t"><i style="width:${n/dmax*100}%;background:var(--tr)"></i></div><b class="num">${n}</b></div>`).join('')||'<p class="muted" style="margin:0">No damage reports yet.</p>'}</div></div>
    <div class="card"><div class="card-h"><h3>Top contributors</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:10px">${contrib.map(([id,n])=>`<div style="display:flex;align-items:center;gap:10px">${avatar(id)}<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(nameOf(id))}</span><b class="num">${n}</b></div>`).join('')||'<p class="muted" style="margin:0">No uploads yet.</p>'}</div></div>
  </div>`}};

/* ---------- file organizer ---------- */
VIEWS.files={html(){
  const o=S.org;const me=S.me.id||'me';
  let list=live();
  if(o.path)list=list.filter(f=>(f.folder||'')===o.path||(f.folder||'').startsWith(o.path+'/'));
  if(o.filter==='TR'||o.filter==='PMS'||o.filter==='OTHER')list=list.filter(f=>f.category===o.filter);
  if(o.filter==='star')list=list.filter(starred);if(o.filter==='mine')list=list.filter(f=>f.ownerId===me);
  if(o.q){const q=o.q.toLowerCase();list=list.filter(f=>[f.name,f.originalName,f.folder,f.ai?.summary,...Object.values(f.fields||{})].join(' ').toLowerCase().includes(q))}
  const sorters={updated:(a,b)=>b.updated-a.updated,name:(a,b)=>a.name.localeCompare(b.name),date:(a,b)=>String(b.date).localeCompare(String(a.date)),size:(a,b)=>(b.size||0)-(a.size||0)};
  list.sort(sorters[o.sort]||sorters.updated);
  const folders=allFolders();const count=p=>live().filter(f=>(f.folder||'')===p||(f.folder||'').startsWith(p+'/')).length;
  const tree=`<button class="${!o.path?'on':''}" data-path="">${I('folder')}All files<span class="c">${live().length}</span></button>`+folders.map(p=>{const d=p.split('/').length-1;const nm=p.split('/').pop();return `<button class="${o.path===p?'on':''}" data-path="${esc(p)}" style="padding-left:${8+d*16}px">${I('folder')}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm)}</span><span class="c">${count(p)}</span></button>`}).join('');
  const crumbs=o.path?['',...o.path.split('/')].map((s,i,a)=>i===0?`<button data-path="">All files</button>`:`<span>/</span><button data-path="${esc(a.slice(1,i+1).join('/'))}">${esc(s)}</button>`).join(''):'<span>All files</span>';
  return `<div class="page-head"><div><div class="eyebrow">Library</div><h1>File Organizer</h1><p class="sub">Reports are filed automatically by type, year and month. Right-click any file for more actions.</p></div><div class="toolbar"><button class="btn" id="newFolder">${I('plus')}New folder</button><button class="btn primary" onclick="location.hash='#upload'">${I('upload')}Upload</button></div></div>${loadingNote()}
  <div class="org"><div class="card tree" id="tree">${tree}</div>
  <div class="card" style="min-width:0"><div class="card-h" style="flex-wrap:wrap"><div class="crumbs">${crumbs}</div><div class="toolbar">
    <div class="seg" role="group" aria-label="Filter">${[['all','All'],['TR','TR'],['PMS','PMS'],['OTHER','General'],['star','Starred'],['mine','Mine']].map(([k,l])=>`<button class="${o.filter===k?'on':''}" data-filter="${k}">${l}</button>`).join('')}</div>
    <select class="select input" id="orgSort" style="width:auto;height:34px"><option value="updated">Last updated</option><option value="date">Report date</option><option value="name">Name</option><option value="size">Size</option></select>
    <div class="seg"><button class="${o.view==='list'?'on':''}" data-view="list" aria-label="List view">${I('list','')}</button><button class="${o.view==='grid'?'on':''}" data-view="grid" aria-label="Grid view">${I('grid')}</button></div></div></div>
    ${o.q?`<div style="padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px">${list.length} result${list.length===1?'':'s'} for <b>${esc(o.q)}</b> <button class="btn sm ghost" id="clearQ">Clear search</button></div>`:''}
    ${o.view==='grid'&&list.length?`<div class="card-b fgrid">${list.map(f=>`<div class="card ftile" data-fid="${f.id}"><div class="row">${ficon(f.kind,f.ext)}<div style="display:flex;gap:4px;align-items:center">${catChip(f.category)}<button class="btn sm icon ghost" data-more="${f.id}" aria-label="File actions">${I('more')}</button></div></div><div class="code">${esc(f.name)}</div><div class="row muted" style="font-size:12px"><span>${esc(f.fields?.site||f.fields?.place||f.folder.split('/')[0])}</span><span>${ago(f.updated)}</span></div></div>`).join('')}</div>`:fileRows(list)}
  </div></div>`},
  bind(v){
    $$('#tree [data-path], .crumbs [data-path]',v).forEach(b=>b.onclick=()=>{S.org.path=b.dataset.path;renderView()});
    $$('[data-filter]',v).forEach(b=>b.onclick=()=>{S.org.filter=b.dataset.filter;renderView()});
    $$('[data-view]',v).forEach(b=>b.onclick=()=>{S.org.view=b.dataset.view;store.set('orgView',S.org.view);renderView()});
    const so=$('#orgSort',v);so.value=S.org.sort;so.onchange=()=>{S.org.sort=so.value;renderView()};
    $('#clearQ',v)&&($('#clearQ',v).onclick=()=>{S.org.q='';$('#gsearch').value='';renderView()});
    $('#newFolder',v).onclick=async()=>{const n=await promptBox('New folder',S.org.path?`Inside ${S.org.path}`:'Folder name');if(!n)return;const path=(S.org.path?S.org.path+'/':'')+n.replace(/\//g,'-');try{await DB.add('folders',{path,created:Date.now(),by:S.me.id});S.org.path=path;logAct('created folder',path);renderView()}catch(e){toast(dbErr(e),true)}};
    bindFileRows(v);$$('.ftile',v).forEach(t=>t.onclick=e=>{if(e.target.closest('[data-more]'))return;openFile(fileById(t.dataset.fid))});
  }};

/* ---------- activity ---------- */
VIEWS.activity={html(){return `<div class="page-head"><div><div class="eyebrow">Audit trail</div><h1>Activity Log</h1><p class="sub">Every upload, edit, rename, move and deletion across the company library.</p></div></div><div class="card"><div class="card-b" style="padding-top:4px;padding-bottom:4px">${actRows(S.activity)}</div></div>`}};

/* ---------- trash ---------- */
VIEWS.trash={html(){const t=S.files.filter(f=>f.trashed).sort((a,b)=>(b.trashedAt||0)-(a.trashedAt||0));return `<div class="page-head"><div><div class="eyebrow">Recovery</div><h1>Trash</h1><p class="sub">Files stay here until someone deletes them permanently.</p></div></div><div class="card">${t.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Deleted by</th><th>Deleted</th><th></th></tr></thead><tbody>${t.map(f=>`<tr style="cursor:default"><td><div class="fname">${ficon(f.kind,f.ext)}<span class="code">${esc(f.name)}</span></div></td><td>${esc(nameOf(f.trashedBy))}</td><td class="muted">${ago(f.trashedAt||f.updated)}</td><td style="white-space:nowrap;text-align:right"><button class="btn sm" data-restore="${f.id}">${I('restore')}Restore</button> <button class="btn sm ghost danger" data-purge="${f.id}">Delete forever</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${I('trash')}<b>Trash is empty</b><span>Deleted files will appear here.</span></div>`}</div>`},
  bind(v){$$('[data-restore]',v).forEach(b=>b.onclick=async()=>{const f=fileById(b.dataset.restore);try{await DB.update('files',f.id,{trashed:false});logAct('restored',f.name,f.id);toast('Restored to '+f.folder)}catch(e){toast(dbErr(e),true)}});
  $$('[data-purge]',v).forEach(b=>b.onclick=async()=>{const f=fileById(b.dataset.purge);if(!await confirmBox('Delete forever?',`${f.name} will be permanently deleted. This cannot be undone.`,'Delete forever',true))return;try{await DB.del('files',f.id);if(S.cap.assets&&f.assetId&&!String(f.assetId).startsWith('local'))S.cap.assets.delete(f.assetId).catch(()=>{});logAct('permanently deleted',f.name);toast('Deleted')}catch(e){toast(dbErr(e),true)}})}};

/* ---------- naming rules ---------- */
VIEWS.rules={html(){const c=S.config;const ex={category:'TR',date:isoToday(),gate:c.gates[0]||'Gate 1',site:c.sites[0]||'North Yard',damage:c.damageTypes[0]||'Crack'};
  return `<div class="page-head"><div><div class="eyebrow">Company standard</div><h1>Naming Rules</h1><p class="sub">The AI uses these conventions and lists when it names uploaded files. Changes apply to everyone.</p></div><button class="btn primary" id="saveRules">${I('save')}Save rules</button></div>
  <div class="grid two-col" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
    <div class="card"><div class="card-h"><h3>Conventions</h3></div><div class="card-b" style="display:flex;flex-direction:column;gap:14px">
      <div><div class="eyebrow">Technical report</div><div class="proposed">TR_<span class="muted">DATE</span>_<span class="muted">GATE-OR-PLACE</span>_<span class="muted">SITENAME</span>_<span class="muted">DAMAGE</span></div><div class="muted mono" style="font-size:12px;margin-top:6px" id="exTR">${esc(buildName(ex,'pdf'))}</div></div>

      <p class="muted" style="margin:0;font-size:12.5px">Words are upper-cased and spaces become hyphens, so "Pump House 2" becomes PUMP-HOUSE-2. Files are filed under Type / Year / Month.</p>
